<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">追加5500亿元地方债额度：稳增长力度与财政边界</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">追加5500亿元地方政府债券额度，体现出稳增长与财政纪律之间的平衡。理解这项安排，需要把名义额度、第四季度可用财政空间、发行节</tspan><tspan x="72" y="162">奏、资金拨付、项目开工和地方债风险拆开观察，并检验高技术与重点投资是否真正形成有效需求和长期现金流。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="231" y="458">额度获批后要落实发行计划</tspan><tspan x="231" y="488">与地区分配</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="613" y="458">资金拨付并匹配项目资本</tspan><tspan x="613" y="488">金、采购和施工进度</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="995" y="458">高技术与重点投资转化为产</tspan><tspan x="995" y="488">能、就业和现金流</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="1377" y="458">用增长质量与地方债风险检</tspan><tspan x="1377" y="488">验政策效果</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
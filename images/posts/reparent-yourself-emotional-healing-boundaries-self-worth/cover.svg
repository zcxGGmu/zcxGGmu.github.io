<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">《把自己重新养一遍》：成年人的自愈，是亲手养育曾经受伤的自己</title>
  <desc id="desc">重养自己不是沉溺过去，而是重新建立自我滋养、情绪稳定、课题分离、自我价值、关系边界和持续成长的能力。</desc>

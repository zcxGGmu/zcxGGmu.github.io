<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#46766e"/><stop offset="1" stop-color="#d18b50"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d18b50"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">AI内存供应紧张：长上下文、推理并发与CXL池化的系统取舍</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">长上下文</tspan></text><text x="236" y="490" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="236" y="490">单次任务需要容纳更多上下文</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">推理并发</tspan></text><text x="620" y="490" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="620" y="490">多请求叠加工作集与内存占用</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">架构方向</tspan></text><text x="1004" y="490" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="1004" y="490">计算与内存资源可分开扩展</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">CXL池化</tspan></text><text x="1388" y="490" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="1388" y="490">共享容量方向，性能数据未提供</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
<text x="68" y="73" text-anchor="start" font-size="38" font-weight="650" fill="#fff"><tspan x="68" y="73">关键数据与口径边界</tspan></text><text x="70" y="145" text-anchor="start" font-size="21" font-weight="650" fill="#eef6f2"><tspan x="70" y="145">周末四重利好：新质生产力、公募规则、财政托底与数据如何进入定价</tspan></text><rect x="60" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#2d6570" stroke-width="4"/><rect x="60" y="320" width="350" height="14" fill="#2d6570"/><text x="235" y="415" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="235" y="415">四个主题</tspan></text><text x="235" y="494" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="235" y="494">新质生产力、公募规则、财政托底、</tspan><tspan x="235" y="516">数据进入定价</tspan></text><rect x="445" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#d48745" stroke-width="4"/><rect x="445" y="320" width="350" height="14" fill="#d48745"/><text x="620" y="415" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="620" y="415">量化细节未提供</tspan></text><text x="620" y="505" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="620" y="505">公开材料未给出可核对的规模与时点</tspan></text><rect x="830" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#4f8a65" stroke-width="4"/><rect x="830" y="320" width="350" height="14" fill="#4f8a65"/><text x="1005" y="415" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="1005" y="415">预期→资金</tspan></text><text x="1005" y="505" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="1005" y="505">政策信号需要经过持仓与交易验证</tspan></text><rect x="1215" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#9a5d57" stroke-width="4"/><rect x="1215" y="320" width="350" height="14" fill="#9a5d57"/><text x="1390" y="415" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="1390" y="415">盈利兑现</tspan></text><text x="1390" y="505" text-anchor="middle" 
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#4d5277"/><stop offset="1" stop-color="#b97862"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#b97862"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">七、跟踪中微公司平台化，重点看产品验证是否转为可持续回报</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">平台化兑现要由多品类量产、重复采购和现金回报证明，估值判断应保留验证期的不确定性。</tspan></text>
<rect x="68" y="355" width="430" height="205" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><text x="98" y="399" font-size="17" font-weight="700" fill="#347a73">环节 01</text><text x="283" y="469" text-anchor="middle" font-size="25" font-weight="700" fill="#20343b"><tspan x="283" y="469">量产进度</tspan></text><path d="M506 458H559" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="578" y="355" width="430" height="205" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><text x="608" y="399" font-size="17" font-weight="700" fill="#df8b4c">环节 02</text><text x="793" y="469" text-anchor="middle" font-size="25" font-weight="700" fill="#20343b"><tspan x="793" y="469">重复采购</tspan></text><path d="M1016 458H1069" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1088" y="355" width="430" height="205" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><text x="1118" y="399" font-size="17" font-weight="700" fill="#b94f4f">环节 03</text><text x="1303" y="469" text-anchor="middle" font-size="25" font-weight="700" fill="#20343b"><tspan x="1303" y="469">经营现金流</tspan></text><rect x="68" y="625" width="1450" height="112" rx="10" fill="#e5eeea"/><text x="98" y="672" font-size="17" font-weight="700" fill="#347a73">核心判断</text><text x="700" y="691" text-anchor="middle" font-size="23" font-weight="650" fill="#20343b"><tspan x="700" y="691">平台化兑现要由多品类量产、重复采购和现金回报证明，估值判断应保留验证期的不确定性。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">结构图用于解释机制，不表示具体幅度或确定因果</text></svg>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">存储半导体回调之后：HBM需求、供给扩张与估值重估</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">围绕存储半导体市场的回调、人工智能服务器需求与高带宽内存（HBM）供给，梳理价格周期、产能扩张和估值重估之间的传导关系。文章区分</tspan><tspan x="72" y="162">公开事实、行业判断与情景假设，强调以出货、库存、良率、资本开支和现金流验证需求质量。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="451" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="231" y="451">AI服务器需求：训练与</tspan><tspan x="231" y="478">推理负载形成存储带宽需</tspan><tspan x="231" y="505">求</tspan></text><path d="M404 390H436" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="613" y="465">有效供给：产能扩张经过</tspan><tspan x="613" y="492">良率和认证才可交付</tspan></text><path d="M786 390H818" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="451" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="995" y="451">价格利润：合同价格、产</tspan><tspan x="995" y="478">品组合和成本共同决定毛</tspan><tspan x="995" y="505">利</tspan></text><path d="M1168 390H1200" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="1377" y="465">估值验证：盈利与现金流</tspan><tspan x="1377" y="492">兑现后再评估周期位置</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
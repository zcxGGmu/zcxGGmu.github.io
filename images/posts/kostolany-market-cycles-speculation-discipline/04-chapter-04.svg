<rect x="80" y="80" width="1440" height="8" rx="4" fill="#0f766e"/><text x="80.0" y="148.0" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 04 / 06</tspan></text><text x="80.0" y="223.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">科斯托拉尼鸡蛋：六个阶段的市场循环</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">“科斯托拉尼鸡蛋”将行情划分为上涨侧和下跌侧，每侧各三个阶段：上涨侧为A1修正、A2相伴和A3过热，下跌侧为B1修正、B</tspan><tspan x="80.0" dy="35.0">2相伴和B3绝望。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="378.0" width="708.0" height="229.3" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="396.0" width="54" height="32" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-opacity="0.35"/><text x="127.0" y="419.0" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><text x="102.0" y="453.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">“科斯托拉尼鸡蛋”将行情划分为上…</tspan></text><text x="102.0" y="492.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">“科斯托拉尼鸡蛋”将行情划分为上涨侧和下跌侧，每侧各三个阶段：上涨侧为A1修正</tspan><tspan x="102.0" dy="24.1">、A2相伴和A3过热，下跌侧为B1修正、B2相伴和B3绝望。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="378.0" width="708.0" height="229.3" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="832.0" y="396.0" width="54" height="32" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-opacity="0.35"/><text x="859.0" y="419.0" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><text x="834.0" y="453.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">六阶段并非单纯按价格幅度排列，还…</tspan></text><text x="834.0" y="492.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">六阶段并非单纯按价格幅度排列，还结合成交量、市场参与者数量和筹码持有人变化，</tspan><tspan x="834.0" dy="24.1">用来描述周期中情绪与资产归属的转变。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="631.3" width="708.0" height="229.3" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="649.3" width="54" height="32" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-opacity="0.35"/><text x="127.0" y="672.3" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><text x="102.0" y="706.3" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">A1是熊市结束后的修正阶段。</tspan></text><text x="102.0" y="745.4" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">A1是熊市结束后的修正阶段。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="631.3" width="708.0" height="229.3" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="832.0" y="649.3" width="54" height="32" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-opacity="0.35"/><text x="859.0" y="672.3" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="834.0" y="706.3" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">市场交易清淡，股票受到的关注有限…</tspan></text><text x="834.0" y="745.4" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">市场交易清淡，股票受到的关注有限，成交量处于低位。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="884.7" width="708.0" height="229.3" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="902.7" width="54" height="32" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-opacity="0.35"/><text x="127.0" y="925.7" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">05</text><text x="102.0" y="959.7" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">经历下跌后，持仓意愿较强的买家开…</tspan></text><text x="102.0" y="998.7" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">经历下跌后，持仓意愿较强的买家开始逐步收集资产；若坏消息不再推动价格明显走低</tspan><tspan x="102.0" dy="24.1">，可能说明卖压已经减弱。</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">胜率只有51%，如何走过市场周期：财富自由、筹码与投机纪律 · 章节 04</tspan></text>

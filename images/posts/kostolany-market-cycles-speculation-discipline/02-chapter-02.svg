<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">市场与经济：长线同行，短线偏离</title><desc id="desc">市场与经济：长线同行，短线偏离：股市常被比作经济的晴雨表，由此容易形成一种线性预期：经济增长、企业盈利改善，股价就应上涨；失业上升、消费走弱，股价就应下跌。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e" stop-opacity="0.16"/><stop offset="1" stop-color="#0f766e" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#0f766e" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#0f766e"/><text x="80.0" y="148.0" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 02 / 06</tspan></text><text x="80.0" y="223.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">市场与经济：长线同行，短线偏离</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">股市常被比作经济的晴雨表，由此容易形成一种线性预期：经济增长、企业盈利改善，股价就应上涨；失业上升、消费走弱，股</tspan><tspan x="80.0" dy="35.0">价就应下跌。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="378.0" width="708.0" height="229.3" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="396.0" width="54" height="32" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-opacity="0.35"/><text x="127.0" y="419.0" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><text x="102.0" y="453.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">股市常被比作经济的晴雨表，由此容易形成一种线性预期</tspan></text><text x="102.0" y="492.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">股市常被比作经济的晴雨表，由此容易形成一种线性预期：经济增长、企业盈利改善，</tspan><tspan x="102.0" dy="24.1">股价就应上涨；失业上升、消费走弱，股价就应下跌。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="378.0" width="708.0" height="229.3" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="832.0" y="396.0" width="54" height="32" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-opacity="0.35"/><text x="859.0" y="419.0" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><text x="834.0" y="453.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">长期来看，企业经营和经济状况会影…</tspan></text><text x="834.0" y="492.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">长期来看，企业经营和经济状况会影响资产价值，但市场价格也会受资金条件、预期和</tspan><tspan x="834.0" dy="24.1">持仓者行为影响，所以两者未必在同一时间、以同一方向变化。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="631.3" width="708.0" height="229.3" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="649.3" width="54" height="32" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-opacity="0.35"/><text x="127.0" y="672.3" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><rect x="682.0" y="651.3" width="86.0" height="28" rx="14" fill="#0f766e" fill-opacity="0.12"/><text x="725.0" y="671.3" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">80年</text><text x="102.0" y="706.3" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">用于说明这种错位的历史例子是</tspan></text><text x="102.0" y="745.4" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">用于说明这种错位的历史例子是：20世纪70年代，德国和美国经济年增速超过4%，企业</tspan><tspan x="102.0" dy="24.1">利润增长，股市却低迷并下跌约十年；到了80年代初，欧洲失业率处于战后高位、传统</tspan><tspan x="102.0" dy="24.1">工业表现不佳，股市反而开启牛市。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="631.3" width="708.0" height="229.3" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="832.0" y="649.3" width="54" height="32" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-opacity="0.35"/><text x="859.0" y="672.3" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="834.0" y="706.3" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">例子的重点是经济数据和股价表现可…</tspan></text><text x="834.0" y="745.4" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">例子的重点是经济数据和股价表现可能出现阶段性背离，而不是据此否定经济基本面的</tspan><tspan x="834.0" dy="24.1">长期作用。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="884.7" width="708.0" height="229.3" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="902.7" width="54" height="32" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-opacity="0.35"/><text x="127.0" y="925.7" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">05</text><text x="102.0" y="959.7" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">“男人遛狗”的比喻将长期方向与中…</tspan></text><text x="102.0" y="998.7" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">“男人遛狗”的比喻将长期方向与中短期波动分开。</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">胜率只有51%，如何走过市场周期：财富自由、筹码与投机纪律 · 章节 02</tspan></text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">三、竞争壁垒要落在承保、服务和费用效率</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">品牌、系统与规模是竞争优势的可能来源；持续续保、风险筛选和费用效率才是可观察结果。</tspan></text>
<rect x="70" y="320" width="450" height="330" rx="16" fill="#fff" stroke="#347a73" stroke-width="3"/><rect x="70" y="320" width="450" height="12" rx="6" fill="#347a73"/><circle cx="118" cy="382" r="24" fill="#347a73"/><text x="118" y="389" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">01</text><text x="158" y="388" font-size="17" font-weight="700" fill="#347a73">关键维度</text><text x="295" y="456" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="295" y="456">客户与服务</tspan></text><path d="M100 493H490" stroke="#e3e9e5" stroke-width="2"/><text x="100" y="529" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="100" y="555" text-anchor="start" font-size="18" font-weight="500" fill="#30464d"><tspan x="100" y="555">保险业的竞争力可从客户触达、风险识别、理赔服</tspan><tspan x="100" y="582">务和资本运营几个环节检验。</tspan></text><rect x="100" y="607" width="390" height="16" rx="8" fill="#347a73" opacity="0.12"/><path d="M528 484H563" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="580" y="320" width="450" height="330" rx="16" fill="#fff" stroke="#df8b4c" stroke-width="3"/><rect x="580" y="320" width="450" height="12" rx="6" fill="#df8b4c"/><circle cx="628" cy="382" r="24" fill="#df8b4c"/><text x="628" y="389" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">02</text><text x="668" y="388" font-size="17" font-weight="700" fill="#df8b4c">关键维度</text><text x="805" y="456" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="805" y="456">风险识别</tspan></text><path d="M610 493H1000" stroke="#e3e9e5" stroke-width="2"/><text x="610" y="529" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="610" y="555" text-anchor="start" font-size="18" font-weight="500" fill="#30464d"><tspan x="610" y="555">承保系统的核心价值是将历史赔付经验、地区风</tspan><tspan x="610" y="582">险、客户特征、费率和核保规则相连。</tspan></text><rect x="610" y="607" width="390" height="16" rx="8" fill="#df8b4c" opacity="0.12"/><path d="M1038 484H1073" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1090" y="320" width="450" height="330" rx="16" fill="#fff" stroke="#b94f4f" stroke-width="3"/><rect x="1090" y="320" width="450" height="12" rx="6" fill="#b94f4f"/><circle cx="1138" cy="382" r="24" fill="#b94f4f"/><text x="1138" y="389" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">03</text><text x="1178" y="388" font-size="17" font-weight="700" fill="#b94f4f">关键维度</text><text x="1315" y="456" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="1315" y="456">规模效率与成本</tspan></text><path d="M1120 493H1510" stroke="#e3e9e5" stroke-width="2"/><text x="1120" y="529" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="1120" y="555" text-anchor="start" font-size="18" font-weight="500" fill="#30464d"><tspan x="1120" y="555">规模带来的风险分散、再保险谈判、数据积累和服</tspan><tspan x="1120" y="582">务网络，只有转化为单位费用下降、风险调整后…</tspan></text><rect x="1120" y="607" width="390" height="16" rx="8" fill="#b94f4f" opacity="0.12"/><rect x="70" y="692" width="1450" height="104" rx="14" fill="#e5eeea"/><rect x="70" y="692" width="14" height="104" rx="7" fill="#347a73"/><text x="112" y="735" font-size="17" font-weight="700" fill="#347a73">本节结论</text><text x="820" y="755" text-anchor="middle" font-size="22" font-weight="650" fill="#20343b"><tspan x="820" y="755">品牌、系统与规模是竞争优势的可能来源；持续续保、风险筛选和费用效率才是可观察结果。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">内容要点由章节正文提炼；结构图呈现机制，不替代数据核验</text></svg>
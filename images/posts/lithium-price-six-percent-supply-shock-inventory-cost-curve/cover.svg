  <title id="title">锂价单日跌超6%：供应收缩风险真的被低估了吗</title>
  <desc id="desc">从花旗周度材料框架与碳酸锂单日跌超6%的价格冲击出发，拆解储能需求恐慌、贸易商库存显性化、JXW云母矿停产、周度产量反增、成本曲线、政策扰动和锂矿/盐湖/正极产业链的验证顺序。</desc>

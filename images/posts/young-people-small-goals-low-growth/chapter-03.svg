eight="700" fill="#243b40"><tspan x="995" y="470">选择权</tspan></text><path d="M1168 452H1200" stroke="#d28745" stroke-width="6" marker-end="url(#a)"/><rect x="70" y="640" width="1450" height="88" rx="10" fill="#e5eeea"/><text x="795" y="685" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="795" y="685">结构图用于解释机制，具体幅度以正文口径为准</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">事实、估计与待核验项按正文口径区分</text></svg>
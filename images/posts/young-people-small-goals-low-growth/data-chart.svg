<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><defs><linearGradient id="h" x1="0" x2="1"><stop stop-color="#3f6f68"/><stop offset="1" stop-color="#d28745"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d28745"/></marker></defs><rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#h)"/><text x="70" y="75" text-anchor="start" font-size="38" font-weight="800" fill="#fff"><tspan x="70" y="75">关键数据与观察变量</tspan></text><text x="72" y="145" text-anchor="start" font-size="21" font-weight="500" fill="#f3f7f4"><tspan x="72" y="145">喝大水、睡大觉、练薄肌：低增长时代的目标降维与生活策略</tspan></text><rect x="70" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#3f6f68" stroke-width="4"/><circle cx="112" cy="398" r="22" fill="#3f6f68"/><text x="112" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">01</text><text x="235" y="454" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40"><tspan x="235" y="454">就业增速：放缓，具体数据</tspan><tspan x="235" y="486">未提供</tspan></text><path d="M408 452H440" stroke="#d28745" stroke-width="6" marker-end="url(#a)"/><rect x="450" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#d28745" stroke-width="4"/><circle cx="492" cy="398" r="22" fill="#d28745"/><text x="492" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">02</text><text x="615" y="454" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40"><tspan x="615" y="454">工资增速：低于期待，未给</tspan><tspan x="615" y="486">出量化口径</tspan></text><path d="M788 452H820" stroke="#d28745" stroke-width="6" marker-end="url(#a)"/><rect x="830" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#697f9c" stroke-width="4"/><circle cx="872" cy="398" r="22" fill="#697f9c"/><text x="872" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">03</text><text x="995" y="454" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40"><tspan x="995" y="454">目标成本：长期目标成本与</tspan><tspan x="995" y="486">不确定性上升</tspan></text><path d="M1168 452H1200" stroke="#d28745" stroke-width="6" marker-end="url(#a)"/><rect x="1210" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#3f6f68" stroke-width="4"/><circle cx="1252" cy="398" r="22" fill="#3f6f68"/><text x="1252" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">04</text><text x="1375" y="454" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40"><tspan x="1375" y="454">应对方向：健康、情绪等可</tspan><tspan x="1375" y="486">控事项</tspan></text><rect x="70" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#3f6f68" stroke-width="4"/><text x="235" y="430" text-anchor="middle" font-size="23" font-weight="700" fill="#243b40"><tspan x="235" y="430">就业增速：放缓，具体数据未提</tspan><tspan x="235" y="461">供</tspan></text><rect x="450" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#d28745" stroke-width="4"/><text x="615" y="430" text-anchor="middle" font-size="23" font-weight="700" fill="#243b40"><tspan x="615" y="430">工资增速：低于期待，未给出量</tspan><tspan x="615" y="461">化口径</tspan></text><rect x="830" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#697f9c" stroke-width="4"/><text x="995" y="430" text-anchor="middle" font-size="23" font-weight="700" fill="#243b40"><tspan x="995" y="430">目标成本：长期目标成本与不确</tspan><tspan x="995" y="461">定性上升</tspan></text><rect x="1210" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#3f6f68" stroke-width="4"/><text x="1375" y="430" text-anchor="middle" font-size="23" font-weight="700" fill="#243b40"><tspan x="1375" y="430">应对方向：健康、情绪等可控事</tspan><tspan x="1375" y="461">项</tspan></text><rect x="70" y="640" width="1450" height="88" rx="10" fill="#e5eeea"/><text x="795" y="685" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="795" y="685">信息卡仅呈现已确认口径或观察变量，不构造缺乏来源的趋势曲线</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">事实、估计与待核验项按正文口径区分</text></svg>
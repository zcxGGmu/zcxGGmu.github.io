<text x="70" y="135" font-family="Noto Sans SC,Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a">拼豆店的热潮与经营难题：低门槛不等于高利润</text>
<text x="70" y="175" font-family="Noto Sans SC,Arial,sans-serif" font-size="20" fill="#475569">拼豆以低成本、易上手和即时成就感成为热门手工体验，也吸引了创业者入场。拆解消</text>
<text x="70" y="205" font-family="Noto Sans SC,Arial,sans-serif" font-size="20" fill="#475569">费需求、门店收入与利润、同质化竞争、复购和创业风险，可以看清热度与可持续经营</text>

    <text x="132" y="707" fill="#f4a261" font-family="Noto Sans SC, PingFang SC, Arial" font-size="24" font-weight="700">16 min 深度梳理 · 科技投资 · 芯片 · 机器人</text>
  </g>
  <text x="92" y="132" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="48" font-weight="800">大盘低迷之后，为什么仍要保留科技投资的念想</text>
  <text x="96" y="344" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="29" font-weight="700">在成交额回落和估值偏高的环境下，用行业增速、渗透率、研发投入和盈利能力重新理解科技投资。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">从殖民地集市到联邦债务</title><desc id="desc">从殖民地集市到联邦债务：殖民地贸易、战争融资与新国家的信用困境。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity="0.16"/><stop offset="1" stop-color="#2563eb" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#2563eb" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#2563eb"/><text x="80.0" y="148.0" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 01 / 08</tspan></text><text x="80.0" y="223.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">从殖民地集市到联邦债务</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">殖民地贸易、战争融资与新国家的信用困境。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="343.0" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><rect x="678.0" y="363.0" width="90.0" height="28" rx="14" fill="#2563eb" fill-opacity="0.12"/><text x="723.0" y="383.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">1653年</text><text x="102.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">1653年</tspan></text><text x="102.0" y="460.7" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">1653年：曼哈顿南端修筑木墙，墙边道路后来称为华尔街</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="343.0" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><text x="834.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">殖民贸易</tspan></text><text x="834.0" y="460.7" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">殖民贸易：毛皮、小麦、烟草，也包括奴隶和契约佣工买卖</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="740.5" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="758.5" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="781.5" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><rect x="678.0" y="760.5" width="90.0" height="28" rx="14" fill="#2563eb" fill-opacity="0.12"/><text x="723.0" y="780.5" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">7500万</text><text x="102.0" y="815.5" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">独立战争</tspan></text><text x="102.0" y="858.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">独立战争：大陆币迅速贬值，联邦和各州留下合计约7500万美</tspan><tspan x="102.0" dy="29.5">元债务</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="740.5" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="758.5" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="781.5" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="834.0" y="815.5" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">债务信用</tspan></text><text x="834.0" y="858.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">债务信用：是否偿付战争债券影响新政府未来借款能力</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">华尔街的早期形成：从殖民贸易到铁路融资 · 章节 01</tspan></text>
</svg>
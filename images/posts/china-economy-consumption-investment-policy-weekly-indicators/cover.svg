<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">中国经济周度指标怎么读：消费、投资与政策的观察框架</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">用消费与出行、生产与投资、其他宏观活动、市场与政策四组指标搭建观察框架，说明房地产交易、航班客流、大宗需求与政府债券发行各自能回</tspan><tspan x="72" y="162">答什么问题，以及频率、口径与因果解释的边界。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="231" y="458">先确认指标统计对象、频</tspan><tspan x="231" y="488">率、期间与数据修订情况</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="613" y="458">把消费出行和生产投资拆成</tspan><tspan x="613" y="488">不同来源的活动信号</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="995" y="458">用房地产及其他宏观活动补</tspan><tspan x="995" y="488">充结构与行业差异</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="1377" y="458">结合市场政策时滞检验解</tspan><tspan x="1377" y="488">释，并区分事实与推断</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
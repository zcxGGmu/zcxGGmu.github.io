<rect x="80" y="80" width="1440" height="8" rx="4" fill="#2563eb"/><text x="80.0" y="148.0" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 05 / 05</tspan></text><text x="80.0" y="223.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">家庭关系可能成为微观层面的支持网络</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">亲密关系和家庭协作能够提供支持，但不能替代公共保障与稳定就业。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="343.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><text x="102.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">家庭关系可提供情绪支持、照护协作</tspan><tspan x="102.0" dy="28.1">…</tspan></text><text x="102.0" y="485.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">家庭关系可提供情绪支持、照护协作和资源共享</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="343.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="588.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="615.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><text x="590.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="590.0" dy="0.0">婚姻数量变化还受到年龄结构、婚育</tspan><tspan x="590.0" dy="28.1">…</tspan></text><text x="590.0" y="485.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">婚姻数量变化还受到年龄结构、婚育成本和长期</tspan><tspan x="590.0" dy="24.1">偏好影响</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="343.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="1076.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="1103.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><text x="1078.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="1078.0" dy="0.0">短期婚姻数据不能单独证明经济信心</tspan><tspan x="1078.0" dy="28.1">…</tspan></text><text x="1078.0" y="485.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">短期婚姻数据不能单独证明经济信心或偏好转向</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="608.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="626.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="649.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="102.0" y="683.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">家庭支持无法替代公共服务、劳动保</tspan><tspan x="102.0" dy="28.1">…</tspan></text><text x="102.0" y="750.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">家庭支持无法替代公共服务、劳动保障与稳定收</tspan><tspan x="102.0" dy="24.1">入</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="608.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="588.0" y="626.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="615.0" y="649.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">05</text><text x="590.0" y="683.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="590.0" dy="0.0">生活质量应同时考察经济资源、工作</tspan><tspan x="590.0" dy="28.1">…</tspan></text><text x="590.0" y="750.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">生活质量应同时考察经济资源、工作条件、照护</tspan><tspan x="590.0" dy="24.1">负担和社会支持</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="608.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="1076.0" y="626.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="1103.0" y="649.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">06</text><text x="1078.0" y="683.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="1078.0" dy="0.0">连续观察收入、工时、消费负担和岗</tspan><tspan x="1078.0" dy="28.1">…</tspan></text><text x="1078.0" y="750.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">连续观察收入、工时、消费负担和岗位需求有助</tspan><tspan x="1078.0" dy="24.1">于评估成果分布</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="873.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="891.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="914.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">07</text><text x="102.0" y="948.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">面对变化，人们也可以重新思考成功</tspan><tspan x="102.0" dy="28.1">…</tspan></text><text x="102.0" y="1015.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">面对变化，人们也可以重新思考成功定义并守护</tspan><tspan x="102.0" dy="24.1">微观幸福</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">高收入指标与家庭体感之间的经济落差 · 章节 05</tspan></text>

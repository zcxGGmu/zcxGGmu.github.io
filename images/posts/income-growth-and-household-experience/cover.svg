<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">高收入指标与家庭体感之间的经济落差</title><desc id="desc">高收入指标与家庭体感之间的经济落差的章节结构与重点信息。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity="0.16"/><stop offset="1" stop-color="#2563eb" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#2563eb" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#2563eb"/><text x="80.0" y="155.0" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28.0px" font-weight="700" text-anchor="start"><tspan x="80.0" dy="0.0">文章导览 · 章节图谱</tspan></text><text x="80.0" y="245.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="60.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">高收入指标与家庭体感之间的经济落差</tspan></text><text x="80.0" y="319.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">以章节关系、关键数据与条件口径组织内容。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="390.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="410.0" width="58" height="34" rx="17" fill="#2563eb"/><text x="129.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">01</text><text x="176.0" y="438.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">宏观指标与家庭体感并不总是同步</tspan></text><text x="102.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">总量和平均数描述整体规模，收入分布与家庭支出影响不同群体的实际感受。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="390.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="410.0" width="58" height="34" rx="17" fill="#2563eb"/><text x="861.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">02</text><text x="908.0" y="438.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">劳动力竞争会传导到工作条件与回报</tspan></text><text x="834.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">岗位竞争可能压缩议价空间，并把更多时间、健康和家庭成本转移给劳动者。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="638.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="658.0" width="58" height="34" rx="17" fill="#2563eb"/><text x="129.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">03</text><text x="176.0" y="686.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">金融稳定与风险承担落在不同主体上</tspan></text><text x="102.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">金融体系的债务链条相互连接，稳定系统与分配调整成本需要同时考察。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="638.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="658.0" width="58" height="34" rx="17" fill="#2563eb"/><text x="861.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">04</text><text x="908.0" y="686.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">人口变化与自动化共同影响劳动议价</tspan></text><text x="834.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">劳动力供给趋紧可能抬高议价空间，自动化也会改变企业对人力的需求。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="886.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="906.0" width="58" height="34" rx="17" fill="#2563eb"/><text x="129.0" y="930.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">05</text><text x="176.0" y="934.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">家庭关系可能成为微观层面的支持网络</tspan></text><text x="102.0" y="976.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">亲密关系和家庭协作能够提供支持，但不能替代公共保障与稳定就业。</tspan></text><text x="80.0" y="1140.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">阅读顺序：章节标题 → 关键数据 → 证据与条件</tspan></text>
</svg>
stem,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#10233f" text-anchor="middle">资本开支只有穿过回报率与现金流两道门，才具备持续性。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">六、财富自由之后，金钱能解决什么又不能解决什么</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">财富自由扩大选择空间，却不能替代关系、健康、能力与意义；工作是否继续取决于重新定义后的目标。</tspan></text>
<rect x="68" y="355" width="430" height="205" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><text x="98" y="399" font-size="17" font-weight="700" fill="#347a73">环节 01</text><text x="283" y="469" text-anchor="middle" font-size="25" font-weight="700" fill="#20343b"><tspan x="283" y="469">流动性选择</tspan></text><path d="M506 458H559" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="578" y="355" width="430" height="205" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><text x="608" y="399" font-size="17" font-weight="700" fill="#df8b4c">环节 02</text><text x="793" y="469" text-anchor="middle" font-size="25" font-weight="700" fill="#20343b"><tspan x="793" y="469">非金融资产</tspan></text><path d="M1016 458H1069" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1088" y="355" width="430" height="205" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><text x="1118" y="399" font-size="17" font-weight="700" fill="#b94f4f">环节 03</text><text x="1303" y="469" text-anchor="middle" font-size="25" font-weight="700" fill="#20343b"><tspan x="1303" y="469">时间自主</tspan></text><rect x="68" y="625" width="1450" height="112" rx="10" fill="#e5eeea"/><text x="98" y="672" font-size="17" font-weight="700" fill="#347a73">核心判断</text><text x="700" y="691" text-anchor="middle" font-size="23" font-weight="650" fill="#20343b"><tspan x="700" y="691">财富自由扩大选择空间，却不能替代关系、健康、能力与意义；工作是否继续取决于重新定义后的目标。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">结构图用于解释机制，不表示具体幅度或确定因果</text></svg>
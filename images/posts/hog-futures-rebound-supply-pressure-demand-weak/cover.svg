  <text x="92" y="145" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">生猪期货反弹要谨慎：</text><text x="92" y="215" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="42" font-weight="800">供应压力、弱需求与冻品库存压制</text>
  <text x="96" y="322" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="30" font-weight="700">从压栏、二育、套保盘、冻品库存、仔猪价格和肉牛供需出发，拆解生猪反弹为什么有支撑但空间不宜高估。</text>

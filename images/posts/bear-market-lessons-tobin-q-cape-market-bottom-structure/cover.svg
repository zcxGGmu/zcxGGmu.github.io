<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">大熊市启示录：冷漠、托宾 Q、CAPE 与市场大底的真正结构</title>
  <desc id="desc">复盘 1921、1932、1949 和 1982 年四次美股超级大底，理解冷漠而非恐慌、托宾 Q、CAPE、通缩通胀、债券收益率拐点和均值回归如何共同塑造长期买点。</desc>

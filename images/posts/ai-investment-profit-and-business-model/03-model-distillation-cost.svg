C','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">下降约 80%</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="343.0" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><text x="834.0" y="418.0" fill="#172554" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">模型方法</tspan></text><text x="834.0" y="460.7" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">用大型基础模型训练专用小模型</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="740.5" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="758.5" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="781.5" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><text x="102.0" y="815.5" fill="#172554" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">适用任务</tspan></text><text x="102.0" y="858.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">内容理解、内容分发、部分个人助理请求</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="740.5" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="758.5" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="781.5" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="834.0" y="815.5" fill="#172554" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">成本口径边界</tspan></text><text x="834.0" y="858.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">此降幅不直接适用于高算力的 Muse 生成模型</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">人工智能投入如何转化为利润与新业务 · 章节 03</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#397d83"/><stop offset="1" stop-color="#e18b52"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#e18b52"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">四、需求与供给一起收缩会形成反馈</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">信贷变化既是预期变化的结果，也会沿着企业收入和就业反馈到家庭。</tspan></text>
<rect x="70" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#347a73" stroke-width="3"/><rect x="70" y="300" width="450" height="12" rx="6" fill="#347a73"/><circle cx="118" cy="362" r="24" fill="#347a73"/><text x="118" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">01</text><text x="158" y="369" font-size="17" font-weight="700" fill="#347a73">关键维度</text><text x="295" y="436" text-anchor="middle" font-size="20" font-weight="750" fill="#20343b"><tspan x="295" y="436">家庭防守</tspan></text><path d="M100 473H490" stroke="#e3e9e5" stroke-width="2"/><text x="100" y="500" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="100" y="536" text-anchor="start" font-size="15" font-weight="500" fill="#30464d"><tspan x="100" y="536">当家庭担忧未来收入时，往往减少借款、消费和大额支出；</tspan></text><text x="100" y="594" font-size="13" font-weight="700" fill="#347a73">核对线索</text><text x="100" y="621" text-anchor="start" font-size="12" font-weight="500" fill="#52666d"><tspan x="100" y="621">债务压力和资产价格也可能相互影响。</tspan></text><path d="M528 464H563" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="580" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#df8b4c" stroke-width="3"/><rect x="580" y="300" width="450" height="12" rx="6" fill="#df8b4c"/><circle cx="628" cy="362" r="24" fill="#df8b4c"/><text x="628" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">02</text><text x="668" y="369" font-size="17" font-weight="700" fill="#df8b4c">关键维度</text><text x="805" y="436" text-anchor="middle" font-size="20" font-weight="750" fill="#20343b"><tspan x="805" y="436">企业收缩</tspan></text><path d="M610 473H1000" stroke="#e3e9e5" stroke-width="2"/><text x="610" y="500" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="610" y="536" text-anchor="start" font-size="15" font-weight="500" fill="#30464d"><tspan x="610" y="536">若抵押资产价值下降，再融资空间收窄，家庭更愿意还债；</tspan></text><text x="610" y="594" font-size="13" font-weight="700" fill="#df8b4c">核对线索</text><text x="610" y="614" text-anchor="start" font-size="12" font-weight="500" fill="#52666d"><tspan x="610" y="614">消费需求回升后，企业收入和用工也可能改善，银行看到实际还</tspan><tspan x="610" y="629">款能力再扩大授信。</tspan></text><path d="M1038 464H1073" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1090" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#b94f4f" stroke-width="3"/><rect x="1090" y="300" width="450" height="12" rx="6" fill="#b94f4f"/><circle cx="1138" cy="362" r="24" fill="#b94f4f"/><text x="1138" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">03</text><text x="1178" y="369" font-size="17" font-weight="700" fill="#b94f4f">关键维度</text><text x="1315" y="436" text-anchor="middle" font-size="20" font-weight="750" fill="#20343b"><tspan x="1315" y="436">金融反馈</tspan></text><path d="M1120 473H1510" stroke="#e3e9e5" stroke-width="2"/><text x="1120" y="500" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="1120" y="527" text-anchor="start" font-size="15" font-weight="500" fill="#30464d"><tspan x="1120" y="527">信贷增长在这条链中是中间变量而非最终目标，关键结果仍</tspan><tspan x="1120" y="546">是收入、消费和生产活动的可持续改善。</tspan></text><text x="1120" y="594" font-size="13" font-weight="700" fill="#b94f4f">核对线索</text><text x="1120" y="614" text-anchor="start" font-size="12" font-weight="500" fill="#52666d"><tspan x="1120" y="614">观察需要沿着“就业和收入—订单和成交—授信和还款”连续追</tspan><tspan x="1120" y="629">踪，而不是把某个单月的贷款反弹等同于循环已经转向。</tspan></text><rect x="70" y="692" width="1450" height="104" rx="14" fill="#e5eeea"/><rect x="70" y="692" width="14" height="104" rx="7" fill="#347a73"/><text x="112" y="735" font-size="17" font-weight="700" fill="#347a73">本节结论</text><text x="820" y="755" text-anchor="middle" font-size="22" font-weight="650" fill="#20343b"><tspan x="820" y="755">信贷变化既是预期变化的结果，也会沿着企业收入和就业反馈到家庭。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">章节要点按正文机制提炼；各指标和结论的适用边界见正文</text></svg>
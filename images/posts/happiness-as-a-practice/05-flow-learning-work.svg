<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">学习、工作与心流</title><desc id="desc">学习、工作与心流：适度挑战和个人能力相匹配时，更容易进入投入状态；工作意义也可通过重新理解来塑造。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e" stop-opacity="0.16"/><stop offset="1" stop-color="#0f766e" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#0f766e" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#0f766e"/><text x="80.0" y="148.0" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 05 / 08</tspan></text><text x="80.0" y="223.0" fill="#134e4a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">学习、工作与心流</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">适度挑战和个人能力相匹配时，更容易进入投入状态；工作意义也可通过重新理解来塑造。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="343.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="361.0" width="54" height="32" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.35"/><text x="127.0" y="384.0" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><text x="102.0" y="418.0" fill="#134e4a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">心流状态</tspan></text><text x="102.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">高度投入，行动与觉察融为一体，暂时忘记时间和外界评价；工作中进入心流可能比休</tspan><tspan x="102.0" dy="24.1">闲更多</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="343.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="832.0" y="361.0" width="54" height="32" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.35"/><text x="859.0" y="384.0" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><text x="834.0" y="418.0" fill="#134e4a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">挑战与能力</tspan></text><text x="834.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">挑战过高容易焦虑，过低容易无聊；适度且够得着的任务更易投入</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="608.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="626.0" width="54" height="32" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.35"/><text x="127.0" y="649.0" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><text x="102.0" y="683.0" fill="#134e4a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">工作三种态度</tspan></text><text x="102.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">任务（薪水）、职业（晋升与地位）、使命（工作本身的意义）</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="608.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="832.0" y="626.0" width="54" height="32" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.35"/><text x="859.0" y="649.0" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="834.0" y="683.0" fill="#134e4a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">寻找使命交集</tspan></text><text x="834.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">分别梳理意义、快乐与个人优势，关注三者交集</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="873.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="891.0" width="54" height="32" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.35"/><text x="127.0" y="914.0" text-anchor="middle" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">05</text><text x="102.0" y="948.0" fill="#134e4a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">渐进尝试</tspan></text><text x="102.0" y="987.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">可在现有生活框架内逐步尝试，不必立即辞职或彻底转行</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">幸福的方法：让快乐与意义进入日常生活 · 章节 05</tspan></text>
</svg>
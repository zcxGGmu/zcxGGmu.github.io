<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">A股低流入环境下的AI成长端：杠铃策略如何核对</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">资金与流动性</tspan></text><text x="236" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="236" y="478">北向或境内资金口径、成交额、融资与风险</tspan><tspan x="236" y="502">偏好</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">盈利兑现</tspan></text><text x="620" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="620" y="478">收入、订单、毛利率、EPS 与经营现金</tspan><tspan x="620" y="502">流</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">估值压力</tspan></text><text x="1004" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1004" y="490">市盈率、盈利预期修正、风险溢价与利率</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">产业约束</tspan></text><text x="1388" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1388" y="478">算力供给、资本开支、出口管制和客户集中</tspan><tspan x="1388" y="502">度</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
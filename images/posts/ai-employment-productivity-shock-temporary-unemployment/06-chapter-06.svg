<rect x="80" y="80" width="1440" height="8" rx="4" fill="#2563eb"/><text x="80.0" y="148.0" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 06 / 06</tspan></text><text x="80.0" y="223.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">投资波动、技能适应与工作方式</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">投资估值波动与实际工作适应是两条不同议题；实践能力和可迁移技能有助于应对岗位变化</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="343.0" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><rect x="682.0" y="363.0" width="86.0" height="28" rx="14" fill="#2563eb" fill-opacity="0.12"/><text x="725.0" y="383.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">1330</text><text x="102.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">AI企业股价案例</tspan></text><text x="102.0" y="460.7" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">发行价：约150；冲击高点：约1330；单位：港元；后续表现：</tspan><tspan x="102.0" dy="29.5">一度跌破发行价后反弹；限制：单一案例不能代表行业回报</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="343.0" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><text x="834.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">实践学习</tspan></text><text x="834.0" y="460.7" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">建议：围绕实际项目和兴趣领域动手实践，按任务需要使用AI</tspan><tspan x="834.0" dy="29.5">工具</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="740.5" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="758.5" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="781.5" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><text x="102.0" y="815.5" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">可迁移能力</tspan></text><text x="102.0" y="858.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">能力重点：持续更新技能、识别本职任务中的自动化变化、积</tspan><tspan x="102.0" dy="29.5">累可迁移经验</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="740.5" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="758.5" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="781.5" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="834.0" y="815.5" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">协作与社交</tspan></text><text x="834.0" y="858.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">能力要求：协作、社交和展示专业能力仍有作用；适用背景：A</tspan><tspan x="834.0" dy="29.5">I环境下的职业适应能力</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">AI就业冲击：生产率提升与9%暂时性失业估计 · 章节 06</tspan></text>

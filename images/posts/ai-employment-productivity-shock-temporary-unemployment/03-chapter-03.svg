C','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">占比：23；单位：%；说明：纳入工作流程，不等于全面部署</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="343.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><rect x="1410.0" y="363.0" width="90.0" height="28" rx="14" fill="#2563eb" fill-opacity="0.12"/><text x="1455.0" y="383.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">10000</text><text x="834.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">行业就业增长差距</tspan></text><text x="834.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">就业增长差：约10000；单位：岗位；统计时期：最近一个季度；指标口径：</tspan><tspan x="834.0" dy="24.1">受影响较深行业相较长期趋势的增长差</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="608.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="626.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="649.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><text x="102.0" y="683.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">抵消因素</tspan></text><text x="102.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">相关活动：数据中心等AI相关建设；影响：抵消部分岗位缺口</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="608.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="626.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="649.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="834.0" y="683.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">高暴露行业</tspan></text><text x="834.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">行业：计算机与数据处理、网络托管与搜索、专业科学技术服务；观察到的关</tspan><tspan x="834.0" dy="24.1">系：AI应用与失业率正相关、与就业增长负相关</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="873.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="891.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="914.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">05</text><text x="102.0" y="948.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">近期趋势</tspan></text><text x="102.0" y="987.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">AI替岗报道与裁员公告：春季阶段性高点后回落；范围：报告所观察时期</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">AI就业冲击：生产率提升与9%暂时性失业估计 · 章节 03</tspan></text>

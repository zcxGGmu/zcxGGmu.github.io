<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">大瓶水走红：从消费选择到日常掌控感</title><desc id="desc">大瓶水走红：从消费选择到日常掌控感的章节结构与重点信息。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2" stop-opacity="0.16"/><stop offset="1" stop-color="#0891b2" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#0891b2" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#0891b2"/><text x="80.0" y="155.0" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28.0px" font-weight="700" text-anchor="start"><tspan x="80.0" dy="0.0">文章导览 · 章节图谱</tspan></text><text x="80.0" y="245.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="60.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">大瓶水走红：从消费选择到日常掌控感</tspan></text><text x="80.0" y="319.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">以章节关系、关键数据与条件口径组织内容。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="390.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="100.0" y="410.0" width="58" height="34" rx="17" fill="#0891b2"/><text x="129.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">01</text><text x="176.0" y="438.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">大瓶水如何成为一种生活方式</tspan></text><text x="102.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">大瓶饮用从白水扩展到多类饮品，并与工位、运动和配</tspan><tspan x="102.0" dy="23.0">套用品结合。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="390.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="588.0" y="410.0" width="58" height="34" rx="17" fill="#0891b2"/><text x="617.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">02</text><text x="664.0" y="438.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">从大瓶糖饮到白水：四笔日常账</tspan></text><text x="590.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">饮品选择涉及年度支出、添加糖、决策次数和可见的日</tspan><tspan x="590.0" dy="23.0">常目标。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="390.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="1076.0" y="410.0" width="58" height="34" rx="17" fill="#0891b2"/><text x="1105.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">03</text><text x="1152.0" y="438.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">消费预算从哪里移到哪里</tspan></text><text x="1078.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">饮品开支减少后，预算可能流向储蓄、体验或个人兴趣</tspan><tspan x="1078.0" dy="23.0">。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="638.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="100.0" y="658.0" width="58" height="34" rx="17" fill="#0891b2"/><text x="129.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">04</text><text x="176.0" y="686.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">掌控感与小赢的作用</tspan></text><text x="102.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">可见、可完成的小事能提供确定反馈，但相关心理机制</tspan><tspan x="102.0" dy="23.0">并非针对大水的专门结论。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="638.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="588.0" y="658.0" width="58" height="34" rx="17" fill="#0891b2"/><text x="617.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">05</text><text x="664.0" y="686.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">自我管理也可能变成新的负担</tspan></text><text x="590.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">饮水、睡眠和运动应按个体需求安排，避免把习惯变成</tspan><tspan x="590.0" dy="23.0">自我考核。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="638.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="1076.0" y="658.0" width="58" height="34" rx="17" fill="#0891b2"/><text x="1105.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">06</text><text x="1152.0" y="686.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">把小水瓶的方法用于其他事情</tspan></text><text x="1078.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">把目标设低、把进度做得可见，并允许间断后继续。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="886.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="100.0" y="906.0" width="58" height="34" rx="17" fill="#0891b2"/><text x="129.0" y="930.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">07</text><text x="176.0" y="934.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">总述</tspan></text><text x="102.0" y="976.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">大瓶水可作为低成本饮水方式，实际选择仍应结合身体</tspan><tspan x="102.0" dy="23.0">需要和个人处境。</tspan></text><text x="80.0" y="1140.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">阅读顺序：章节标题 → 关键数据 → 证据与条件</tspan></text>
</svg>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2" stop-opacity="0.16"/><stop offset="1" stop-color="#0891b2" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#0891b2" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#0891b2"/><text x="80.0" y="148.0" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 05 / 07</tspan></text><text x="80.0" y="223.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">自我管理也可能变成新的负担</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">饮水、睡眠和运动应按个体需求安排，避免把习惯变成自我考核。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="343.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="100.0" y="361.0" width="54" height="32" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-opacity="0.35"/><text x="127.0" y="384.0" text-anchor="middle" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><rect x="682.0" y="363.0" width="86.0" height="28" rx="14" fill="#0891b2" fill-opacity="0.12"/><text x="725.0" y="383.0" text-anchor="middle" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">9</text><text x="102.0" y="418.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">成年人睡眠参考</tspan></text><text x="102.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">成年人睡眠参考：7–9小时</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="343.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="832.0" y="361.0" width="54" height="32" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-opacity="0.35"/><text x="859.0" y="384.0" text-anchor="middle" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><rect x="1414.0" y="363.0" width="86.0" height="28" rx="14" fill="#0891b2" fill-opacity="0.12"/><text x="1457.0" y="383.0" text-anchor="middle" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">12</text><text x="834.0" y="418.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">短时间灌下12升</tspan></text><text x="834.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">短时间灌下12升：可能导致稀释性低钠血症（水中毒）</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="608.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="100.0" y="626.0" width="54" height="32" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-opacity="0.35"/><text x="127.0" y="649.0" text-anchor="middle" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><text x="102.0" y="683.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">应对</tspan></text><text x="102.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">应对：停止继续饮水、休息；症状持续或加重及时就医</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="608.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="832.0" y="626.0" width="54" height="32" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-opacity="0.35"/><text x="859.0" y="649.0" text-anchor="middle" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><rect x="1414.0" y="628.0" width="86.0" height="28" rx="14" fill="#0891b2" fill-opacity="0.12"/><text x="1457.0" y="648.0" text-anchor="middle" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">一次</text><text x="834.0" y="683.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">饮用方式</tspan></text><text x="834.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">饮用方式：每次100–200毫升，每1–2小时一次</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="873.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.16"/></g><rect x="100.0" y="891.0" width="54" height="32" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-opacity="0.35"/><text x="127.0" y="914.0" text-anchor="middle" fill="#0891b2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">05</text><text x="102.0" y="948.0" fill="#083344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">尿色淡柠檬黄作参考；浓茶色且持续…</tspan></text><text x="102.0" y="987.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">尿色淡柠檬黄作参考；浓茶色且持续应就医</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">大瓶水走红：从消费选择到日常掌控感 · 章节 05</tspan></text>

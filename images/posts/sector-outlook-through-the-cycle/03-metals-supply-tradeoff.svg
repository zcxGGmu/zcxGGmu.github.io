<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">有色金属：铜看供给，黄金看交易性价比</title><desc id="desc">有色金属：铜看供给，黄金看交易性价比：铜的供应约束支撑基本面判断，黄金的交易吸引力与悲观预期消化及海外数据催化相关。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b45309" stop-opacity="0.16"/><stop offset="1" stop-color="#b45309" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#b45309" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#b45309"/><text x="80.0" y="148.0" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 03 / 06</tspan></text><text x="80.0" y="223.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">有色金属：铜看供给，黄金看交易性价比</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">铜的供应约束支撑基本面判断，黄金的交易吸引力与悲观预期消化及海外数据催化相关。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="343.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#b45309" stroke-opacity="0.16"/></g><rect x="100.0" y="361.0" width="54" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><text x="127.0" y="384.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><rect x="682.0" y="363.0" width="86.0" height="28" rx="14" fill="#b45309" fill-opacity="0.12"/><text x="725.0" y="383.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">1.4万</text><text x="102.0" y="418.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">铜价与供给</tspan></text><text x="102.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">约1.4万美元/吨的铜价维持一至两个季度；短期供应问题难以解决，四季度冶炼检修减</tspan><tspan x="102.0" dy="24.1">产压力较大</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="343.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#b45309" stroke-opacity="0.16"/></g><rect x="832.0" y="361.0" width="54" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><text x="859.0" y="384.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><rect x="1414.0" y="363.0" width="86.0" height="28" rx="14" fill="#b45309" fill-opacity="0.12"/><text x="1457.0" y="383.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">80%</text><text x="834.0" y="418.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">业绩证据</tspan></text><text x="834.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">西部矿业三季度业绩环比增长，超出持平或略降的普遍预期；藏格矿业利润约80%来自铜</tspan><tspan x="834.0" dy="24.1">矿，三季度也环比增加</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="608.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#b45309" stroke-opacity="0.16"/></g><rect x="100.0" y="626.0" width="54" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><text x="127.0" y="649.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><rect x="682.0" y="628.0" width="86.0" height="28" rx="14" fill="#b45309" fill-opacity="0.12"/><text x="725.0" y="648.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">9倍</text><text x="102.0" y="683.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">铜估值</tspan></text><text x="102.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">铜板块估值约9倍；环比增长的三季报可能带来估值溢价</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="608.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#b45309" stroke-opacity="0.16"/></g><rect x="832.0" y="626.0" width="54" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><text x="859.0" y="649.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="834.0" y="683.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">黄金与电解铝</tspan></text><text x="834.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">黄金受加息预期及山东、河南安全监管影响，悲观预期已反映较多；电解铝库存低于去</tspan><tspan x="834.0" dy="24.1">年同期，仍待新增产能压力测试</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="873.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#b45309" stroke-opacity="0.16"/></g><rect x="100.0" y="891.0" width="54" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><text x="127.0" y="914.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">05</text><rect x="666.0" y="893.0" width="102.0" height="28" rx="14" fill="#b45309" fill-opacity="0.12"/><text x="717.0" y="913.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">15.15%</text><text x="102.0" y="948.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">铝股息与小金属</tspan></text><text x="102.0" y="987.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">乐观估算下部分电解铝标的股息率约15.15%，市场担忧不可持续；小金属短期受科技行</tspan><tspan x="102.0" dy="24.1">情影响</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">周期视角下的七个行业方向：煤炭、化工、金属、地产与军工 · 章节 03</tspan></text>
</svg>
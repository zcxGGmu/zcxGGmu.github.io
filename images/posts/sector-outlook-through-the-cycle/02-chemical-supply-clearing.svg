<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">化工：供给出清之后，等待需求修复</title><desc id="desc">化工：供给出清之后，等待需求修复：供给侧经历调整，行业后续关注油价、下游库存和刚需恢复的联动。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b45309" stop-opacity="0.16"/><stop offset="1" stop-color="#b45309" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#b45309" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#b45309"/><text x="80.0" y="148.0" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 02 / 06</tspan></text><text x="80.0" y="223.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">化工：供给出清之后，等待需求修复</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">供给侧经历调整，行业后续关注油价、下游库存和刚需恢复的联动。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="343.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#b45309" stroke-opacity="0.16"/></g><rect x="100.0" y="361.0" width="54" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><text x="127.0" y="384.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><text x="102.0" y="418.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">需求约束</tspan></text><text x="102.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">油价高位与宏观不稳定促使下游去库存、压缩实际需求；若油价回落，刚需与补库可能</tspan><tspan x="102.0" dy="24.1">共振，时点未知</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="343.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#b45309" stroke-opacity="0.16"/></g><rect x="832.0" y="361.0" width="54" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><text x="859.0" y="384.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><rect x="1414.0" y="363.0" width="86.0" height="28" rx="14" fill="#b45309" fill-opacity="0.12"/><text x="1457.0" y="383.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">2年</text><text x="834.0" y="418.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">供给变化</tspan></text><text x="834.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">经历约1至2年供给调整，新增产能投放趋缓；海外装置开工受冲突影响</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="608.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#b45309" stroke-opacity="0.16"/></g><rect x="100.0" y="626.0" width="54" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><text x="127.0" y="649.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><rect x="682.0" y="628.0" width="86.0" height="28" rx="14" fill="#b45309" fill-opacity="0.12"/><text x="725.0" y="648.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">70%</text><text x="102.0" y="683.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">涤纶与盈利</tspan></text><text x="102.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">桐昆三季度业绩好于二季度；低端产能开工率约70%时仍保持较好盈利，显示供给约束较</tspan><tspan x="102.0" dy="24.1">强</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="608.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#b45309" stroke-opacity="0.16"/></g><rect x="832.0" y="626.0" width="54" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><text x="859.0" y="649.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><rect x="1414.0" y="628.0" width="86.0" height="28" rx="14" fill="#b45309" fill-opacity="0.12"/><text x="1457.0" y="648.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">9倍</text><text x="834.0" y="683.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">估值与情景</tspan></text><text x="834.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">当前估值约5至6倍；若油价和开工率维持现状，较悲观的明年情形约8至9倍</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="873.0" width="708.0" height="241.0" rx="20" fill="#ffffff" stroke="#b45309" stroke-opacity="0.16"/></g><rect x="100.0" y="891.0" width="54" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><text x="127.0" y="914.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">05</text><rect x="682.0" y="893.0" width="86.0" height="28" rx="14" fill="#b45309" fill-opacity="0.12"/><text x="725.0" y="913.0" text-anchor="middle" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">2.6万</text><text x="102.0" y="948.0" fill="#1c1917" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">产能退出与细分产品</tspan></text><text x="102.0" y="987.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">粘胶长丝、氨纶预计四季度至次年一季度退出约10%以上产能；新乡化纤、吉林化纤受到</tspan><tspan x="102.0" dy="24.1">关注。不溶性硫磺价格约2.4万至2.6万元/吨</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">周期视角下的七个行业方向：煤炭、化工、金属、地产与军工 · 章节 02</tspan></text>
</svg>
  <text x="92" y="132" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="48" font-weight="800">宁德时代躺赢时代结束：</text><text x="92" y="200" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="40" font-weight="800">议价权见顶后的增长重估</text>
  <text x="96" y="344" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="29" font-weight="700">从估值体系、毛利率压力、产能库存、整车厂关系、储能泡沫、海外扩张与技术路线，拆解动力电池龙头从稀缺成长股转向全球制造</text>

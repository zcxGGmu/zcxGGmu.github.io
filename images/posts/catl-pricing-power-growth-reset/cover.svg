<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">宁德时代躺赢时代结束：议价权见顶后的增长重估</title>
  <desc id="desc">从估值体系、毛利率压力、产能库存、整车厂关系、储能泡沫、海外扩张与技术路线，拆解动力电池龙头从稀缺成长股转向全球制造龙头后的新考题。</desc>

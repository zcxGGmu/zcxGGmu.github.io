<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">曼昆宏观经济学（上）：GDP、长期增长与失业</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">从GDP的核算边界出发，解释名义与真实产出、长期生产率、储蓄投资、金融配置和劳动力市场指标，并区分会计恒等式与经济模型的条件性结论。</tspan></text>

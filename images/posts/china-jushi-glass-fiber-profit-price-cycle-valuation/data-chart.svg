<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">中国巨石前三季度利润预增：玻纤价格、销量与周期位置怎么拆解</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="388">51.36—53.93亿</tspan><tspan x="236" y="424">元</tspan></text><text x="236" y="466" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="236" y="466">2026年前三季度归母净利润预告；同比</tspan><tspan x="236" y="490">+100%—110%，初步测算、未经审</tspan><tspan x="236" y="514">计</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="388">52.25—54.86亿</tspan><tspan x="620" y="424">元</tspan></text><text x="620" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="620" y="478">扣非归母净利润预告；同比+100%—1</tspan><tspan x="620" y="502">10%，初步测算、未经审计</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">产品价格与销量</tspan></text><text x="1004" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1004" y="478">分E-glass、粗纱及其他产品核对成</tspan><tspan x="1004" y="502">交价、销量、结构和客户</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">现金流与估值</tspan></text><text x="1388" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1388" y="478">观察经营现金流、资本开支、净负债、预测</tspan><tspan x="1388" y="502">年份和估值口径</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
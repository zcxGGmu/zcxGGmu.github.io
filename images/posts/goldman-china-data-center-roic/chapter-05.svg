<text x="68" y="73" text-anchor="start" font-size="38" font-weight="650" fill="#fff"><tspan x="68" y="73">五、建设速度与电力约束会改变回收周期</tspan></text><text x="70" y="145" text-anchor="start" font-size="21" font-weight="650" fill="#eef6f2"><tspan x="70" y="145">数据中心资本回收不仅由需求决定，还受并网、土地、审批和设备交付影响。</tspan></text><rect x="68" y="340" width="420" height="220" rx="10" fill="#fff" stroke="#2d6570" stroke-width="4"/><rect x="68" y="340" width="420" height="14" fill="#2d6570"/><text x="96" y="395" font-size="17" font-weight="700" fill="#2d6570">节点 01</text><text x="278" y="470" text-anchor="middle" font-size="25" font-weight="650" fill="#20343b"><tspan x="278" y="470">建设与并网</tspan></text><path d="M496 450H546" stroke="#d48745" stroke-width="7" marker-end="url(#arrow)"/><rect x="568" y="340" width="420" height="220" rx="10" fill="#fff" stroke="#d48745" stroke-width="4"/><rect x="568" y="340" width="420" height="14" fill="#d48745"/><text x="596" y="395" font-size="17" font-weight="700" fill="#d48745">节点 02</text><text x="778" y="470" text-anchor="middle" font-size="25" font-weight="650" fill="#20343b"><tspan x="778" y="470">设备交付</tspan></text><path d="M996 450H1046" stroke="#d48745" stroke-width="7" marker-end="url(#arrow)"/><rect x="1068" y="340" width="420" height="220" rx="10" fill="#fff" stroke="#4f8a65" stroke-width="4"/><rect x="1068" y="340" width="420" height="14" fill="#4f8a65"/><text x="1096" y="395" font-size="17" font-weight="700" fill="#4f8a65">节点 03</text><text x="1278" y="470" text-anchor="middle" font-size="25" font-weight="650" fill="#20343b"><tspan x="1278" y="470">投运时点</tspan></text><rect x="68" y="635" width="1430" height="90" rx="10" fill="#e5eeea"/><text x="783" y="680" text-anchor="middle" font-size="21" font-weight="650" fill="#43575d"><tspan x="783" y="680">建设节奏决定资本占用的时间长度，投运延迟会直接推迟ROIC改善。</tspan></text>
<text x="70" y="850" font-size="18" fill="#5d6e72">机制面板 · 数字与期间以正文及正式披露为准</text></g></svg>
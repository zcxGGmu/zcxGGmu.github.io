<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#3a6472"/><stop offset="1" stop-color="#c87943"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#c87943"/></marker></defs>
<rect width="1600" height="900" fill="#f2f5f3"/><rect width="1600" height="190" fill="url(#head)"/>
<text x="68" y="73" text-anchor="start" font-size="38" font-weight="650" fill="#fff"><tspan x="68" y="73">关键数据与口径边界</tspan></text><text x="70" y="145" text-anchor="start" font-size="21" font-weight="650" fill="#eef6f2"><tspan x="70" y="145">高盛中国数据中心：用ROIC重构资本开支与回报判断</tspan></text><rect x="60" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#2d6570" stroke-width="4"/><rect x="60" y="320" width="350" height="14" fill="#2d6570"/><text x="235" y="415" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="235" y="415">标题已确认</tspan></text><text x="235" y="505" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="235" y="505">围绕中国数据中心与ROIC展开</tspan></text><rect x="445" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#d48745" stroke-width="4"/><rect x="445" y="320" width="350" height="14" fill="#d48745"/><text x="620" y="415" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="620" y="415">公司与金额未取得</tspan></text><text x="620" y="505" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="620" y="505">不补写容量、收入或利润数字</tspan></text><rect x="830" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#4f8a65" stroke-width="4"/><rect x="830" y="320" width="350" height="14" fill="#4f8a65"/><text x="1005" y="415" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="1005" y="415">ROIC</tspan></text><text x="1005" y="505" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="1005" y="505">投入资本回报率的比较框架</tspan></text><rect x="1215" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#9a5d57" stroke-width="4"/><rect x="1215" y="320" width="350" height="14" fill="#9a5d57"/><text x="1390" y="415" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="1390" y="415">验证链</tspan></text><text x="1390" y="505" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="1390" y="505">资本开支→投运→利用率→现金回报</tspan></text><rect x="60" y="650" width="1470" height="72" rx="10" fill="#e9ece7"/><text x="795" y="687" text-anchor="middle" font-size="20" font-weight="650" fill="#43575d"><tspan x="795" y="687">信息卡只呈现已确认口径或待观察变量，不构造缺乏依据的趋势。</tspan></text>
<text x="70" y="850" font-size="18" fill="#5d6e72">数据卡片 · 期间、分母和证据级别见文章说明</text></svg>
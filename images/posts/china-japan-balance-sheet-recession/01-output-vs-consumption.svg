<rect x="80" y="80" width="1440" height="8" rx="4" fill="#b91c1c"/><text x="80.0" y="148.0" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 01 / 05</tspan></text><text x="80.0" y="223.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">产能强劲，不等于家庭愿意消费</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">人口、产出缺口和家庭需求共同影响经济活力；国家生产能力与家庭消费意愿需要分别观察。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="343.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#b91c1c" stroke-opacity="0.16"/></g><rect x="100.0" y="361.0" width="54" height="32" rx="16" fill="#fff1f2" stroke="#b91c1c" stroke-opacity="0.35"/><text x="127.0" y="384.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><rect x="438.0" y="363.0" width="86.0" height="28" rx="14" fill="#b91c1c" fill-opacity="0.12"/><text x="481.0" y="383.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">29</text><text x="102.0" y="418.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">设想案例</tspan></text><text x="102.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">设想案例：29 岁上海半导体工程师，身处扩张行业却</tspan><tspan x="102.0" dy="24.1">压缩消费、增加储蓄</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="343.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#b91c1c" stroke-opacity="0.16"/></g><rect x="588.0" y="361.0" width="54" height="32" rx="16" fill="#fff1f2" stroke="#b91c1c" stroke-opacity="0.35"/><text x="615.0" y="384.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><text x="590.0" y="418.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="590.0" dy="0.0">经济体生产能力 ≠ 家庭购买意愿</tspan></text><text x="590.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">经济体生产能力 ≠ 家庭购买意愿</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="343.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#b91c1c" stroke-opacity="0.16"/></g><rect x="1076.0" y="361.0" width="54" height="32" rx="16" fill="#fff1f2" stroke="#b91c1c" stroke-opacity="0.35"/><text x="1103.0" y="384.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><rect x="1410.0" y="363.0" width="90.0" height="28" rx="14" fill="#b91c1c" fill-opacity="0.12"/><text x="1455.0" y="383.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">1990年</text><text x="1078.0" y="418.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="1078.0" dy="0.0">日本泡沫破裂</tspan></text><text x="1078.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">日本泡沫破裂：约 1990 年；其后长期价格低迷、增长</tspan><tspan x="1078.0" dy="24.1">缓慢</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="608.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#b91c1c" stroke-opacity="0.16"/></g><rect x="100.0" y="626.0" width="54" height="32" rx="16" fill="#fff1f2" stroke="#b91c1c" stroke-opacity="0.35"/><text x="127.0" y="649.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><rect x="434.0" y="628.0" width="90.0" height="28" rx="14" fill="#b91c1c" fill-opacity="0.12"/><text x="479.0" y="648.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">2009年</text><text x="102.0" y="683.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">人口开始减少</tspan></text><text x="102.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">人口开始减少：中国 2022 年；日本 2009 年</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="608.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#b91c1c" stroke-opacity="0.16"/></g><rect x="588.0" y="626.0" width="54" height="32" rx="16" fill="#fff1f2" stroke="#b91c1c" stroke-opacity="0.35"/><text x="615.0" y="649.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">05</text><text x="590.0" y="683.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="590.0" dy="0.0">产出缺口</tspan></text><text x="590.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">产出缺口：潜在产出 − 需求疲弱时的实际产出</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="608.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#b91c1c" stroke-opacity="0.16"/></g><rect x="1076.0" y="626.0" width="54" height="32" rx="16" fill="#fff1f2" stroke="#b91c1c" stroke-opacity="0.35"/><text x="1103.0" y="649.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">06</text><text x="1078.0" y="683.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="1078.0" dy="0.0">日本化指数观察</tspan></text><text x="1078.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">日本化指数观察：产出缺口、通胀、央行利率</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="873.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#b91c1c" stroke-opacity="0.16"/></g><rect x="100.0" y="891.0" width="54" height="32" rx="16" fill="#fff1f2" stroke="#b91c1c" stroke-opacity="0.35"/><text x="127.0" y="914.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">07</text><text x="102.0" y="948.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">过去五年的大部分时间</tspan></text><text x="102.0" y="987.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">过去五年的大部分时间：中国的若干日本化症状比日本</tspan><tspan x="102.0" dy="24.1">更明显</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">中国会成为下一个日本吗：房地产调整与家庭信心的经济链条 · 章节 01</tspan></text>

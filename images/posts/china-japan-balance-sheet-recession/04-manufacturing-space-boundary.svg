crosoft YaHei',sans-serif" font-size="17px" font-weight="800">06</text><text x="1078.0" y="683.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="1078.0" dy="0.0">实体投入</tspan></text><text x="1078.0" y="722.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">实体投入：基础设施、机器人装配线、高速铁路</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="873.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#b91c1c" stroke-opacity="0.16"/></g><rect x="100.0" y="891.0" width="54" height="32" rx="16" fill="#fff1f2" stroke="#b91c1c" stroke-opacity="0.35"/><text x="127.0" y="914.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">07</text><rect x="434.0" y="893.0" width="90.0" height="28" rx="14" fill="#b91c1c" fill-opacity="0.12"/><text x="479.0" y="913.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">1985年</text><text x="102.0" y="948.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">日本出口竞争背景</tspan></text><text x="102.0" y="987.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">日本出口竞争背景：1985 年《广场协议》后日元升值</tspan><tspan x="102.0" dy="24.1">、对美商品变贵</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="87
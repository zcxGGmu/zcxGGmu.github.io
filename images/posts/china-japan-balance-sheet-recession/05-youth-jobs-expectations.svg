Font,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><text x="1078.0" y="418.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="1078.0" dy="0.0">预期渠道</tspan></text><text x="1078.0" y="457.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">预期渠道：悲观的未来判断提前改变当下储蓄与支出</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="608.0" width="464.0" height="241.0" rx="20" fill="#ffffff" stroke="#b91c1c" stroke-opacity="0.16"/></g><rect x="100.0" y="626.0" width="54" height="32" rx="16" fill="#fff1f2" stroke="#b91c1c" stroke-opacity="0.35"/><text x="127.0" y="649.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><rect x="410.0" y="628.0" width="114.0" height="28" rx="14" fill="#b91c1c" fill-opacity="0.12"/><text x="467.0" y="648.0" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">30%–40%</text><text x="102.0" y="683.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">部分年轻人眼见房产数年间下跌约</tspan><tspan x="102.0" dy="28.1">…</tspan></text><text x="102.0" y="750.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">部分年轻人眼见房产数年间下跌约 30%–40%</tspan></text><g
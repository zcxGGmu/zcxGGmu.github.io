<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">8月A股反攻窗口：回购新高、资金低点与配置节奏</title>
  <desc id="desc">7月调整后，股债性价比、估值分化、交易热度、行业动量、回购规模和资金流向共同指向配置窗口打开，三季度应保持积极但分批执行。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="0.58" stop-color="#0f766e"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#fff" stroke-width="3">
    <path d="M120 690 H1480"/><path d="M120 570 H1480"/><path d="M120 450 H1480"/><path d="M120 330 H1480"/>
    <path d="M300 240 V760"/><path d="M600 240 V760"/><path d="M900 240 V760"/><path d="M1200 240 V760"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M160 680 C320 570 470 620 650 485 C825 350 960 455 1160 305 C1290 190 1410 205 1500 130" fill="none" stroke="#f8fafc" stroke-width="15" stroke-linecap="round" opacity="0.88"/>
    <circle cx="650" cy="485" r="42" fill="#facc15"/><circle cx="1160" cy="305" r="50" fill="#f8fafc" opacity="0.92"/>
    <rect x="112" y="590" width="500" height="118" rx="24" fill="#f8fafc" opacity="0.94"/>
    <text x="152" y="665" fill="#0f766e" font-family="Noto Sans SC, PingFang SC, Arial" font-size="42" font-weight="800">8月反攻窗口</text>
  </g>
  <text x="96" y="155" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="58" font-weight="800">8月A股反攻窗口：</text><text x="96" y="227" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">回购新高、资金低点与配置节奏</text>
  <text x="100" y="315" fill="#f8fafc" opacity="0.92" font-family="Noto Sans SC, PingFang SC, Arial" font-size="36" font-weight="700">回购新高 · 资金低点 · 配置节奏</text>
  <text x="102" y="382" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="28" font-weight="600">7月调整后，股债性价比、估值分化、交易热度、行业动量、回购规模和资金流向共同指向配置窗口打开</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">高盛：不必期待消费复苏，低增速才是基准情景</title>
  <desc id="desc">一篇围绕中国消费复苏压力的宏观深度草稿：高盛为何判断下半年社零只能温和改善，补贴退坡、居民收入、房地产负财富效应、储蓄率和资产负债表如何共同压制消费动能。</desc>

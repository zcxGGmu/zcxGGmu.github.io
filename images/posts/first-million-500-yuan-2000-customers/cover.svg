<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">赚到第一桶 100 万：把 500 元价值卖给 2000 个人</title>
  <desc id="desc">把 100 万拆成 500 元乘以 2000 个客户，普通人的赚钱问题就会从空想变成找人、成交、交付和迭代。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="0.55" stop-color="#0f766e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#ffffff" stroke-width="2">
    <path d="M120 655 H1480"/><path d="M120 535 H1480"/><path d="M120 415 H1480"/>
    <path d="M390 260 V750"/><path d="M760 260 V750"/><path d="M1130 260 V750"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M170 650 C340 560 510 590 680 455 C860 312 1030 398 1210 270 C1325 188 1422 158 1500 120" fill="none" stroke="#f8fafc" stroke-width="13" stroke-linecap="round" opacity="0.86"/>
    <circle cx="680" cy="455" r="34" fill="#ffffff" opacity="0.92"/><circle cx="1210" cy="270" r="44" fill="#f8fafc" opacity="0.96"/>
    <rect x="94" y="585" width="520" height="132" rx="26" fill="#ffffff" opacity="0.92"/>
    <text x="132" y="660" fill="#0f172a" font-family="Noto Sans SC, PingFang SC, Arial" font-size="38" font-weight="800">商业思维 · 普通人赚钱方法</text>
    <text x="132" y="700" fill="#0f766e" font-family="Noto Sans SC, PingFang SC, Arial" font-size="25" font-weight="700">9 min 深度梳理</text>
  </g>
  <text x="92" y="145" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">赚到第一桶 100 万：</text><text x="92" y="215" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="42" font-weight="800">把 500 元价值卖给 2000 个人</text>
  <text x="96" y="322" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="30" font-weight="700">把 100 万拆成 500 元乘以 2000 个客户，普通人的赚钱问题就会从空想变成找人、成交、交付和迭代。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#6d4d72"/><stop offset="1" stop-color="#d27c57"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d27c57"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">为什么A股容易亏钱：交易结构、情绪周期与风险控制</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">指数与账户</tspan></text><text x="236" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="236" y="478">比较指数收益、持仓行业、买卖时间、现金</tspan><tspan x="236" y="502">比例和分红口径，解释结果为何偏离</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">交易成本</tspan></text><text x="620" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="620" y="478">记录佣金、印花税、滑点、冲击成本和换手</tspan><tspan x="620" y="502">率；频繁交易会放大微小判断误差</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">风险暴露</tspan></text><text x="1004" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1004" y="478">核对单股、单行业、融资、流动性和事件集</tspan><tspan x="1004" y="502">中度，避免组合风险同向叠加</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">复盘纪律</tspan></text><text x="1388" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1388" y="478">统计计划内交易、止损执行、最大回撤、盈</tspan><tspan x="1388" y="502">亏比和错误类型，不用单次盈亏评价能力</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
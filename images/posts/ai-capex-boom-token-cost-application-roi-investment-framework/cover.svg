<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 一定会改变世界，但投资回报不能只看热度</title>
  <desc id="desc">AI 是基础设施革命，也是一场资本开支竞赛。真正需要判断的是 token 成本、上游价值捕获、应用 ROI 和现金流纪律。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="0.55" stop-color="#dc2626"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#ffffff" stroke-width="2">
    <path d="M120 655 H1480"/><path d="M120 535 H1480"/><path d="M120 415 H1480"/>
    <path d="M390 260 V750"/><path d="M760 260 V750"/><path d="M1130 260 V750"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M170 650 C340 560 510 590 680 455 C860 312 1030 398 1210 270 C1325 188 1422 158 1500 120" fill="none" stroke="#f8fafc" stroke-width="13" stroke-linecap="round" opacity="0.86"/>
    <circle cx="680" cy="455" r="34" fill="#ffffff" opacity="0.92"/><circle cx="1210" cy="270" r="44" fill="#f8fafc" opacity="0.96"/>
    <rect x="94" y="585" width="520" height="132" rx="26" fill="#ffffff" opacity="0.92"/>
    <text x="132" y="660" fill="#0f172a" font-family="Noto Sans SC, PingFang SC, Arial" font-size="38" font-weight="800">科技产业 · AI投资</text>
    <text x="132" y="700" fill="#dc2626" font-family="Noto Sans SC, PingFang SC, Arial" font-size="25" font-weight="700">12 min 深度梳理</text>
  </g>
  <text x="92" y="145" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">AI 一定会改变世界，但投资回报不能只看热度</text>
  <text x="96" y="322" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="30" font-weight="700">AI 是基础设施革命，也是一场资本开支竞赛。真正需要判断的是 token 成本、上游价值捕获、应用 ROI </text>
</svg>
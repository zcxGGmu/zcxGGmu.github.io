<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><defs><linearGradient id="h" x1="0" x2="1"><stop stop-color="#3d6875"/><stop offset="1" stop-color="#d58c48"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d58c48"/></marker></defs><rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#h)"/><text x="70" y="75" text-anchor="start" font-size="38" font-weight="800" fill="#fff"><tspan x="70" y="75">从关键变量到结果的传导路径</tspan></text><text x="72" y="131" text-anchor="start" font-size="21" font-weight="500" fill="#f3f7f4"><tspan x="72" y="131">主题涉及电子布全产业库存状态、玻璃基板量产时点以及半导体材料国产替代进展。可确认的方向是电子布全产业库存并不高、玻璃基板量产较原先预期提前约</tspan><tspan x="72" y="159">半年、半导体材料本土化速度加快；具体公司、产能、订单和时间表未披露，需用经营数据复核。</tspan></text><rect x="70" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#3d6875" stroke-width="4"/><circle cx="112" cy="398" r="22" fill="#3d6875"/><text x="112" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">01</text><text x="235" y="470" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40"><tspan x="235" y="470">库存与订单</tspan></text><path d="M408 452H440" stroke="#d58c48" stroke-width="6" marker-end="url(#a)"/><rect x="450" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#d58c48" stroke-width="4"/><circle cx="492" cy="398" r="22" fill="#d58c48"/><text x="492" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">02</text><text x="615" y="470" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40"><tspan x="615" y="470">量产爬坡</tspan></text><path d="M788 452H820" stroke="#d58c48" stroke-width="6" marker-end="url(#a)"/><rect x="830" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#6d8462" stroke-width="4"/><circle cx="872" cy="398" r="22" fill="#6d8462"/><text x="872" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">03</text><text x="995" y="470" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40"><tspan x="995" y="470">验证与良率</tspan></text><path d="M1168 452H1200" stroke="#d58c48" stroke-width="6" marker-end="url(#a)"/><rect x="1210" y="350" width="330" height="205" rx="10" fill="#ffffff" stroke="#3d6875" stroke-width="4"/><circle cx="1252" cy="398" r="22" fill="#3d6875"/><text x="1252" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">04</text><text x="1375" y="470" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40"><tspan x="1375" y="470">国产替代兑现</tspan></text><rect x="70" y="640" width="1450" height="88" rx="10" fill="#e5eeea"/><text x="795" y="685" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="795" y="685">每一步都需要经营或社会数据支撑，流程不代表确定因果</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">事实、估计与待核验项按正文口径区分</text></svg>
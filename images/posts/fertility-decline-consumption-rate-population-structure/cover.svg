<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#7c3aed" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#7c3aed"/><text x="80.0" y="155.0" fill="#7c3aed" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28.0px" font-weight="700" text-anchor="start"><tspan x="80.0" dy="0.0">文章导览 · 章节图谱</tspan></text><text x="80.0" y="245.0" fill="#312e81" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="60.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">少子化如何拖累消费率：人口结构、家庭负担与2040年</tspan><tspan x="80.0" dy="72.0">前后的变化</tspan></text><text x="80.0" y="391.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">以章节关系、关键数据与条件口径组织内容。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="462.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.16"/></g><rect x="100.0" y="482.0" width="58" height="34" rx="17" fill="#7c3aed"/><text x="129.0" y="506.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">01</text><text x="176.0" y="510.0" fill="#312e81" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">核心结论</tspan></text><text x="102.0" y="552.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">老龄化与少子化对消费率的传导路径。对照收入份额、家庭类型权重与影响释放时间，概</tspan><tspan x="102.0" dy="23.0">括两种人口变化的不同机制</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="462.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.16"/></g><rect x="832.0" y="482.0" width="58" height="34" rx="17" fill="#7c3aed"/><text x="861.0" y="506.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">02</text><text x="908.0" y="510.0" fill="#312e81" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">消费率的含义与人口背景</tspan></text><text x="834.0" y="552.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">消费率定义与人口结构预测。把消费倾向的分母、人口年龄结构和预测区间放在同一张图</tspan><tspan x="834.0" dy="23.0">中</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="686.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.16"/></g><rect x="100.0" y="706.0" width="58" height="34" rx="17" fill="#7c3aed"/><text x="129.0" y="730.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">03</text><text x="176.0" y="734.0" fill="#312e81" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">老龄化的两种作用方向</tspan></text><text x="102.0" y="776.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">消费倾向较高，收入份额却较低。年龄消费率曲线与家庭收入份额并列呈现</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="686.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.16"/></g><rect x="832.0" y="706.0" width="58" height="34" rx="17" fill="#7c3aed"/><text x="861.0" y="730.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">04</text><text x="908.0" y="734.0" fill="#312e81" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">少子化与家庭消费率</tspan></text><text x="834.0" y="776.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">有子女家庭的消费率通常更高。按年龄组与子女数比较家庭消费率</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="910.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.16"/></g><rect x="100.0" y="930.0" width="58" height="34" rx="17" fill="#7c3aed"/><text x="129.0" y="954.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">05</text><text x="176.0" y="958.0" fill="#312e81" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">少子化影响为何更大、更早</tspan></text><text x="102.0" y="1000.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">出生队列变化与消费率压力的时间分布。展示未成年人口变化、出生人口下降及预测情景</tspan><tspan x="102.0" dy="23.0">差异</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="910.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.16"/></g><rect x="832.0" y="930.0" width="58" height="34" rx="17" fill="#7c3aed"/><text x="861.0" y="954.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">06</text><text x="908.0" y="958.0" fill="#312e81" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">生育率变化与长期适应</tspan></text><text x="834.0" y="1000.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">阶段性回升与长期低位并存。将近期生育率数据与历史类比并列，区分统计信息和历史解</tspan><tspan x="834.0" dy="23.0">释</tspan></text><text x="80.0" y="1140.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">阅读顺序：章节标题 → 关键数据 → 证据与条件</tspan></text>
</svg>
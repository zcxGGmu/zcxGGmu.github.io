-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">数据项</tspan></text><text x="102.0" y="858.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">factor=生育率回升；direction=短期不能逆转结构；mechanism=</tspan><tspan x="102.0" dy="29.5">新出生人口需成长二十年以上才明显改变家庭与劳动年龄结构；timing</tspan><tspan x="102.0" dy="29.5">=长期滞后</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">少子化如何拖累消费率：人口结构、家庭负担与2040年前后的变化 · 章节 01</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">极端波动下的投资方式与仓位</title><desc id="desc">极端波动下的投资方式与仓位：按期限选择方法，以信号、收入承受力和仓位边界管理交易风险</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity="0.16"/><stop offset="1" stop-color="#2563eb" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#2563eb" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#2563eb"/><text x="80.0" y="148.0" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">章节 05 / 06</tspan></text><text x="80.0" y="223.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="51.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">极端波动下的投资方式与仓位</tspan></text><text x="80.0" y="287.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">按期限选择方法，以信号、收入承受力和仓位边界管理交易风险</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="343.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">01</text><text x="102.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">短期与长期</tspan></text><text x="102.0" y="452.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">短期价格受资金和情绪影响较大；长期表现更</tspan><tspan x="102.0" dy="20.1">多取决于盈利和价值，两者可能不同步。</tspan></text><line x1="102.0" y1="488.4" x2="400.0" y2="488.4" stroke="#2563eb" stroke-opacity="0.20"/><text x="102.0" y="501.4" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="102.0" dy="0.0">口径：短期价格与长期价值的区别</tspan></text><g filter="url(#shadow)"><rect x="446.0" y="343.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="466.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="493.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">02</text><rect x="682.0" y="363.0" width="86.0" height="28" rx="14" fill="#2563eb" fill-opacity="0.12"/><text x="725.0" y="383.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">1.6%</text><text x="468.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="468.0" dy="0.0">长债比较</tspan></text><text x="468.0" y="452.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="468.0" dy="0.0">长债收益率当时约为1.6%，用于说明其他资产</tspan><tspan x="468.0" dy="20.1">潜在收益空间有限。</tspan></text><line x1="468.0" y1="488.4" x2="766.0" y2="488.4" stroke="#2563eb" stroke-opacity="0.20"/><text x="468.0" y="501.4" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="468.0" dy="0.0">口径：我国长债收益率1.6%的市场比较</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="343.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">03</text><text x="834.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">两类交易路径</tspan></text><text x="834.0" y="452.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">强趋势交易依赖独立判断和执行；技术指标与</tspan><tspan x="834.0" dy="20.1">规则提供更直观的信号抓手。</tspan></text><line x1="834.0" y1="488.4" x2="1132.0" y2="488.4" stroke="#2563eb" stroke-opacity="0.20"/><text x="834.0" y="501.4" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="834.0" dy="0.0">口径：强趋势交易与技术规则交易的适用范围</tspan></text><g filter="url(#shadow)"><rect x="1178.0" y="343.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="1198.0" y="361.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="1225.0" y="384.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="1200.0" y="418.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="1200.0" dy="0.0">学习时间</tspan></text><text x="1200.0" y="452.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="1200.0" dy="0.0">逐步练习并形成一套打法的学习周期约两到三</tspan><tspan x="1200.0" dy="20.1">年。</tspan></text><line x1="1200.0" y1="488.4" x2="1498.0" y2="488.4" stroke="#2563eb" stroke-opacity="0.20"/><text x="1200.0" y="501.4" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="1200.0" dy="0.0">口径：掌握一套交易方法的时间估计</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="608.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="626.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="649.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">05</text><text x="102.0" y="683.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">配置与交易边界</tspan></text><text x="102.0" y="717.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">A股可以长期配置、长期持有，但需要选择适合</tspan><tspan x="102.0" dy="20.1">配置的品种；强趋势策略依赖市场环境、趋势</tspan><tspan x="102.0" dy="20.1">识别和执行能力。</tspan></text><line x1="102.0" y1="773.5" x2="400.0" y2="773.5" stroke="#2563eb" stroke-opacity="0.20"/><text x="102.0" y="786.5" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="102.0" dy="0.0">口径：长期配置与强趋势交易的边界</tspan></text><g filter="url(#shadow)"><rect x="446.0" y="608.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="466.0" y="626.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="493.0" y="649.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">06</text><text x="468.0" y="683.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="468.0" dy="0.0">市场信号纪律</tspan></text><text x="468.0" y="717.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="468.0" dy="0.0">有价格和成交量信号时行动，没有信号时等待</tspan><tspan x="468.0" dy="20.1">；不单靠题材故事预设结果。</tspan></text><line x1="468.0" y1="753.4" x2="766.0" y2="753.4" stroke="#2563eb" stroke-opacity="0.20"/><text x="468.0" y="766.4" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="468.0" dy="0.0">口径：依据价格与成交量反应进行交易的规则</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="608.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="626.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="649.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">07</text><rect x="1048.0" y="628.0" width="86.0" height="28" rx="14" fill="#2563eb" fill-opacity="0.12"/><text x="1091.0" y="648.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15px" font-weight="800">3只</text><text x="834.0" y="683.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">仓位上限</tspan></text><text x="834.0" y="717.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">多数投资者持股控制在3只以内；技术交易保留</tspan><tspan x="834.0" dy="20.1">操作空间，半仓轮动且不满仓。</tspan></text><line x1="834.0" y1="753.4" x2="1132.0" y2="753.4" stroke="#2563eb" stroke-opacity="0.20"/><text x="834.0" y="766.4" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="834.0" dy="0.0">口径：风险管理建议</tspan></text><g filter="url(#shadow)"><rect x="1178.0" y="608.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="1198.0" y="626.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="1225.0" y="649.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">08</text><text x="1200.0" y="683.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="1200.0" dy="0.0">承受能力</tspan></text><text x="1200.0" y="717.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="1200.0" dy="0.0">若单日盈亏超过一个月或数月工资，仓位可能</tspan><tspan x="1200.0" dy="20.1">影响理性判断；先评估可能亏损。</tspan></text><line x1="1200.0" y1="753.4" x2="1498.0" y2="753.4" stroke="#2563eb" stroke-opacity="0.20"/><text x="1200.0" y="766.4" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="1200.0" dy="0.0">口径：风险承受力判断</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="873.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="100.0" y="891.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="127.0" y="914.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">09</text><text x="102.0" y="948.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">项目与资金组织</tspan></text><text x="102.0" y="982.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">板块行情可能涉及立项、资金组织、研究服务</tspan><tspan x="102.0" dy="20.1">与机构资源；个人应观察活动是否反映在价格</tspan><tspan x="102.0" dy="20.1">和成交量。</tspan></text><line x1="102.0" y1="1038.5" x2="400.0" y2="1038.5" stroke="#2563eb" stroke-opacity="0.20"/><text x="102.0" y="1051.5" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="102.0" dy="0.0">口径：市场项目运作与资金组织的类比</tspan></text><g filter="url(#shadow)"><rect x="446.0" y="873.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="466.0" y="891.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="493.0" y="914.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">10</text><text x="468.0" y="948.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="468.0" dy="0.0">配置仓与交易仓</tspan></text><text x="468.0" y="982.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="468.0" dy="0.0">配置仓与成长股交易仓应区分；反弹后不宜因</tspan><tspan x="468.0" dy="20.1">短期上涨扩大成长股仓位或满仓押注单票。</tspan></text><line x1="468.0" y1="1018.4" x2="766.0" y2="1018.4" stroke="#2563eb" stroke-opacity="0.20"/><text x="468.0" y="1031.4" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="468.0" dy="0.0">口径：配置与交易仓位的区分</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="873.0" width="342.0" height="241.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.16"/></g><rect x="832.0" y="891.0" width="54" height="32" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><text x="859.0" y="914.0" text-anchor="middle" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">11</text><text x="834.0" y="948.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">市场阶段识别</tspan></text><text x="834.0" y="982.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">单次涨跌不能单独判定市场阶段结束；还需观</tspan><tspan x="834.0" dy="20.1">察政策层面的标志性动作。</tspan></text><line x1="834.0" y1="1018.4" x2="1132.0" y2="1018.4" stroke="#2563eb" stroke-opacity="0.20"/><text x="834.0" y="1031.4" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.0px" font-weight="500" text-anchor="start"><tspan x="834.0" dy="0.0">口径：政策标志性动作的市场阶段判断条件</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">为什么今年的A股行情如此极端？ · 章节 05</tspan></text>
</svg>
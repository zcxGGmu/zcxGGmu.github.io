<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">中国AI用电需求大增：储能为什么迎来长期机遇</title>
  <desc id="desc">中国AI算力竞争的关键变量，正在从单颗芯片性能扩展到单位美元算力、数据中心电价、绿色电力消纳和储能系统稳定供电。若2035年AI数据中心用电需求升至1476太瓦时，储能将不只是备用电源，而会成为连接算力网络、电网调度、新能源消纳和电力市场化收益的核心基础设施。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">表观增长与核心利润分化</title>
  <desc id="desc">营收和归母净利润高增长，扣非净利润同比和环比下降，说明主业盈利质量承压。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="86" y="104" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">表观增长很亮，核心利润在收缩</text>
  <text x="86" y="143" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748b">二季度的关键不是利润是否超预期，而是利润来自哪里、能否持续。</text>

  <line x1="92" y1="518" x2="762" y2="518" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="92" y1="238" x2="92" y2="518" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#94a3b8">
    <text x="62" y="523">0%</text>
    <text x="53" y="438">10%</text>
    <text x="53" y="353">20%</text>
    <text x="53" y="268">30%</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="92" y1="433" x2="762" y2="433"/>
    <line x1="92" y1="348" x2="762" y2="348"/>
    <line x1="92" y1="263" x2="762" y2="263"/>
  </g>

  <rect x="158" y="267" width="104" height="251" rx="12" fill="#2563eb"/>
  <rect x="336" y="235" width="104" height="283" rx="12" fill="#1d4ed8"/>
  <rect x="514" y="518" width="104" height="45" rx="12" fill="#f97316"/>
  <rect x="642" y="518" width="104" height="66" rx="12" fill="#fb923c"/>
  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" text-anchor="middle">
    <text x="210" y="252" font-size="30" font-weight="700" fill="#1e3a8a">+29.5%</text>
    <text x="210" y="551" font-size="17" fill="#334155">Q2营收</text>
    <text x="388" y="220" font-size="30" font-weight="700" fill="#1e3a8a">+28.3%</text>
    <text x="388" y="551" font-size="17" fill="#334155">归母净利</text>
    <text x="566" y="610" font-size="30" font-weight="700" fill="#c2410c">-5.3%</text>
    <text x="566" y="551" font-size="17" fill="#334155">扣非同比</text>
    <text x="694" y="632" font-size="30" font-weight="700" fill="#c2410c">-7.7%</text>
    <text x="694" y="551" font-size="17" fill="#334155">扣非环比</text>
  </g>

  <rect x="824" y="213" width="260" height="250" rx="24" fill="#f8fafc" stroke="#dbeafe" stroke-width="2"/>
  <text x="954" y="266" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748b">Q2扣非净利润</text>
  <text x="954" y="333" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="58" font-weight="800" fill="#0f172a">11.6</text>
  <text x="954" y="370" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">亿元</text>
  <path d="M880 414 L1028 414" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <text x="954" y="449" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#c2410c">主营造血没有同步增强</text>

  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569">
    <circle cx="838" cy="512" r="7" fill="#2563eb"/>
    <text x="858" y="518">headline 利润反映表面弹性</text>
    <circle cx="838" cy="548" r="7" fill="#f97316"/>
    <text x="858" y="554">扣非利润反映主业质量</text>
  </g>
</svg>

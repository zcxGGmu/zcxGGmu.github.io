<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">资本开支循环</title>
  <desc id="desc">AI 硬件快速迭代会推动供应商不断提前投入设备，折旧、淘汰和现金流压力形成循环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#166534" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="86" y="104" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">AI 硬件繁荣背后的资本开支循环</text>
  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <path d="M600 196 C776 196 918 287 918 398 C918 509 776 580 600 580 C424 580 282 509 282 398 C282 287 424 196 600 196" fill="none" stroke="#bbf7d0" stroke-width="26" stroke-linecap="round"/>
    <path d="M756 216 C857 255 918 321 918 398" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M860 492 C806 548 709 580 600 580" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M442 560 C341 522 282 465 282 398" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M338 302 C388 237 482 196 600 196" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

    <rect x="466" y="170" width="268" height="82" rx="22" fill="#ecfdf5" stroke="#86efac"/>
    <text x="600" y="204" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">新架构规格抬升</text>
    <text x="600" y="232" text-anchor="middle" font-size="15" fill="#166534">更高速度、密度与热负荷</text>

    <rect x="792" y="350" width="256" height="82" rx="22" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="920" y="384" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">提前购置设备</text>
    <text x="920" y="412" text-anchor="middle" font-size="15" fill="#1d4ed8">先投入，再等认证放量</text>

    <rect x="466" y="536" width="268" height="82" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="600" y="570" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">折旧进入成本</text>
    <text x="600" y="598" text-anchor="middle" font-size="15" fill="#9a3412">利用率不足时压低毛利率</text>

    <rect x="150" y="350" width="264" height="82" rx="22" fill="#fee2e2" stroke="#fecaca"/>
    <text x="282" y="384" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">旧设备可能减值</text>
    <text x="282" y="412" text-anchor="middle" font-size="15" fill="#991b1b">上一代甜蜜期缩短</text>

    <rect x="430" y="324" width="340" height="140" rx="28" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="600" y="372" text-anchor="middle" font-size="23" font-weight="800" fill="#0f172a">真正要验证</text>
    <text x="600" y="414" text-anchor="middle" font-size="18" fill="#334155">现金流能否跟上扩产节奏</text>
  </g>
</svg>

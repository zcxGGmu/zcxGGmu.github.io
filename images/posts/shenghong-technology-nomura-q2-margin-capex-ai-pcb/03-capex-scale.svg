<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">资本开支规模与方向</title>
  <desc id="desc">上半年购买固定资产、厂房及设备现金支出约七十一亿元，同比增长二百二十八个百分点，方向指向高阶 AI PCB 产能。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#155e75" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="86" y="104" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">71 亿元不是普通扩产，而是提前买门票</text>
  <text x="86" y="143" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748b">资本开支的判断重点，是它对应传统产能，还是对应下一代平台认证与良率爬坡。</text>

  <g transform="translate(92 208)" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="0" width="352" height="308" rx="26" fill="#ecfeff" stroke="#bae6fd"/>
    <text x="34" y="54" font-size="19" font-weight="700" fill="#155e75">PP&amp;E现金支出</text>
    <text x="34" y="148" font-size="86" font-weight="800" fill="#0f172a">71</text>
    <text x="178" y="148" font-size="34" font-weight="800" fill="#0f172a">亿元</text>
    <text x="34" y="205" font-size="28" font-weight="700" fill="#0891b2">同比 +228%</text>
    <text x="34" y="254" font-size="17" fill="#475569">对应上半年营收约 116 亿元，强度约 61%</text>
  </g>

  <g transform="translate(516 214)" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#0f172a">钱主要买什么能力</text>
    <g transform="translate(0 42)">
      <rect x="0" y="0" width="520" height="62" rx="18" fill="#eff6ff"/>
      <rect x="0" y="0" width="156" height="62" rx="18" fill="#2563eb" opacity="0.88"/>
      <text x="28" y="39" font-size="18" font-weight="700" fill="#ffffff">激光钻孔</text>
      <text x="182" y="39" font-size="17" fill="#334155">更高孔位精度，更复杂层间互连</text>
    </g>
    <g transform="translate(0 124)">
      <rect x="0" y="0" width="520" height="62" rx="18" fill="#f0fdf4"/>
      <rect x="0" y="0" width="180" height="62" rx="18" fill="#16a34a" opacity="0.88"/>
      <text x="28" y="39" font-size="18" font-weight="700" fill="#ffffff">高精度曝光</text>
      <text x="206" y="39" font-size="17" fill="#334155">线宽线距与图形控制升级</text>
    </g>
    <g transform="translate(0 206)">
      <rect x="0" y="0" width="520" height="62" rx="18" fill="#fff7ed"/>
      <rect x="0" y="0" width="132" height="62" rx="18" fill="#f97316" opacity="0.92"/>
      <text x="28" y="39" font-size="18" font-weight="700" fill="#ffffff">电镀线</text>
      <text x="158" y="39" font-size="17" fill="#334155">稳定厚铜与高层板可靠性</text>
    </g>
  </g>

  <path d="M206 568 C354 548 444 558 568 568 C704 580 834 580 1002 552" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1002" cy="552" r="9" fill="#f97316"/>
  <text x="772" y="598" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#475569">短期压利润率，长期等待订单与利用率验证</text>
</svg>

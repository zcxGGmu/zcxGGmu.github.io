<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">毛利率下滑拆解</title>
  <desc id="desc">上半年和二季度毛利率均下降，材料涨价、价格传导滞后和折旧前置共同压缩主业利润。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#9a3412" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="52" y="46" width="1096" height="583" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="86" y="104" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">毛利率压力是主业利润下滑的主线</text>
  <text x="86" y="143" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748b">收入扩张仍在继续，但单位产品留下的毛利减少，扣非利润被吞掉。</text>

  <g transform="translate(86 212)" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="0" width="220" height="260" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="110" y="48" text-anchor="middle" font-size="18" fill="#64748b">上半年毛利率</text>
    <text x="110" y="122" text-anchor="middle" font-size="58" font-weight="800" fill="#0f172a">33.2%</text>
    <text x="110" y="165" text-anchor="middle" font-size="24" font-weight="700" fill="#f97316">-3.0pct</text>
    <text x="110" y="210" text-anchor="middle" font-size="16" fill="#64748b">压力已经进入半年报</text>
  </g>
  <g transform="translate(344 212)" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="0" width="260" height="260" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="130" y="48" text-anchor="middle" font-size="18" fill="#9a3412">二季度毛利率</text>
    <text x="130" y="122" text-anchor="middle" font-size="62" font-weight="800" fill="#7c2d12">32.1%</text>
    <text x="130" y="165" text-anchor="middle" font-size="23" font-weight="700" fill="#ea580c">同比 -6.7pct</text>
    <text x="130" y="202" text-anchor="middle" font-size="23" font-weight="700" fill="#ea580c">环比 -2.4pct</text>
  </g>

  <g transform="translate(672 200)" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#0f172a">压力路径</text>
    <g transform="translate(0 34)">
      <rect x="0" y="0" width="350" height="58" rx="18" fill="#eff6ff"/>
      <text x="28" y="37" font-size="18" font-weight="700" fill="#1d4ed8">覆铜板与高性能材料涨价</text>
    </g>
    <path d="M175 96 L175 126" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(0 128)">
      <rect x="0" y="0" width="350" height="58" rx="18" fill="#fef3c7"/>
      <text x="28" y="37" font-size="18" font-weight="700" fill="#92400e">客户价格传导滞后</text>
    </g>
    <path d="M175 190 L175 220" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(0 222)">
      <rect x="0" y="0" width="350" height="58" rx="18" fill="#ffedd5"/>
      <text x="28" y="37" font-size="18" font-weight="700" fill="#9a3412">新增设备折旧提前进入成本</text>
    </g>
    <path d="M175 284 L175 314" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <rect x="0" y="316" width="350" height="70" rx="18" fill="#fee2e2"/>
    <text x="28" y="346" font-size="18" font-weight="700" fill="#991b1b">结果：扣非利润承压</text>
    <text x="28" y="374" font-size="15" fill="#991b1b">收入增长没有完全转化为主业利润</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>

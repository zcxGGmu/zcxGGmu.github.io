<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#2c6070"/><stop offset="1" stop-color="#6eaa9d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d8894d"/></marker></defs><rect width="1600" height="900" fill="#f5f2eb"/><rect x="0" y="0" width="1600" height="170" fill="url(#bg)"/><text x="70" y="82" font-size="42" font-weight="800" fill="#ffffff">产业与财务传导链</text><text x="70" y="130" font-size="23" fill="#eaf4f2">由业务输入传导至经营结果</text><rect x="90" y="360" width="290" height="130" rx="18" fill="#ffffff" stroke="#2c6070" stroke-width="4"/><text x="235" y="435" text-anchor="middle" font-size="24" font-weight="700" fill="#182b36">一、三季度交付增长，订单却落后于交付</text><path d="M390 425 L485 425" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="495" y="360" width="290" height="130" rx="18" fill="#ffffff" stroke="#6eaa9d" stroke-width="4"/><text x="640" y="435" text-anchor="middle" font-size="24" font-weight="700" fill="#182b36">二、车型结构决定增长的含金量</text><path d="M795 425 L890 425" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="900" y="360" width="290" height="130" rx="18" fill="#ffffff" stroke="#d58a51" stroke-width="4"/><text x="1045" y="435" text-anchor="middle" font-size="24" font-weight="700" fill="#182b36">三、ES9车型组合与每车成本压力</text><path d="M1200 425 L1295 425" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="1305" y="360" width="290" height="130" rx="18" fill="#ffffff" stroke="#f2efe8" stroke-width="4"/><text x="1450" y="435" text-anchor="middle" font-size="24" font-weight="700" fill="#182b36">四、换电网络的服务价值要由利用率兑现</text><text x="70" y="840" font-size="20" fill="#5f7075">事实 / 机制 / 验证信号 · 信息图</text></svg>
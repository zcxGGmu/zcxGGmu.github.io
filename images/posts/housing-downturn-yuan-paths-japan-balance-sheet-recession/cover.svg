<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">房地产下行之后，人民币会走向哪里？日本经验与三种情景</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">以日本泡沫破裂后的强日元、资产负债表衰退和后来的主动贬值为参照，拆分中国家庭去杠杆、资本账户管理、贸易顺差与社会保障之间的关系，</tspan><tspan x="72" y="162">建立人民币未来三种条件式路径。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="231" y="465">日本泡沫破裂后资本回流</tspan><tspan x="231" y="492">和债权国地位推高日元</tspan></text><path d="M404 390H436" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="613" y="465">企业或家庭资产负债表修</tspan><tspan x="613" y="492">复压低借款与投资需求</tspan></text><path d="M786 390H818" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="995" y="465">多年修复后政策通过宽松</tspan><tspan x="995" y="492">和财政扩张改变汇率路径</tspan></text><path d="M1168 390H1200" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="451" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="1377" y="451">中国三种情景取决于外</tspan><tspan x="1377" y="478">需、资本管理与居民收入</tspan><tspan x="1377" y="505">再分配</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
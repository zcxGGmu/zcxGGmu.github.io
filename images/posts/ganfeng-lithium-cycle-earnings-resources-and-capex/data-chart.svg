<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">赣锋锂业与锂周期：价格反弹、资源布局和盈利兑现的三重检验</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">2025年度</tspan></text><text x="236" y="490" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="236" y="490">赣锋锂业营业收入期间口径</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">230.82亿元</tspan></text><text x="620" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="620" y="478">2025年营业收入；约数，按年</tspan><tspan x="620" y="503">报摘要</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">同比+22.08%</tspan></text><text x="1004" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="1004" y="478">2025年营业收入较2024年</tspan><tspan x="1004" y="503">增幅</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">未披露于摘要</tspan></text><text x="1388" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="1388" y="478">此处未列净利润、经营现金流、库</tspan><tspan x="1388" y="503">存及分业务毛利数值</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#3d8174"/><stop offset="1" stop-color="#e0a042"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#e0a042"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">Grab与GoTo的平台经济：佣金上限、司机收入与金融服务转型</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">以Grab与GoTo为例，梳理平台、司机与乘客之间的收益张力，以及印尼两轮车佣金上限由20%降至8%的影响路径。平台转向金融服务</tspan><tspan x="72" y="162">与合作伙伴身份属于重要观察维度；政策适用范围、时间、产品规模和财务影响未披露。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="231" y="473">乘客支付与出行需求</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="613" y="473">平台撮合并分配订单</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="995" y="473">司机收入与平台佣金</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="1377" y="473">金融服务及生态延展</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
le-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="102.0" dy="0.0">赤字观察值</tspan></text><text x="102.0" y="858.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">2027年广义政府赤字是否扩大 2万亿元</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="740.5" width="708.0" height="373.5" rx="20" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.16"/></g><rect x="832.0" y="758.5" width="54" height="32" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-opacity="0.35"/><text x="859.0" y="781.5" text-anchor="middle" fill="#dc2626" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17px" font-weight="800">04</text><text x="834.0" y="815.5" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26.0px" font-weight="700" text-anchor="start"><tspan x="834.0" dy="0.0">待回答情景</tspan></text><text x="834.0" y="858.2" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">全球AI降温时，新增赤字能否填补现房销售模式造成的产业链现金流缺</tspan><tspan x="834.0" dy="29.5">口</tspan></text><text x="80.0" y="1145.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">中国经济的短期企稳与2027年考验 · 章节 05</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#335f72"/><stop offset="1" stop-color="#cc6e43"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#cc6e43"/></marker></defs><g transform="scale(0.8 1)">
<rect width="2000" height="900" fill="#f2f5f3"/><rect width="2000" height="190" fill="url(#head)"/>
<text x="68" y="73" text-anchor="start" font-size="38" font-weight="650" fill="#fff"><tspan x="68" y="73">七、以10月30日三季报检验900元情景的经营基础</tspan></text><text x="70" y="145" text-anchor="start" font-size="21" font-weight="650" fill="#eef6f2"><tspan x="70" y="145">三季报是验证收入质量、利润弹性和现金流的下一节点。</tspan></text><rect x="68" y="340" width="420" height="220" rx="10" fill="#fff" stroke="#2d6570" stroke-width="4"/><rect x="68" y="340" width="420" height="14" fill="#2d6570"/><text x="96" y="395" font-size="17" font-weight="700" fill="#2d6570">节点 01</text><text x="278" y="470" text-anchor="middle" font-size="25" font-weight="650" fill="#20343b"><tspan x="278" y="470">三季报披露</tspan></text><path d="M496 450H546" stroke="#d48745" stroke-width="7" marker-end="url(#arrow)"/><rect x="568" y="340" width="420" height="220" rx="10" fill="#fff" stroke="#d48745" stroke-width="4"/><rect x="568" y="340" width="420" height="14" fill="#d48745"/><text x="596" y="395" font-size="17" font-weight="700" fill="#d48745">节点 02</text><text x="778" y="470" text-anchor="middle" font-size="25" font-weight="650" fill="#20343b"><tspan x="778" y="470">经营质量</tspan></text><path d="M996 450H1046" stroke="#d48745" stroke-width="7" marker-end="url(#arrow)"/><rect x="1068" y="340" width="420" height="220" rx="10" fill="#fff" stroke="#4f8a65" stroke-width="4"/><rect x="1068" y="340" width="420" height="14" fill="#4f8a65"/><text x="1096" y="395" font-size="17" font-weight="700" fill="#4f8a65">节点 03</text><text x="1278" y="470" text-anchor="middle" font-size="25" font-weight="650" fill="#20343b"><tspan x="1278" y="470">估值重估</tspan></text><rect x="68" y="635" width="1430" height="90" rx="10" fill="#e5eeea"/><text x="783" y="680" text-anchor="middle" font-size="21" font-weight="650" fill="#43575d"><tspan x="783" y="680">三季报应把增长、投入、现金和估值四条线放在同一张验证表中。</tspan></text>
<text x="70" y="850" font-size="18" fill="#5d6e72">机制面板 · 数字与期间以正文及正式披露为准</text></g></svg>
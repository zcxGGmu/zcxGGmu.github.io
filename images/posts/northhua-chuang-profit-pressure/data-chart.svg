<text x="68" y="73" text-anchor="start" font-size="38" font-weight="650" fill="#fff"><tspan x="68" y="73">关键数据与口径边界</tspan></text><text x="70" y="145" text-anchor="start" font-size="21" font-weight="650" fill="#eef6f2"><tspan x="70" y="145">北方华创增收不增利：研发、并购与900元目标价的验证链</tspan></text><rect x="60" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#2d6570" stroke-width="4"/><rect x="60" y="320" width="350" height="14" fill="#2d6570"/><text x="235" y="415" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="235" y="415">2025收入 +约31%</tspan></text><text x="235" y="505" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="235" y="505">收入增长与净利润变化方向不同</tspan></text><rect x="445" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#d48745" stroke-width="4"/><rect x="445" y="320" width="350" height="14" fill="#d48745"/><text x="620" y="397" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="620" y="397">2026H1 +24.9%</tspan><tspan x="620" y="433"> / +5.05%</tspan></text><text x="620" y="505" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="620" y="505">收入与归母净利润同比口径</tspan></text><rect x="830" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#4f8a65" stroke-width="4"/><rect x="830" y="320" width="350" height="14" fill="#4f8a65"/><text x="1005" y="415" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="1005" y="415">研发投入 54亿元</tspan></text><text x="1005" y="505" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="1005" y="505">长期产品与客户验证投入</tspan></text><rect x="1215" y="320" width="350" height="270" rx="10" fill="#fff" stroke="#9a5d57" stroke-width="4"/><rect x="1215" y="320" width="350" height="14" fill="#9a5d57"/><text x="1390" y="397" text-anchor="middle" font-size="27" font-weight="650" fill="#20343b"><tspan x="1390" y="397">594元 / 约76倍 P</tspan><tspan x="1390" y="433">E</tspan></text><text x="1390" y="494" text-anchor="middle" font-size="17" font-weight="650" fill="#52666d"><tspan x="1390" y="494">已记录价格与已记录估值口径；900元为</tspan><tspan x="1390" y="516">野村目标价</tspan></text><rect x="60" y="650" width="1470" height="72" rx="10" fill="#e9ece7"/><text x="795" y="687" text-anchor="middle" font-size="20" font-weight="650" fill="#43575d"><tspan x="795" y="687">信息卡只呈现已确认口径或待观察变量，不构造缺乏依据的趋势。</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">杭州商务KTV“倒查三年流水、集体关门”有实证吗？经营压力与官方消费数据</tspan></text>
<text x="72" y="117" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="117">“倒查三年流水”和“商K集体关门”是需要逐条核实的强判断。现有公开官方材料未提供针对杭州商务KTV的统一三年流水倒查公告、全行业</tspan><tspan x="72" y="147">闭店清单或同口径经营数据；国家统计局的服务零售与文化服务统计只能作为更宽口径的消费背景，不能证明商K整体崩盘。梳理证据层级、娱乐</tspan><tspan x="72" y="177">场所合规边界、线下服务业成本结构，以及判断个别停业是否构成行业趋势所需的数据。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="231" y="456">区分标题说法、正式执法</tspan><tspan x="231" y="490">信息与可核验记录</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="613" y="456">用宽口径消费统计描述环</tspan><tspan x="613" y="490">境，不替代商K专项数据</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="995" y="456">逐店核对停业原因、时间</tspan><tspan x="995" y="490">、经营主体与监管文书</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="1377" y="456">只有持续且同口径的数据</tspan><tspan x="1377" y="490">才能支持行业趋势判断</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
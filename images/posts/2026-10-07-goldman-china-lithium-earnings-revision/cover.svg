<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">高盛中国锂行业盈利修正：方向未披露，先看预测如何落到产业链</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">高盛中国金属与矿业主题涉及中国锂行业盈利预测或判断修正。公开信息未披露修正方向、幅度、涉及公司名单或锂价假设，因此不推测盈利上调</tspan><tspan x="72" y="162">或下调；文章从价格、产量、成本、库存、需求和模型口径说明后续核验路径。</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#49677a"/><stop offset="1" stop-color="#d59a54"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d8894d"/></marker></defs><rect width="1600" height="900" fill="#f5f2eb"/><rect width="1600" height="175" fill="url(#head)"/><text x="68" y="82" font-size="39" font-weight="800" fill="#fff">日本“冰河期世代”：1993—2004年的就业寒冬，如何影响一生的职业轨迹？</text><text x="70" y="132" font-size="23" fill="#eff5ef">日本“冰河期世代”在泡沫经济破裂后的招聘低谷进入职场，非正规就业与起薪受挫的影响延伸至工资、晋升、储蓄和退休保障；宏观复苏并不会自动抹平代际创伤。</text><rect x="78" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#49677a" stroke-width="4"/><circle cx="118" cy="390" r="18" fill="#49677a"/><text x="228" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">衰退期毕业</text><path d="M383 430 L453 430" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="468" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#d59a54" stroke-width="4"/><circle cx="508" cy="390" r="18" fill="#d59a54"/><text x="618" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">起点岗位受限</text><path d="M773 430 L843 430" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="858" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#657d64" stroke-width="4"/><circle cx="898" cy="390" r="18" fill="#657d64"/><text x="1008" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">工资晋升累积差</text><path d="M1163 430 L1233 430" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="1248" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#49677a" stroke-width="4"/><circle cx="1288" cy="390" r="18" fill="#49677a"/><text x="1398" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">储蓄与退休承压</text><text x="70" y="842" font-size="20" fill="#5f7075">机制示意图 · 结构关系不代表确定的因果幅度</text></svg>
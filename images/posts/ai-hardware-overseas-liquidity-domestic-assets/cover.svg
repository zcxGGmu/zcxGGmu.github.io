<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">AI硬件景气、海外流动性与国内资产：哪些信号能验证</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">AI硬件需求与股价预期并不同步，海外利率和美元融资条件也会传导到风险资产。把产业盈利、外部流动性和国内资产的驱动因素分开检验，才</tspan><tspan x="72" y="162">能识别哪些变化是事实、哪些仍是情景。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="478" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="231" y="478">拆分硬件订单与盈利</tspan></text><path d="M404 390H436" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="478" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="613" y="478">识别外部利率和美元传导</tspan></text><path d="M786 390H818" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="478" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="995" y="478">核对国内资产盈利来源</tspan></text><path d="M1168 390H1200" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="478" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="1377" y="478">用反证和指标更新判断</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 正文说明关键变量、统计口径与判断边界</text></svg>
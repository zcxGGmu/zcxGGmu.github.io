<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AgentTeams 深度拆解：Matrix 房间里的多 Agent 协作操作系统</title>
  <desc id="desc">AgentTeams 把 Manager、Worker、Team、Matrix 房间、MinIO/OSS、Higress 网关和 OpenClaw/Hermes 等运行时组织成可见、可管、可审计的多 Agent 协作系统。</desc>

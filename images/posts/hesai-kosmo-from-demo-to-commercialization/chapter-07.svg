<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#567c56"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#567c56"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">七、为商业化进度建立可复核观察表</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">以交付、复购、单位经济和反证条件跟踪商业化，而不把演示当成结果。</tspan></text>
<rect x="70" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#347a73" stroke-width="3"/><rect x="70" y="300" width="450" height="12" rx="6" fill="#347a73"/><circle cx="118" cy="362" r="24" fill="#347a73"/><text x="118" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">01</text><text x="158" y="369" font-size="17" font-weight="700" fill="#347a73">关键维度</text><text x="295" y="436" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="295" y="436">版本追踪</tspan></text><path d="M100 473H490" stroke="#e3e9e5" stroke-width="2"/><text x="100" y="509" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="100" y="537" text-anchor="start" font-size="17" font-weight="500" fill="#30464d"><tspan x="100" y="537">跟踪商业化可以按产品、验证、客户、交付和财务</tspan><tspan x="100" y="559">五类信息建立观察表。</tspan></text><text x="100" y="604" font-size="14" font-weight="700" fill="#347a73">核对线索</text><text x="100" y="632" text-anchor="start" font-size="13" font-weight="500" fill="#52666d"><tspan x="100" y="632">财务栏检查相关收入披露、毛利贡献、应收和现金回款。</tspan></text><path d="M528 464H563" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="580" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#df8b4c" stroke-width="3"/><rect x="580" y="300" width="450" height="12" rx="6" fill="#df8b4c"/><circle cx="628" cy="362" r="24" fill="#df8b4c"/><text x="628" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">02</text><text x="668" y="369" font-size="17" font-weight="700" fill="#df8b4c">关键维度</text><text x="805" y="436" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="805" y="436">复购指标</tspan></text><path d="M610 473H1000" stroke="#e3e9e5" stroke-width="2"/><text x="610" y="509" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="610" y="548" text-anchor="start" font-size="17" font-weight="500" fill="#30464d"><tspan x="610" y="548">每条信息要标注日期、适用范围和证据性质。</tspan></text><text x="610" y="604" font-size="14" font-weight="700" fill="#df8b4c">核对线索</text><text x="610" y="632" text-anchor="start" font-size="13" font-weight="500" fill="#52666d"><tspan x="610" y="632">验证假设也要包含失败条件。</tspan></text><path d="M1038 464H1073" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1090" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#b94f4f" stroke-width="3"/><rect x="1090" y="300" width="450" height="12" rx="6" fill="#b94f4f"/><circle cx="1138" cy="362" r="24" fill="#b94f4f"/><text x="1138" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">03</text><text x="1178" y="369" font-size="17" font-weight="700" fill="#b94f4f">关键维度</text><text x="1315" y="436" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="1315" y="436">失效条件</tspan></text><path d="M1120 473H1510" stroke="#e3e9e5" stroke-width="2"/><text x="1120" y="509" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="1120" y="537" text-anchor="start" font-size="17" font-weight="500" fill="#30464d"><tspan x="1120" y="537">客户试点长期不能进入采购、交付需要大量定制、</tspan><tspan x="1120" y="559">验收反复延期、复购不足或服务成本持续超过收…</tspan></text><text x="1120" y="604" font-size="14" font-weight="700" fill="#b94f4f">核对线索</text><text x="1120" y="624" text-anchor="start" font-size="13" font-weight="500" fill="#52666d"><tspan x="1120" y="624">最终评价应依据公开证据和已确认的经营结果，并清楚标示</tspan><tspan x="1120" y="641">仍未获得验证的部分。</tspan></text><rect x="70" y="692" width="1450" height="104" rx="14" fill="#e5eeea"/><rect x="70" y="692" width="14" height="104" rx="7" fill="#347a73"/><text x="112" y="735" font-size="17" font-weight="700" fill="#347a73">本节结论</text><text x="820" y="755" text-anchor="middle" font-size="22" font-weight="650" fill="#20343b"><tspan x="820" y="755">以交付、复购、单位经济和反证条件跟踪商业化，而不把演示当成结果。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">内容要点由章节正文提炼；结构图呈现机制，不替代数据核验</text></svg>
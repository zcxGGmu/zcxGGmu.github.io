<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">30到40岁：普通人从出卖时间到建立资产的关键十年</title>
  <desc id="desc">把纳瓦尔关于杠杆、判断力和资产的框架放进普通人的人生阶段，30到40岁是从时间收入切换到资产收入的关键窗口。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#2563eb"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#ffffff" stroke-width="2">
    <path d="M120 655 H1480"/><path d="M120 535 H1480"/><path d="M120 415 H1480"/>
    <path d="M390 260 V750"/><path d="M760 260 V750"/><path d="M1130 260 V750"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M170 650 C340 560 510 590 680 455 C860 312 1030 398 1210 270 C1325 188 1422 158 1500 120" fill="none" stroke="#f8fafc" stroke-width="13" stroke-linecap="round" opacity="0.86"/>
    <circle cx="680" cy="455" r="34" fill="#ffffff" opacity="0.92"/><circle cx="1210" cy="270" r="44" fill="#f8fafc" opacity="0.96"/>
    <rect x="94" y="585" width="520" height="132" rx="26" fill="#ffffff" opacity="0.92"/>
    <text x="132" y="660" fill="#0f172a" font-family="Noto Sans SC, PingFang SC, Arial" font-size="38" font-weight="800">个人成长 · 人生策略</text>
    <text x="132" y="700" fill="#2563eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="25" font-weight="700">12 min 深度梳理</text>
  </g>
  <text x="92" y="145" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">30到40岁：</text><text x="92" y="215" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="42" font-weight="800">普通人从出卖时间到建立资产的关键十年</text>
  <text x="96" y="322" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="30" font-weight="700">把纳瓦尔关于杠杆、判断力和资产的框架放进普通人的人生阶段，30到40岁是从时间收入切换到资产收入的关键窗口。</text>
</svg>
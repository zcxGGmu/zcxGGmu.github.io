<title id="title">政府能迅速行动，日常审批仍可能陷入停滞</title><desc id="desc">政府能迅速行动，日常审批仍可能陷入停滞：紧急任务可以集中提速，但地方审批与层叠医疗保障规则仍会将时间成本交给个人。</desc><defs>

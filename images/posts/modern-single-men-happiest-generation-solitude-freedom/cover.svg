<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">现代单身男性为什么可能是最快乐的一代：独处、自由与内在秩序</title>
  <desc id="desc">单身不是情感失败，而是把时间、金钱、注意力、身体和精神重新交还给自己。真正成熟的亲密关系必须是选择，而不是依赖、恐惧或社会时间表。</desc>

<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">数据中心液冷设备怎么比较：CDU与传统冷水机组的全生命周期价值</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">围绕数据中心冷却设备，比较CDU与传统冷水机组的生命周期服务收入、利润乘数和品牌替换风险。已知判断是CDU利润乘数明显低于冷水机</tspan><tspan x="72" y="162">组，涉及寿命较短与利润率正常化；具体年限、计算公式和财务数字未披露。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="231" y="473">冷却设备投入</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="613" y="473">运行维护与维修</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="995" y="473">部件或整机更换</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="1377" y="473">生命周期收入与利润比较</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
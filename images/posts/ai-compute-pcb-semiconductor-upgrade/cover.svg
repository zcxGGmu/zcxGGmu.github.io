    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.56" stop-color="#2563eb"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#ffffff" stroke-width="2">
    <path d="M120 660 H1480"/><path d="M120 540 H1480"/><path d="M120 420 H1480"/>
    <path d="M360 255 V765"/><path d="M720 255 V765"/><path d="M1080 255 V765"/><path d="M1440 255 V765"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M155 664 C310 570 500 600 665 468 C835 332 1014 398 1192 282 C1310 204 1405 158 1495 112" fill="none" stroke="#f8fafc" stroke-width="13" stroke-linecap="round" opacity="0.86"/>
    <circle cx="665" cy="468" r="32" fill="#ffffff" opacity="0.92"/><circle cx="1192" cy="282" r="42" fill="#f8fafc" opacity="0.96"/>
    <rect x="94" y="590" width="575" height="138" rx="26" fill="#ffffff" opacity="0.92"/>
    <text x="132" y="664" fill="#0f172a" font-family="Noto Sans SC, PingFang SC, Arial" font-size="36" font-weight="800">科技商业 · AI算力硬件与PCB</text>
    <text x="132" y="707" fill="#2563eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="24" font-weight="700">32 min 深度梳理 · AI服务器 · PCB · CCL</text>
  </g>
  <text x="92" y="132" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="48" font-weight="800">AI算力PCB进入半导体化：</text><text x="92" y="200" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="40" font-weight="800">从M6到PTFE，从高多层到MSAP</text>

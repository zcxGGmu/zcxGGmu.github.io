<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><defs><linearGradient id="h" x1="0" x2="1"><stop stop-color="#2d6570"/><stop offset="1" stop-color="#d48745"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d48745"/></marker></defs><rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="190" fill="url(#h)"/><text x="70" y="72" text-anchor="start" font-size="36" font-weight="800" fill="#fff">数据口径与验证面板</text><text x="72" y="130" text-anchor="start" font-size="21" font-weight="500" fill="#f3f7f4">缺少统一数字时，用口径、范围和信号替代虚构的精确曲线。</text><rect x="70" y="350" width="320" height="220" rx="12" fill="#fff" stroke="#2d6570" stroke-width="4"/><circle cx="112" cy="398" r="22" fill="#2d6570"/><text x="112" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">01</text><text x="230" y="460" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40">已确认</text><text x="230" y="515" text-anchor="middle" font-size="18" font-weight="500" fill="#5e7073">标题或简介明确给出的方向</text><path d="M398 460H430" stroke="#d48745" stroke-width="6" marker-end="url(#arr)"/><rect x="450" y="350" width="320" height="220" rx="12" fill="#fff" stroke="#d48745" stroke-width="4"/><circle cx="492" cy="398" r="22" fill="#d48745"/><text x="492" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">02</text><text x="610" y="460" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40">未确认</text><text x="610" y="515" text-anchor="middle" font-size="18" font-weight="500" fill="#5e7073">金额、比例、样本与时间表</text><path d="M778 460H810" stroke="#d48745" stroke-width="6" marker-end="url(#arr)"/><rect x="830" y="350" width="320" height="220" rx="12" fill="#fff" stroke="#4f8a65" stroke-width="4"/><circle cx="872" cy="398" r="22" fill="#4f8a65"/><text x="872" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">03</text><text x="990" y="460" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40">可观察</text><text x="990" y="515" text-anchor="middle" font-size="18" font-weight="500" fill="#5e7073">订单、行为、成本与结果</text><path d="M1158 460H1190" stroke="#d48745" stroke-width="6" marker-end="url(#arr)"/><rect x="1210" y="350" width="320" height="220" rx="12" fill="#fff" stroke="#8a5b78" stroke-width="4"/><circle cx="1252" cy="398" r="22" fill="#8a5b78"/><text x="1252" y="405" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">04</text><text x="1370" y="460" text-anchor="middle" font-size="24" font-weight="700" fill="#243b40">更新方式</text><text x="1370" y="515" text-anchor="middle" font-size="18" font-weight="500" fill="#5e7073">出现新披露后按同口径复核</text><rect x="70" y="660" width="1450" height="90" rx="12" fill="#e5eeea"/><text x="795" y="705" text-anchor="middle" font-size="21" font-weight="600" fill="#43575d">数据图只呈现证据边界，不把解释写成事实。</text><text x="70" y="850" font-size="18" fill="#5e7073">结构化解释｜事实、解释与待核验变量分层呈现</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">优绩主义之外：运气、尊严与重新定义努力</title><desc id="desc">优绩主义之外：运气、尊严与重新定义努力的章节结构与重点信息。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#312e81" stop-opacity="0.16"/><stop offset="1" stop-color="#312e81" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#312e81" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#312e81"/><text x="80.0" y="155.0" fill="#312e81" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28.0px" font-weight="700" text-anchor="start"><tspan x="80.0" dy="0.0">文章导览 · 章节图谱</tspan></text><text x="80.0" y="245.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="60.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">优绩主义之外：运气、尊严与重新定义努力</tspan></text><text x="80.0" y="319.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">以章节关系、关键数据与条件口径组织内容。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="390.0" width="464.0" height="162.0" rx="22" fill="#ffffff" stroke="#312e81" stroke-opacity="0.16"/></g><rect x="100.0" y="410.0" width="58" height="34" rx="17" fill="#312e81"/><text x="129.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">01</text><text x="176.0" y="438.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">优绩主义从警示性概念变成成功学信</tspan><tspan x="176.0" dy="26.8">条</tspan></text><text x="102.0" y="503.7" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">1958年提出的讽刺性公式，后来被改造成解释成功与失败的社</tspan><tspan x="102.0" dy="20.0">会准则。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="390.0" width="464.0" height="162.0" rx="22" fill="#ffffff" stroke="#312e81" stroke-opacity="0.16"/></g><rect x="588.0" y="410.0" width="58" height="34" rx="17" fill="#312e81"/><text x="617.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">02</text><text x="664.0" y="438.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">2019年东京大学入学典礼的参照</tspan></text><text x="590.0" y="476.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">顶尖学校的成绩需要放回家庭条件、资源机会和选拔规则中理</tspan><tspan x="590.0" dy="20.0">解。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="390.0" width="464.0" height="162.0" rx="22" fill="#ffffff" stroke="#312e81" stroke-opacity="0.16"/></g><rect x="1076.0" y="410.0" width="58" height="34" rx="17" fill="#312e81"/><text x="1105.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">03</text><text x="1152.0" y="438.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">一个北大研究生的两层运气</tspan></text><text x="1078.0" y="476.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">城市教育、家庭支持、早期训练与规则匹配共同影响考试结果</tspan><tspan x="1078.0" dy="20.0">。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="576.0" width="464.0" height="162.0" rx="22" fill="#ffffff" stroke="#312e81" stroke-opacity="0.16"/></g><rect x="100.0" y="596.0" width="58" height="34" rx="17" fill="#312e81"/><text x="129.0" y="620.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">04</text><text x="176.0" y="624.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">“卵巢彩票”与资本的层次</tspan></text><text x="102.0" y="662.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">出生条件与可承受失败的安全网，会影响才能能否转化为机会</tspan><tspan x="102.0" dy="20.0">。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="576.0" width="464.0" height="162.0" rx="22" fill="#ffffff" stroke="#312e81" stroke-opacity="0.16"/></g><rect x="588.0" y="596.0" width="58" height="34" rx="17" fill="#312e81"/><text x="617.0" y="620.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">05</text><text x="664.0" y="624.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">数据如何揭开“公平竞争”的表面</tspan></text><text x="590.0" y="662.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">教育结果的统计差异说明，名次与个人投入之间还隔着家庭资</tspan><tspan x="590.0" dy="20.0">源和起点。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="576.0" width="464.0" height="162.0" rx="22" fill="#ffffff" stroke="#312e81" stroke-opacity="0.16"/></g><rect x="1076.0" y="596.0" width="58" height="34" rx="17" fill="#312e81"/><text x="1105.0" y="620.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">06</text><text x="1152.0" y="624.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">从优绩主义到社会达尔文主义：贫穷</tspan><tspan x="1152.0" dy="26.8">不应成为羞辱</tspan></text><text x="1078.0" y="689.7" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">社会的文明程度体现在是否让无法参赛的人保有生活便利和基</tspan><tspan x="1078.0" dy="20.0">本尊严。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="762.0" width="464.0" height="162.0" rx="22" fill="#ffffff" stroke="#312e81" stroke-opacity="0.16"/></g><rect x="100.0" y="782.0" width="58" height="34" rx="17" fill="#312e81"/><text x="129.0" y="806.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">07</text><text x="176.0" y="810.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">优胜者也会陷入自我剥削</tspan></text><text x="102.0" y="848.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">外部鞭子内化为自我监督后，即使没有奖惩，日常任务也会被</tspan><tspan x="102.0" dy="20.0">改造成竞赛。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="762.0" width="464.0" height="162.0" rx="22" fill="#ffffff" stroke="#312e81" stroke-opacity="0.16"/></g><rect x="588.0" y="782.0" width="58" height="34" rx="17" fill="#312e81"/><text x="617.0" y="806.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">08</text><text x="664.0" y="810.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">躺平为何常常只是优绩主义的后遗症</tspan></text><text x="590.0" y="848.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">退出竞争可能只是把内卷摆向放弃，内心的胜负审判仍然存在</tspan><tspan x="590.0" dy="20.0">。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="762.0" width="464.0" height="162.0" rx="22" fill="#ffffff" stroke="#312e81" stroke-opacity="0.16"/></g><rect x="1076.0" y="782.0" width="58" height="34" rx="17" fill="#312e81"/><text x="1105.0" y="806.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">09</text><text x="1152.0" y="810.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">四个方向：把价值从分数中解绑</tspan></text><text x="1078.0" y="848.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">从不被量化的体验、无目的活动、谦卑和内在动机开始松开排</tspan><tspan x="1078.0" dy="20.0">名束缚。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="948.0" width="464.0" height="162.0" rx="22" fill="#ffffff" stroke="#312e81" stroke-opacity="0.16"/></g><rect x="100.0" y="968.0" width="58" height="34" rx="17" fill="#312e81"/><text x="129.0" y="992.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">10</text><text x="176.0" y="996.0" fill="#1e1b4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">结语：承认幸运，保护尊严</tspan></text><text x="102.0" y="1034.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">保留努力与优秀，同时承认幸运、避免傲慢，并允许失败和停</tspan><tspan x="102.0" dy="20.0">下来。</tspan></text><text x="80.0" y="1140.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">阅读顺序：章节标题 → 关键数据 → 证据与条件</tspan></text>
</svg>
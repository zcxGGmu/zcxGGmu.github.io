<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">从进化论理解长期投资：避开大风险，买好生意，长期持有</title><desc id="desc">从进化论理解长期投资：避开大风险，买好生意，长期持有的章节结构与重点信息。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e" stop-opacity="0.16"/><stop offset="1" stop-color="#0f766e" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#0f766e" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#0f766e"/><text x="80.0" y="155.0" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28.0px" font-weight="700" text-anchor="start"><tspan x="80.0" dy="0.0">文章导览 · 章节图谱</tspan></text><text x="80.0" y="245.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="60.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">从进化论理解长期投资：避开大风险，买好生意，长期</tspan><tspan x="80.0" dy="72.0">持有</tspan></text><text x="80.0" y="391.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">以章节关系、关键数据与条件口径组织内容。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="462.0" width="464.0" height="144.0" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="482.0" width="58" height="34" rx="17" fill="#0f766e"/><text x="129.0" y="506.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">01</text><text x="176.0" y="510.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">长期主动投资胜出的难点</tspan></text><text x="102.0" y="548.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">长期战胜市场的主动基金比例较低，单只基金的高回报仍属于</tspan><tspan x="102.0" dy="20.0">特定历史案例。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="462.0" width="464.0" height="144.0" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="588.0" y="482.0" width="58" height="34" rx="17" fill="#0f766e"/><text x="617.0" y="506.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">02</text><text x="664.0" y="510.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">把永久损失放在首位</tspan></text><text x="590.0" y="548.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">错误筛选的代价取决于好坏企业基数；降低误选坏公司的概率</tspan><tspan x="590.0" dy="20.0">可提高候选池质量。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="462.0" width="464.0" height="144.0" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="1076.0" y="482.0" width="58" height="34" rx="17" fill="#0f766e"/><text x="1105.0" y="506.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">03</text><text x="1152.0" y="510.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">以资本回报率建立研究池</tspan></text><text x="1078.0" y="548.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">多年兑现的资本回报率用于缩小研究范围，后续仍需检查企业</tspan><tspan x="1078.0" dy="20.0">与买入价格。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="630.0" width="464.0" height="144.0" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="650.0" width="58" height="34" rx="17" fill="#0f766e"/><text x="129.0" y="674.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">04</text><text x="176.0" y="678.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">韧性来自现金、分散和有限试错</tspan></text><text x="102.0" y="716.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">企业韧性由资产负债、客户结构、供应链、竞争优势和小步试</tspan><tspan x="102.0" dy="20.0">错共同构成。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="630.0" width="464.0" height="144.0" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="588.0" y="650.0" width="58" height="34" rx="17" fill="#0f766e"/><text x="617.0" y="674.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">05</text><text x="664.0" y="678.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">区分短期噪声与长期经营变化</tspan></text><text x="590.0" y="716.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">判断新闻影响时，需比较多年经营、市场份额和企业根基的变</tspan><tspan x="590.0" dy="20.0">化。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="630.0" width="464.0" height="144.0" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="1076.0" y="650.0" width="58" height="34" rx="17" fill="#0f766e"/><text x="1105.0" y="674.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">06</text><text x="1152.0" y="678.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">用历史模式和外部视角检验生意</tspan></text><text x="1078.0" y="716.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">比较相似行业、市场和时期的重复结果，评估商业模式是否有</tspan><tspan x="1078.0" dy="20.0">广泛证据。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="798.0" width="464.0" height="144.0" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="818.0" width="58" height="34" rx="17" fill="#0f766e"/><text x="129.0" y="842.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">07</text><text x="176.0" y="846.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">识别可信信号与廉价信息</tspan></text><text x="102.0" y="884.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">宣传材料与预测容易塑造印象，多年经营记录和独立访谈提供</tspan><tspan x="102.0" dy="20.0">交叉验证。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="798.0" width="464.0" height="144.0" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="588.0" y="818.0" width="58" height="34" rx="17" fill="#0f766e"/><text x="617.0" y="842.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">08</text><text x="664.0" y="846.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">在恐慌中按价格买入</tspan></text><text x="590.0" y="884.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">危机是把长期跟踪与当前价格放在一起检验的时点，不要求准</tspan><tspan x="590.0" dy="20.0">确预测市场底部。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="798.0" width="464.0" height="144.0" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="1076.0" y="818.0" width="58" height="34" rx="17" fill="#0f766e"/><text x="1105.0" y="842.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">09</text><text x="1152.0" y="846.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">用进化尺度理解波动、周期与长期持</tspan><tspan x="1152.0" dy="26.8">有</tspan></text><text x="1078.0" y="911.7" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">短期波动与长期稳定可以并存，极少数赢家贡献了大量市场财</tspan><tspan x="1078.0" dy="20.0">富。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="966.0" width="464.0" height="144.0" rx="22" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.16"/></g><rect x="100.0" y="986.0" width="58" height="34" rx="17" fill="#0f766e"/><text x="129.0" y="1010.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">10</text><text x="176.0" y="1014.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">用简单流程执行，并明确适用边界</tspan></text><text x="102.0" y="1052.8" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">长期持有需结合基本面复核；将不可逆损失与可逆试错分开、</tspan><tspan x="102.0" dy="20.0">过滤信息噪声，并重视技能、声誉与健康的长期积累。</tspan></text><text x="80.0" y="1140.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">阅读顺序：章节标题 → 关键数据 → 证据与条件</tspan></text>
</svg>
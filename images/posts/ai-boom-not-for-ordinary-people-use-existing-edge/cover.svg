<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 风口与你无关：普通人真正能用的，是自己的信息差</title>
  <desc id="desc">AI 会成为基础设施，真正值钱的是已有领域、行业经验、客户理解和可交付结果；AI 只是效率增压器。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#0d9488"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#ffffff" stroke-width="2">
    <path d="M120 655 H1480"/><path d="M120 535 H1480"/><path d="M120 415 H1480"/>
    <path d="M390 260 V750"/><path d="M760 260 V750"/><path d="M1130 260 V750"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M170 650 C340 560 510 590 680 455 C860 312 1030 398 1210 270 C1325 188 1422 158 1500 120" fill="none" stroke="#f8fafc" stroke-width="13" stroke-linecap="round" opacity="0.86"/>
    <circle cx="680" cy="455" r="34" fill="#ffffff" opacity="0.92"/><circle cx="1210" cy="270" r="44" fill="#f8fafc" opacity="0.96"/>
    <rect x="94" y="585" width="520" height="132" rx="26" fill="#ffffff" opacity="0.92"/>
    <text x="132" y="660" fill="#0f172a" font-family="Noto Sans SC, PingFang SC, Arial" font-size="38" font-weight="800">商业 · AI 时代普通人</text>
    <text x="132" y="700" fill="#0d9488" font-family="Noto Sans SC, PingFang SC, Arial" font-size="25" font-weight="700">9 min 深度梳理</text>
  </g>
  <text x="92" y="145" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">AI 风口与你无关：</text><text x="92" y="215" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="42" font-weight="800">普通人真正能用的，是自己的信息差</text>
  <text x="96" y="322" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="30" font-weight="700">AI 会成为基础设施，真正值钱的是已有领域、行业经验、客户理解和可交付结果；AI 只是效率增压器。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">一、“少了131万”是可复算差值，不是动机调查</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">131万是2023与2026公布规模之差，不等于一群人的动机变化。</tspan></text>
<rect x="70" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#347a73" stroke-width="3"/><rect x="70" y="300" width="450" height="12" rx="6" fill="#347a73"/><circle cx="118" cy="362" r="24" fill="#347a73"/><text x="118" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">01</text><text x="158" y="369" font-size="17" font-weight="700" fill="#347a73">关键维度</text><text x="295" y="436" text-anchor="middle" font-size="20" font-weight="750" fill="#20343b"><tspan x="295" y="436">招生年度</tspan></text><path d="M100 473H490" stroke="#e3e9e5" stroke-width="2"/><text x="100" y="500" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="100" y="527" text-anchor="start" font-size="15" font-weight="500" fill="#30464d"><tspan x="100" y="527">中国研究生招生信息网记录，2023年全国硕士研究生招</tspan><tspan x="100" y="546">生考试全国报考人数为474万；</tspan></text><text x="100" y="594" font-size="13" font-weight="700" fill="#347a73">核对线索</text><text x="100" y="614" text-anchor="start" font-size="12" font-weight="500" fill="#52666d"><tspan x="100" y="614">2023年考试在2022年12月举行，2026年考试在2</tspan><tspan x="100" y="629">025年12月举行；</tspan></text><path d="M528 464H563" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="580" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#df8b4c" stroke-width="3"/><rect x="580" y="300" width="450" height="12" rx="6" fill="#df8b4c"/><circle cx="628" cy="362" r="24" fill="#df8b4c"/><text x="628" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">02</text><text x="668" y="369" font-size="17" font-weight="700" fill="#df8b4c">关键维度</text><text x="805" y="436" text-anchor="middle" font-size="20" font-weight="750" fill="#20343b"><tspan x="805" y="436">全国总量</tspan></text><path d="M610 473H1000" stroke="#e3e9e5" stroke-width="2"/><text x="610" y="500" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="610" y="527" text-anchor="start" font-size="15" font-weight="500" fill="#30464d"><tspan x="610" y="527">“招生年度”是考试和录取所对应的年份，并不是报名所在</tspan><tspan x="610" y="546">的日历年。</tspan></text><text x="610" y="594" font-size="13" font-weight="700" fill="#df8b4c">核对线索</text><text x="610" y="621" text-anchor="start" font-size="12" font-weight="500" fill="#52666d"><tspan x="610" y="621">2023至2025年减少86万。</tspan></text><path d="M1038 464H1073" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1090" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#b94f4f" stroke-width="3"/><rect x="1090" y="300" width="450" height="12" rx="6" fill="#b94f4f"/><circle cx="1138" cy="362" r="24" fill="#b94f4f"/><text x="1138" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">03</text><text x="1178" y="369" font-size="17" font-weight="700" fill="#b94f4f">关键维度</text><text x="1315" y="436" text-anchor="middle" font-size="20" font-weight="750" fill="#20343b"><tspan x="1315" y="436">解释边界</tspan></text><path d="M1120 473H1510" stroke="#e3e9e5" stroke-width="2"/><text x="1120" y="500" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="1120" y="527" text-anchor="start" font-size="15" font-weight="500" fill="#30464d"><tspan x="1120" y="527">可见131万是跨三个招生年度间的累计差，不是单年下降</tspan><tspan x="1120" y="546">量。</tspan></text><text x="1120" y="594" font-size="13" font-weight="700" fill="#b94f4f">核对线索</text><text x="1120" y="614" text-anchor="start" font-size="12" font-weight="500" fill="#52666d"><tspan x="1120" y="614">要讨论年轻人选择，至少还需要年龄结构、重复报考、报考专</tspan><tspan x="1120" y="629">业、到考、录取、就业及个人动机等资料。</tspan></text><rect x="70" y="692" width="1450" height="104" rx="14" fill="#e5eeea"/><rect x="70" y="692" width="14" height="104" rx="7" fill="#347a73"/><text x="112" y="735" font-size="17" font-weight="700" fill="#347a73">本节结论</text><text x="820" y="755" text-anchor="middle" font-size="22" font-weight="650" fill="#20343b"><tspan x="820" y="755">131万是2023与2026公布规模之差，不等于一群人的动机变化。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">章节要点按正文机制提炼；各指标和结论的适用边界见正文</text></svg>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#dc2626"/><text x="80.0" y="155.0" fill="#dc2626" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28.0px" font-weight="700" text-anchor="start"><tspan x="80.0" dy="0.0">文章导览 · 章节图谱</tspan></text><text x="80.0" y="245.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="60.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">2027年“保4”压力来自哪里：出口、地产与信心的传</tspan><tspan x="80.0" dy="72.0">导链</tspan></text><text x="80.0" y="391.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">以章节关系、关键数据与条件口径组织内容。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="462.0" width="464.0" height="200.0" rx="22" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.16"/></g><rect x="100.0" y="482.0" width="58" height="34" rx="17" fill="#dc2626"/><text x="129.0" y="506.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">01</text><text x="176.0" y="510.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">一、花旗将2027年增长风险归纳</tspan><tspan x="176.0" dy="30.5">为三条传导链</tspan></text><text x="102.0" y="583.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">三类压力汇聚到增长、就业与财政预期。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="462.0" width="464.0" height="200.0" rx="22" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.16"/></g><rect x="588.0" y="482.0" width="58" height="34" rx="17" fill="#dc2626"/><text x="617.0" y="506.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">02</text><text x="664.0" y="510.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">二、出口仍增长，但AI资本开支</tspan><tspan x="664.0" dy="30.5">增速预计回落</tspan></text><text x="590.0" y="583.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">AI相关出口继续增长，但全球资本开支增速预计减半。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="462.0" width="464.0" height="200.0" rx="22" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.16"/></g><rect x="1076.0" y="482.0" width="58" height="34" rx="17" fill="#dc2626"/><text x="1105.0" y="506.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">03</text><text x="1152.0" y="510.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">三、房地产下行可能继续压缩土</tspan><tspan x="1152.0" dy="30.5">地财政</tspan></text><text x="1078.0" y="583.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">销售回款、购地意愿和地方收入沿链条传导。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="686.0" width="464.0" height="200.0" rx="22" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.16"/></g><rect x="100.0" y="706.0" width="58" height="34" rx="17" fill="#dc2626"/><text x="129.0" y="730.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">04</text><text x="176.0" y="734.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">四、居民与企业的谨慎行为压低</tspan><tspan x="176.0" dy="30.5">内需</tspan></text><text x="102.0" y="807.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">还贷、储蓄与投资收缩反映支出趋于谨慎。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="686.0" width="464.0" height="200.0" rx="22" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.16"/></g><rect x="588.0" y="706.0" width="58" height="34" rx="17" fill="#dc2626"/><text x="617.0" y="730.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">05</text><text x="664.0" y="734.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">五、社会保险扩面需要兼顾缴费</tspan><tspan x="664.0" dy="30.5">能力与参保便利</tspan></text><text x="590.0" y="807.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">扩面目标与不稳定就业者的连续缴费能力需要衔接。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="686.0" width="464.0" height="200.0" rx="22" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.16"/></g><rect x="1076.0" y="706.0" width="58" height="34" rx="17" fill="#dc2626"/><text x="1105.0" y="730.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">06</text><text x="1152.0" y="734.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">六、增长预测分歧取决于房地产</tspan><tspan x="1152.0" dy="30.5">修复和外需风险</tspan></text><text x="1078.0" y="807.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">两种预测对地产修复速度和外需韧性判断不同。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="910.0" width="464.0" height="200.0" rx="22" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.16"/></g><rect x="100.0" y="930.0" width="58" height="34" rx="17" fill="#dc2626"/><text x="129.0" y="954.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">07</text><text x="176.0" y="958.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">七、名义增长预测指向政策加力</tspan><tspan x="176.0" dy="30.5">，但工具仍属情景推演</tspan></text><text x="102.0" y="1031.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">价格预测走弱对应财政、货币与居民转移支付设想。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="910.0" width="464.0" height="200.0" rx="22" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.16"/></g><rect x="588.0" y="930.0" width="58" height="34" rx="17" fill="#dc2626"/><text x="617.0" y="954.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">08</text><text x="664.0" y="958.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">八、就业与地方财政可能形成相</tspan><tspan x="664.0" dy="30.5">互强化的瓶颈</tspan></text><text x="590.0" y="1031.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">就业、消费、项目投资与地方收入之间存在反馈。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="910.0" width="464.0" height="200.0" rx="22" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.16"/></g><rect x="1076.0" y="930.0" width="58" height="34" rx="17" fill="#dc2626"/><text x="1105.0" y="954.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">09</text><text x="1152.0" y="958.0" fill="#450a0a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">九、家庭风险管理聚焦现金流、</tspan><tspan x="1152.0" dy="30.5">负债与必要支出</tspan></text><text x="1078.0" y="1031.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">家庭韧性取决于储备、负债约束与支出排序。</tspan></text><text x="80.0" y="1140.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">阅读顺序：章节标题 → 关键数据 → 证据与条件</tspan></text>
</svg>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">中国房地产周期是否筑底？一套多指标检验框架</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">需求端</tspan></text><text x="236" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="236" y="478">新房与二手房成交套数、面积、金</tspan><tspan x="236" y="503">额，城市层级和连续月份</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">价格端</tspan></text><text x="620" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="620" y="478">新房备案价、二手房成交价、折扣</tspan><tspan x="620" y="503">议价与价格改善覆盖面</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">供给端</tspan></text><text x="1004" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="1004" y="478">可售库存、去化周期、待售面积、</tspan><tspan x="1004" y="503">新开工与推盘节奏</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">资产负债表</tspan></text><text x="1388" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="1388" y="478">房企回款与融资、居民购房意愿、</tspan><tspan x="1388" y="503">地方土地收入和预期</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
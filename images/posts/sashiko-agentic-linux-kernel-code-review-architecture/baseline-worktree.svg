<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.title { font-size: 28px; font-weight: 700; fill: #111827; }
.subtitle { font-size: 14px; fill: #6b7280; }
.boxTitle { font-size: 16px; font-weight: 700; fill: #111827; }
.boxText { font-size: 12px; fill: #4b5563; }
.lane { fill: #f8fafc; stroke: #d1d5db; stroke-dasharray: 7 5; stroke-width: 1.4; }
.label { font-size: 11px; fill: #6b7280; font-weight: 700; letter-spacing: .05em; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
</defs>
<rect width="1280" height="820" fill="#ffffff"/>
<text x="48" y="50" class="title" text-anchor="start">Baseline 检测与 Worktree 安全模型</text>
<text x="50" y="78" class="subtitle" text-anchor="start">Sashiko 先找到能应用整组 patch 的基线，再让 AI 在已应用后的代码状态里审查</text>
<rect x="70" y="160" width="170" height="105" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="86" y="188" class="boxTitle" text-anchor="start">Patchset</text>
<text x="86" y="212" class="boxText" text-anchor="start">diff files</text>
<text x="86" y="230" class="boxText" text-anchor="start">subject/body</text>
<text x="86" y="248" class="boxText" text-anchor="start">forced baseline?</text>
<rect x="310" y="160" width="170" height="105" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="326" y="188" class="boxTitle" text-anchor="start">BaselineRegistry</text>
<text x="326" y="212" class="boxText" text-anchor="start">MAINTAINERS</text>
<text x="326" y="230" class="boxText" text-anchor="start">custom remotes</text>
<text x="326" y="248" class="boxText" text-anchor="start">subject heuristics</text>
<rect x="570" y="160" width="170" height="105" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="586" y="188" class="boxTitle" text-anchor="start">Candidate refs</text>
<text x="586" y="212" class="boxText" text-anchor="start">bpf-next</text>
<text x="586" y="230" class="boxText" text-anchor="start">net-next</text>
<text x="586" y="248" class="boxText" text-anchor="start">linux-next</text>
<text x="586" y="266" class="boxText" text-anchor="start">origin/master</text>
<rect x="840" y="160" width="170" height="105" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="856" y="188" class="boxTitle" text-anchor="start">GitWorktree::new</text>
<text x="856" y="212" class="boxText" text-anchor="start">detached checkout</text>
<text x="856" y="230" class="boxText" text-anchor="start">reset --hard</text>
<text x="856" y="248" class="boxText" text-anchor="start">shared reference repo</text>
<rect x="1080" y="160" width="170" height="105" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="1096" y="188" class="boxTitle" text-anchor="start">git am</text>
<text x="1096" y="212" class="boxText" text-anchor="start">apply whole series</text>
<text x="1096" y="230" class="boxText" text-anchor="start">abort on failure</text>
<rect x="310" y="440" width="170" height="105" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="326" y="468" class="boxTitle" text-anchor="start">失败候选</text>
<text x="326" y="492" class="boxText" text-anchor="start">record log</text>
<text x="326" y="510" class="boxText" text-anchor="start">remove worktree</text>
<text x="326" y="528" class="boxText" text-anchor="start">try next baseline</text>
<rect x="660" y="440" width="170" height="105" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<text x="676" y="468" class="boxTitle" text-anchor="start">成功候选</text>
<text x="676" y="492" class="boxText" text-anchor="start">record baseline_id</text>
<text x="676" y="510" class="boxText" text-anchor="start">reuse worktree</text>
<text x="676" y="528" class="boxText" text-anchor="start">review patches</text>
<rect x="985" y="440" width="170" height="105" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1001" y="468" class="boxTitle" text-anchor="start">Cleanup</text>
<text x="1001" y="492" class="boxText" text-anchor="start">remove worktree</text>
<text x="1001" y="510" class="boxText" text-anchor="start">prune stale state</text>
<path d="M240,212 L310,212" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M480,212 L570,212" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M740,212 L840,212" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M1010,212 L1080,212" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M1165,265 L420,440" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
<path d="M1165,265 L745,440" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
<path d="M830,492 L985,492" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
<path d="M480,492 L570,265" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-orange)" stroke-dasharray="6 4"/>
<rect x="110" y="650" width="1060" height="58" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="135" y="684" class="boxTitle" text-anchor="start">关键点：baseline 选择和补丁应用是确定性验证；AI 只在“可应用后的真实代码状态”上做判断。</text>
</svg>
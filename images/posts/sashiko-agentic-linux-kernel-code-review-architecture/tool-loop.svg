<text x="946" y="482" class="boxText" text-anchor="start">grep / show / blame</text>
<text x="946" y="500" class="boxText" text-anchor="start">diff / log / read files</text>
<text x="946" y="518" class="boxText" text-anchor="start">read_prompt</text>

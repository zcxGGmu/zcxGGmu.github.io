<text x="316" y="207" class="boxText" text-anchor="start">message_id</text>
<text x="316" y="225" class="boxText" text-anchor="start">thread_id</text>
<text x="316" y="243" class="boxText" text-anchor="start">author/body</text>
<rect x="520" y="155" width="165" height="105" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>

<text x="516" y="452" class="boxText" text-anchor="start">review_id</text>
<text x="516" y="470" class="boxText" text-anchor="start">tool_name</text>
<text x="516" y="488" class="boxText" text-anchor="start">output_length</text>
<rect x="285" y="400" width="165" height="105" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="301" y="428" class="boxTitle" text-anchor="start">baselines</text>
<text x="301" y="452" class="boxText" text-anchor="start">repo_url</text>
<text x="301" y="470" class="boxText" text-anchor="start">branch</text>
<text x="301" y="488" class="boxText" text-anchor="start">commit</text>
<rect x="80" y="400" width="165" height="105" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="96" y="428" class="boxTitle" text-anchor="start">subsystems</text>
<text x="96" y="452" class="boxText" text-anchor="start">name</text>
<text x="96" y="470" class="boxText" text-anchor="start">mailing_list</text>
<path d="M245,207 L300,207" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M465,207 L520,207" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M685,207 L750,207" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M915,207 L970,207" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M1050,260 L1050,400" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
<path d="M970,450 L885,450" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
<path d="M970,500 L665,500" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
<path d="M590,260 L365,400" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
<path d="M160,400 L545,260" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="6 4"/>
<g transform="translate(80,720)">
<line x1="0" y1="8" x2="35" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="46" y="12" class="boxText" text-anchor="start">主实体关系</text>
<line x1="180" y1="8" x2="215" y2="8" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="226" y="12" class="boxText" text-anchor="start">AI/工具审计记录</text>
<line x1="410" y1="8" x2="445" y2="8" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
<text x="456" y="12" class="boxText" text-anchor="start">多对多子系统关联</text>
</g>
</svg>
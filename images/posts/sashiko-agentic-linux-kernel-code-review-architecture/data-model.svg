<text x="766" y="207" class="boxText" text-anchor="start">patchset_id</text>
<text x="766" y="225" class="boxText" text-anchor="start">message_id</text>
<text x="766" y="243" class="boxText" text-anchor="start">diff</text>
<rect x="970" y="155" width="165" height="105" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>

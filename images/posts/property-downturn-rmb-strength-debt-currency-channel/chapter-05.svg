<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#d58b4b"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d58b4b"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">五、利差是市场变量，汇率机制是政策变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">利差与汇率机制属于不同证据层级，市场成交、正式规则和传闻必须分开记录，不能用点位反推政策意图。</tspan></text>
<rect x="70" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#347a73" stroke-width="3"/><rect x="70" y="300" width="450" height="12" rx="6" fill="#347a73"/><circle cx="118" cy="362" r="24" fill="#347a73"/><text x="118" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">01</text><text x="158" y="369" font-size="17" font-weight="700" fill="#347a73">关键维度</text><text x="295" y="436" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="295" y="436">利差风险</tspan></text><path d="M100 473H490" stroke="#e3e9e5" stroke-width="2"/><text x="100" y="509" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="100" y="537" text-anchor="start" font-size="17" font-weight="500" fill="#30464d"><tspan x="100" y="537">本国与海外利率差异会影响资产配置，但利差并非</tspan><tspan x="100" y="559">汇率的唯一决定因素。</tspan></text><text x="100" y="604" font-size="14" font-weight="700" fill="#347a73">核对线索</text><text x="100" y="624" text-anchor="start" font-size="13" font-weight="500" fill="#52666d"><tspan x="100" y="624">投资者还会考虑信用风险、资本流动限制、对冲成本、预期</tspan><tspan x="100" y="641">波动、税务和资产可得性。</tspan></text><path d="M528 464H563" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="580" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#df8b4c" stroke-width="3"/><rect x="580" y="300" width="450" height="12" rx="6" fill="#df8b4c"/><circle cx="628" cy="362" r="24" fill="#df8b4c"/><text x="628" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">02</text><text x="668" y="369" font-size="17" font-weight="700" fill="#df8b4c">关键维度</text><text x="805" y="436" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="805" y="436">规则证据</tspan></text><path d="M610 473H1000" stroke="#e3e9e5" stroke-width="2"/><text x="610" y="509" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="610" y="537" text-anchor="start" font-size="17" font-weight="500" fill="#30464d"><tspan x="610" y="537">汇率机制中的中间价、逆周期调节和外汇操作，属</tspan><tspan x="610" y="559">于政策变量，公开程度与证据等级不同。</tspan></text><text x="610" y="604" font-size="14" font-weight="700" fill="#df8b4c">核对线索</text><text x="610" y="632" text-anchor="start" font-size="13" font-weight="500" fill="#52666d"><tspan x="610" y="632">正式规则、央行公告和公开数据可以作为一手证据；</tspan></text><path d="M1038 464H1073" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1090" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#b94f4f" stroke-width="3"/><rect x="1090" y="300" width="450" height="12" rx="6" fill="#b94f4f"/><circle cx="1138" cy="362" r="24" fill="#b94f4f"/><text x="1138" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">03</text><text x="1178" y="369" font-size="17" font-weight="700" fill="#b94f4f">关键维度</text><text x="1315" y="436" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="1315" y="436">政策副作用</tspan></text><path d="M1120 473H1510" stroke="#e3e9e5" stroke-width="2"/><text x="1120" y="509" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="1120" y="537" text-anchor="start" font-size="17" font-weight="500" fill="#30464d"><tspan x="1120" y="537">判断政策影响，需要观察政策前后可比的结售汇、</tspan><tspan x="1120" y="559">跨境支付、外币存款、储备和中间价偏离程度…</tspan></text><text x="1120" y="604" font-size="14" font-weight="700" fill="#b94f4f">核对线索</text><text x="1120" y="624" text-anchor="start" font-size="13" font-weight="500" fill="#52666d"><tspan x="1120" y="624">若只有汇率点位，没有资金与规则证据，不能把某一方向归</tspan><tspan x="1120" y="641">因于单一部门的意图。</tspan></text><rect x="70" y="692" width="1450" height="104" rx="14" fill="#e5eeea"/><rect x="70" y="692" width="14" height="104" rx="7" fill="#347a73"/><text x="112" y="735" font-size="17" font-weight="700" fill="#347a73">本节结论</text><text x="820" y="755" text-anchor="middle" font-size="22" font-weight="650" fill="#20343b"><tspan x="820" y="755">利差与汇率机制属于不同证据层级，市场成交、正式规则和传闻必须分开记录，不能用点位反推政策意图。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">内容要点由章节正文提炼；结构图呈现机制，不替代数据核验</text></svg>
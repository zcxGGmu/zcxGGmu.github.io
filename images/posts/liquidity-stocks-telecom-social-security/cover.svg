<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">流动性收紧下的股市、通信与社保</title><desc id="desc">流动性收紧下的股市、通信与社保的章节结构与重点信息。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#334155" stop-opacity="0.16"/><stop offset="1" stop-color="#334155" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#334155" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#334155"/><text x="80.0" y="155.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28.0px" font-weight="700" text-anchor="start"><tspan x="80.0" dy="0.0">文章导览 · 章节图谱</tspan></text><text x="80.0" y="245.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="60.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">流动性收紧下的股市、通信与社保</tspan></text><text x="80.0" y="319.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">以章节关系、关键数据与条件口径组织内容。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="390.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#334155" stroke-opacity="0.16"/></g><rect x="100.0" y="410.0" width="58" height="34" rx="17" fill="#334155"/><text x="129.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">01</text><text x="176.0" y="438.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">流动性开始变得挑剔</tspan></text><text x="102.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">股市波动背后，增量资金放缓使存量资金在资产之间快速转移。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="390.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#334155" stroke-opacity="0.16"/></g><rect x="832.0" y="410.0" width="58" height="34" rx="17" fill="#334155"/><text x="861.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">02</text><text x="908.0" y="438.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">通话需求变化与网络成本</tspan></text><text x="834.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">通话量下降而网络基础设施仍需运行，固定成本的压力更加明显。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="638.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#334155" stroke-opacity="0.16"/></g><rect x="100.0" y="658.0" width="58" height="34" rx="17" fill="#334155"/><text x="129.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">03</text><text x="176.0" y="686.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">社保实缴与养老基金</tspan></text><text x="102.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">缴费规范化带来当期支出，养老基金同时面对长期收支与投资安排。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="638.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#334155" stroke-opacity="0.16"/></g><rect x="832.0" y="658.0" width="58" height="34" rx="17" fill="#334155"/><text x="861.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">04</text><text x="908.0" y="686.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">重建值得停留的理由</tspan></text><text x="834.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">通信、资本市场与社保体系都需要提高信任、可预期性和长期参与的理由。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="886.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#334155" stroke-opacity="0.16"/></g><rect x="100.0" y="906.0" width="58" height="34" rx="17" fill="#334155"/><text x="129.0" y="930.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">05</text><text x="176.0" y="934.0" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">总述</tspan></text><text x="102.0" y="976.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">旧有规模红利减弱后，流动性会寻找更确定、可长期停留的系统。</tspan></text><text x="80.0" y="1140.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">阅读顺序：章节标题 → 关键数据 → 证据与条件</tspan></text>
</svg>
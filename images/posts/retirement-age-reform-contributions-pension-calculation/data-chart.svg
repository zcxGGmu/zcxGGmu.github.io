<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">延迟退休怎样影响个人缴费与养老金：先把变量算清</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">适用年龄</tspan></text><text x="236" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="236" y="490">性别类别、出生年月与弹性选择</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">缴费要求</tspan></text><text x="620" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="620" y="490">累计年限、缴费基数与月份</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">待遇构成</tspan></text><text x="1004" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1004" y="490">基础养老金与个人账户养老金</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">测算边界</tspan></text><text x="1388" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1388" y="490">参保地规则、工资假设与记录完整性</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项观察维度用于拆解问题，不构造缺少同口径依据的趋势数值。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">比较口径和年份以正文说明为准</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">外卖、免打扰与消失的邻居：原子化社会里普通人的最后防线</title>
  <desc id="desc">从拥挤地铁里的孤独感，到家庭、邻里、单位等中间纽带的瓦解，再到外卖免打扰、平台服务和利益交换对现实关系的替代，重新理解原子化社会如何形成，以及普通人如何在冷漠时代重建微型社群、附近温度、精神内核和普通人防线。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="0.56" stop-color="#0F766E"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

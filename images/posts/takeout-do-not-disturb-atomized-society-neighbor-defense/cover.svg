    <text x="132" y="664" fill="#0f172a" font-family="Noto Sans SC, PingFang SC, Arial" font-size="36" font-weight="800">社会观察 · 现代生活与共同体</text>
    <text x="132" y="707" fill="#0F766E" font-family="Noto Sans SC, PingFang SC, Arial" font-size="24" font-weight="700">16 min 深度梳理 · 外卖 · 免打扰 · 消失的邻居</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">二、零售门店要算单位经济，销售额只是第一行</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">收入、毛利、费用和现金流需按门店与品类拆开核对。</tspan></text>
<rect x="70" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#347a73" stroke-width="3"/><rect x="70" y="300" width="450" height="12" rx="6" fill="#347a73"/><circle cx="118" cy="362" r="24" fill="#347a73"/><text x="118" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">01</text><text x="158" y="369" font-size="17" font-weight="700" fill="#347a73">关键维度</text><text x="295" y="436" text-anchor="middle" font-size="20" font-weight="750" fill="#20343b"><tspan x="295" y="436">有效客流</tspan></text><path d="M100 473H490" stroke="#e3e9e5" stroke-width="2"/><text x="100" y="500" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="100" y="527" text-anchor="start" font-size="15" font-weight="500" fill="#30464d"><tspan x="100" y="527">门店的收入可以拆成有效客流、购买转化和平均客单三个因</tspan><tspan x="100" y="546">素。</tspan></text><text x="100" y="594" font-size="13" font-weight="700" fill="#347a73">核对线索</text><text x="100" y="606" text-anchor="start" font-size="12" font-weight="500" fill="#52666d"><tspan x="100" y="606">评价零售经营不能只看成交总额，还要观察每个营业日、每平方</tspan><tspan x="100" y="621">米和每类商品创造的贡献，并与门店承担的租金、工资、物流和</tspan><tspan x="100" y="636">后台成本匹配。</tspan></text><path d="M528 464H563" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="580" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#df8b4c" stroke-width="3"/><rect x="580" y="300" width="450" height="12" rx="6" fill="#df8b4c"/><circle cx="628" cy="362" r="24" fill="#df8b4c"/><text x="628" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">02</text><text x="668" y="369" font-size="17" font-weight="700" fill="#df8b4c">关键维度</text><text x="805" y="436" text-anchor="middle" font-size="20" font-weight="750" fill="#20343b"><tspan x="805" y="436">商品毛利</tspan></text><path d="M610 473H1000" stroke="#e3e9e5" stroke-width="2"/><text x="610" y="500" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="610" y="527" text-anchor="start" font-size="15" font-weight="500" fill="#30464d"><tspan x="610" y="527">要估算门店效率，还需要同一口径的门店面积、开业月份、</tspan><tspan x="610" y="546">同店销售、商品毛利、库存减值和营业天数。</tspan></text><text x="610" y="594" font-size="13" font-weight="700" fill="#df8b4c">核对线索</text><text x="610" y="614" text-anchor="start" font-size="12" font-weight="500" fill="#52666d"><tspan x="610" y="614">一套可用的经营账至少要分三层：交易层记录销售额、笔数、客</tspan><tspan x="610" y="629">单、缺货和退货；</tspan></text><path d="M1038 464H1073" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1090" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#b94f4f" stroke-width="3"/><rect x="1090" y="300" width="450" height="12" rx="6" fill="#b94f4f"/><circle cx="1138" cy="362" r="24" fill="#b94f4f"/><text x="1138" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">03</text><text x="1178" y="369" font-size="17" font-weight="700" fill="#b94f4f">关键维度</text><text x="1315" y="436" text-anchor="middle" font-size="20" font-weight="750" fill="#20343b"><tspan x="1315" y="436">门店费用</tspan></text><path d="M1120 473H1510" stroke="#e3e9e5" stroke-width="2"/><text x="1120" y="500" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="1120" y="536" text-anchor="start" font-size="15" font-weight="500" fill="#30464d"><tspan x="1120" y="536">商品层记录进销差价、折扣、报损与周转；</tspan></text><text x="1120" y="594" font-size="13" font-weight="700" fill="#b94f4f">核对线索</text><text x="1120" y="614" text-anchor="start" font-size="12" font-weight="500" fill="#52666d"><tspan x="1120" y="614">零售竞争力还体现在顾客能否稳定买到想要的商品，而不是只在</tspan><tspan x="1120" y="629">节假日挤满卖场。</tspan></text><rect x="70" y="692" width="1450" height="104" rx="14" fill="#e5eeea"/><rect x="70" y="692" width="14" height="104" rx="7" fill="#347a73"/><text x="112" y="735" font-size="17" font-weight="700" fill="#347a73">本节结论</text><text x="820" y="755" text-anchor="middle" font-size="22" font-weight="650" fill="#20343b"><tspan x="820" y="755">收入、毛利、费用和现金流需按门店与品类拆开核对。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">章节要点按正文机制提炼；各指标和结论的适用边界见正文</text></svg>
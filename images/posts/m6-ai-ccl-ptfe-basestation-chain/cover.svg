<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">高频覆铜板深度：AI 要的是 M6，PTFE 先在基站兑现</title>
  <desc id="desc">一篇围绕高频覆铜板中报分化的产业深度草稿：同样写着覆铜板，盈利能力为何从 31.8% 到 -5.8% 拉开差距；AI服务器真正需要的是 M6-M8 低损耗高速材料，而把 PTFE 写进主营的公司当前主要服务基站天线。</desc>

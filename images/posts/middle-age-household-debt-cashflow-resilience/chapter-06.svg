<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#316f72"/><stop offset="1" stop-color="#db9856"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#db9856"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">六、保险与公共保障分担家庭风险</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">核实已有保障、适用条件与实际缺口，再决定是否补充安排。</tspan></text>
<rect x="70" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#347a73" stroke-width="3"/><rect x="70" y="300" width="450" height="12" rx="6" fill="#347a73"/><circle cx="118" cy="362" r="24" fill="#347a73"/><text x="118" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">01</text><text x="158" y="369" font-size="17" font-weight="700" fill="#347a73">关键维度</text><text x="295" y="436" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="295" y="436">社会保障</tspan></text><path d="M100 473H490" stroke="#e3e9e5" stroke-width="2"/><text x="100" y="509" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="100" y="548" text-anchor="start" font-size="17" font-weight="500" fill="#30464d"><tspan x="100" y="548">家庭并非只能依靠存款承担所有风险。</tspan></text><text x="100" y="604" font-size="14" font-weight="700" fill="#347a73">核对线索</text><text x="100" y="632" text-anchor="start" font-size="13" font-weight="500" fill="#52666d"><tspan x="100" y="632">不同家庭适合的保障组合不同，保费应计入长期预算。</tspan></text><path d="M528 464H563" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="580" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#df8b4c" stroke-width="3"/><rect x="580" y="300" width="450" height="12" rx="6" fill="#df8b4c"/><circle cx="628" cy="362" r="24" fill="#df8b4c"/><text x="628" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">02</text><text x="668" y="369" font-size="17" font-weight="700" fill="#df8b4c">关键维度</text><text x="805" y="436" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="805" y="436">保险责任</tspan></text><path d="M610 473H1000" stroke="#e3e9e5" stroke-width="2"/><text x="610" y="509" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="610" y="537" text-anchor="start" font-size="17" font-weight="500" fill="#30464d"><tspan x="610" y="537">公共保障能够分担风险，但不意味着任何治疗、失</tspan><tspan x="610" y="559">业期限或养老支出都可被完全覆盖。</tspan></text><text x="610" y="604" font-size="14" font-weight="700" fill="#df8b4c">核对线索</text><text x="610" y="624" text-anchor="start" font-size="13" font-weight="500" fill="#52666d"><tspan x="610" y="624">社会保障信息最好按家庭成员分别登记，包括参保地、险</tspan><tspan x="610" y="641">种、缴费状态、商业保单和待遇申请材料。</tspan></text><path d="M1038 464H1073" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1090" y="300" width="450" height="360" rx="16" fill="#fff" stroke="#b94f4f" stroke-width="3"/><rect x="1090" y="300" width="450" height="12" rx="6" fill="#b94f4f"/><circle cx="1138" cy="362" r="24" fill="#b94f4f"/><text x="1138" y="369" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">03</text><text x="1178" y="369" font-size="17" font-weight="700" fill="#b94f4f">关键维度</text><text x="1315" y="436" text-anchor="middle" font-size="24" font-weight="750" fill="#20343b"><tspan x="1315" y="436">待遇资格</tspan></text><path d="M1120 473H1510" stroke="#e3e9e5" stroke-width="2"/><text x="1120" y="509" font-size="16" font-weight="700" fill="#52666d">内容要点</text><text x="1120" y="537" text-anchor="start" font-size="17" font-weight="500" fill="#30464d"><tspan x="1120" y="537">公共项目的资格可能随收入、居住地、年龄和家庭</tspan><tspan x="1120" y="559">状况变化，应定期向经办部门确认。</tspan></text><text x="1120" y="604" font-size="14" font-weight="700" fill="#b94f4f">核对线索</text><text x="1120" y="632" text-anchor="start" font-size="13" font-weight="500" fill="#52666d"><tspan x="1120" y="632">发生保障变化时及时更新受益人和联系方式。</tspan></text><rect x="70" y="692" width="1450" height="104" rx="14" fill="#e5eeea"/><rect x="70" y="692" width="14" height="104" rx="7" fill="#347a73"/><text x="112" y="735" font-size="17" font-weight="700" fill="#347a73">本节结论</text><text x="820" y="755" text-anchor="middle" font-size="22" font-weight="650" fill="#20343b"><tspan x="820" y="755">核实已有保障、适用条件与实际缺口，再决定是否补充安排。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">内容要点由章节正文提炼；结构图呈现机制，不替代数据核验</text></svg>
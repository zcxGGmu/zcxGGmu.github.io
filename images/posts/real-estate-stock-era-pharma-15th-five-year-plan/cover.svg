<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">房地产进入存量时代之后，医药为何成为重要接棒产业</title>
  <desc id="desc">房地产供求关系发生重大变化，意味着住房市场从增量扩张转向存量运营。本文从房价分化、人口流向、城镇化曲线、财富效应、就业结构和财政逻辑出发，解释存量时代的真实含义，并进一步拆解医药十五五规划中的3.5万亿规模、创新药年增速20%和FIC全球占比25%目标，以及AI赋能医药、海外市场与宏观风险之间的联系。</desc>

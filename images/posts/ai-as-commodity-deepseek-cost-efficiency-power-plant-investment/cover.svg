    <text x="152" y="665" fill="#0f766e" font-family="Noto Sans SC, PingFang SC, Arial" font-size="42" font-weight="800">AI=Commodity</text>
  </g>
  <text x="96" y="155" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="58" font-weight="800">像投资电厂一样投资 AI：</text><text x="96" y="227" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">大模型通用工业品化与 DeepSeek 的成本逻辑</text>
  <text x="100" y="315" fill="#f8fafc" opacity="0.92" font-family="Noto Sans SC, PingFang SC, Arial" font-size="36" font-weight="700">大模型 · 电厂逻辑 · 成本效率</text>
  <text x="102" y="382" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="28" font-weight="600">AI 大模型正在从互联网超级应用叙事转向通用工业品逻辑；真正的竞争核心不是用户粘性，而是成本</text>

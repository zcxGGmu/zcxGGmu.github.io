<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">为什么跟有的人聊天这么累？</title><desc id="desc">为什么跟有的人聊天这么累？的章节结构与重点信息。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#be123c" stop-opacity="0.16"/><stop offset="1" stop-color="#be123c" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#be123c" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#be123c"/><text x="80.0" y="155.0" fill="#be123c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28.0px" font-weight="700" text-anchor="start"><tspan x="80.0" dy="0.0">文章导览 · 章节图谱</tspan></text><text x="80.0" y="245.0" fill="#4c0519" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="60.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">为什么跟有的人聊天这么累？</tspan></text><text x="80.0" y="319.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">以章节关系、关键数据与条件口径组织内容。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="390.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#be123c" stroke-opacity="0.16"/></g><rect x="100.0" y="410.0" width="58" height="34" rx="17" fill="#be123c"/><text x="129.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">01</text><text x="176.0" y="438.0" fill="#4c0519" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">情绪劳动：倾听也需要管理情绪</tspan></text><text x="102.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">当真实感受与外在回应不一致时，倾听者还需额外管理表情、眼神和语气。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="390.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#be123c" stroke-opacity="0.16"/></g><rect x="832.0" y="410.0" width="58" height="34" rx="17" fill="#be123c"/><text x="861.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">02</text><text x="908.0" y="438.0" fill="#4c0519" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">对话式自恋：交流变成单向广播</tspan></text><text x="834.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">回应把注意力留给对方时可继续交流；迅速转回自己时，倾听与情绪管理负担集中在一方</tspan><tspan x="834.0" dy="23.0">。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="638.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#be123c" stroke-opacity="0.16"/></g><rect x="100.0" y="658.0" width="58" height="34" rx="17" fill="#be123c"/><text x="129.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">03</text><text x="176.0" y="686.0" fill="#4c0519" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">边界失效：拒绝无效会触发防御</tspan></text><text x="102.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">拒绝被反复忽略，可能削弱继续沟通的预期，并伴随更高的紧张和防御感。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="638.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#be123c" stroke-opacity="0.16"/></g><rect x="832.0" y="658.0" width="58" height="34" rx="17" fill="#be123c"/><text x="861.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">04</text><text x="908.0" y="686.0" fill="#4c0519" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">降低聊天消耗的三种做法</tspan></text><text x="834.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">管理注意力投入、减少强迫性表演，并在沟通无效时用简短行动结束互动。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="886.0" width="708.0" height="224.0" rx="22" fill="#ffffff" stroke="#be123c" stroke-opacity="0.16"/></g><rect x="100.0" y="906.0" width="58" height="34" rx="17" fill="#be123c"/><text x="129.0" y="930.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">05</text><text x="176.0" y="934.0" fill="#4c0519" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">疲惫感提示关系缺少互惠</tspan></text><text x="102.0" y="976.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">持续单向倾诉与回应不足可能让人减少表达；观察反复出现的互动模式有助于判断是否失</tspan><tspan x="102.0" dy="23.0">衡。</tspan></text><text x="80.0" y="1140.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">阅读顺序：章节标题 → 关键数据 → 证据与条件</tspan></text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="54" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="54">杰西·利弗莫尔：从14岁抄黑板到1907年一天赚一百万美元，真正改变命运的是什</tspan><tspan x="70" y="100">么</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">从杰西·利弗莫尔14岁在波士顿抄黑板起家、三进纽约、两次赔光，到1907年全国金融恐慌中一天赚到一百万美元，梳理价格记录、独立判</tspan><tspan x="72" y="162">断、等待与杠杆风险之间的关系。《股票大作手回忆录》留下的重点不是传奇收益，而是交易方法能否在不同市场环境中被验证和约束。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="231" y="456">连续记录价格与成交变化</tspan><tspan x="231" y="490">，形成可回看的市场事实</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="613" y="456">把市场信号与小道消息分</tspan><tspan x="613" y="490">开，建立独立判断</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="439" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="995" y="439">等待趋势和风险收益条件</tspan><tspan x="995" y="473">同时出现，再决定是否行</tspan><tspan x="995" y="507">动</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="439" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="1377" y="439">控制仓位与杠杆，把一次</tspan><tspan x="1377" y="473">判断放进可承受的交易系</tspan><tspan x="1377" y="507">统</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
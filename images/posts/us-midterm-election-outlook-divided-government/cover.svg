<rect x="80" y="80" width="1440" height="8" rx="4" fill="#1d4ed8"/><text x="80.0" y="155.0" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28.0px" font-weight="700" text-anchor="start"><tspan x="80.0" dy="0.0">文章导览 · 章节图谱</tspan></text><text x="80.0" y="245.0" fill="#172554" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="60.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">美国中期选举展望：共和党众议院承压，分立政府概率</tspan><tspan x="80.0" dy="72.0">上升</tspan></text><text x="80.0" y="391.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">以章节关系、关键数据与条件口径组织内容。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="462.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#1d4ed8" stroke-opacity="0.16"/></g><rect x="100.0" y="482.0" width="58" height="34" rx="17" fill="#1d4ed8"/><text x="129.0" y="506.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">01</text><text x="176.0" y="510.0" fill="#172554" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">中期选举的历史规律</tspan></text><text x="102.0" y="552.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">23次中期选举中，执政党失去众议院席位是常态，两党竞争趋于胶着时，席位变化更容</tspan><tspan x="102.0" dy="23.0">易影响控制权。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="462.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#1d4ed8" stroke-opacity="0.16"/></g><rect x="832.0" y="482.0" width="58" height="34" rx="17" fill="#1d4ed8"/><text x="861.0" y="506.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">02</text><text x="908.0" y="510.0" fill="#172554" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">三次逆势表现的特殊背景</tspan></text><text x="834.0" y="552.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">执政党逆势增加或守住席位的三次案例，分别伴随经济修复、高景气或国家安全冲击。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="686.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#1d4ed8" stroke-opacity="0.16"/></g><rect x="100.0" y="706.0" width="58" height="34" rx="17" fill="#1d4ed8"/><text x="129.0" y="730.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">03</text><text x="176.0" y="734.0" fill="#172554" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">当前经济与民意环境</tspan></text><text x="102.0" y="776.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">经济增长与低失业率并存于通胀压力之中，生活成本和支持率影响执政党的中期选举环境</tspan><tspan x="102.0" dy="23.0">。</tspan></text><g filter="url(#shadow)"><rect x="812.0" y="686.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#1d4ed8" stroke-opacity="0.16"/></g><rect x="832.0" y="706.0" width="58" height="34" rx="17" fill="#1d4ed8"/><text x="861.0" y="730.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">04</text><text x="908.0" y="734.0" fill="#172554" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="908.0" dy="0.0">基准情景：众议院易手，参议院仍有守住机会</tspan></text><text x="834.0" y="776.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="834.0" dy="0.0">基准展望指向众议院多数党更替；参议院改选规模和既有席位优势使共和党仍有守住机会</tspan><tspan x="834.0" dy="23.0">。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="910.0" width="708.0" height="200.0" rx="22" fill="#ffffff" stroke="#1d4ed8" stroke-opacity="0.16"/></g><rect x="100.0" y="930.0" width="58" height="34" rx="17" fill="#1d4ed8"/><text x="129.0" y="954.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">05</text><text x="176.0" y="958.0" fill="#172554" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">总述</tspan></text><text x="102.0" y="1000.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">历史问责规律、当前生活成本压力和偏低支持率共同构成基准判断，选举结局仍保留不确</tspan><tspan x="102.0" dy="23.0">定性。</tspan></text><text x="80.0" y="1140.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">阅读顺序：章节标题 → 关键数据 → 证据与条件</tspan></text>
</svg>
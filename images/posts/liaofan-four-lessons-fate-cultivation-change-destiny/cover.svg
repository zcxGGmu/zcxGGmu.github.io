    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#fff" stroke-width="3">
    <path d="M120 690 H1480"/><path d="M120 570 H1480"/><path d="M120 450 H1480"/><path d="M120 330 H1480"/>
    <path d="M300 240 V760"/><path d="M600 240 V760"/><path d="M900 240 V760"/><path d="M1200 240 V760"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M160 680 C320 570 470 620 650 485 C825 350 960 455 1160 305 C1290 190 1410 205 1500 130" fill="none" stroke="#f8fafc" stroke-width="15" stroke-linecap="round" opacity="0.88"/>
    <circle cx="650" cy="485" r="42" fill="#facc15"/><circle cx="1160" cy="305" r="50" fill="#f8fafc" opacity="0.92"/>
    <rect x="112" y="590" width="500" height="118" rx="24" fill="#f8fafc" opacity="0.94"/>
    <text x="152" y="665" fill="#7c2d12" font-family="Noto Sans SC, PingFang SC, Arial" font-size="42" font-weight="800">了凡四训</text>
  </g>
  <text x="96" y="155" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="58" font-weight="800">《了凡四训》：</text><text x="96" y="227" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">跳出宿命牢笼，用修身改写命运</text>
  <text x="100" y="315" fill="#f8fafc" opacity="0.92" font-family="Noto Sans SC, PingFang SC, Arial" font-size="36" font-weight="700">立命 · 改过 · 积善 · 谦德</text>
  <text x="102" y="382" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="28" font-weight="600">命运不是一句空泛口号，而是念头、行为、改过、积善与谦德长期累积的结果；真正的立命，是从今天开</text>

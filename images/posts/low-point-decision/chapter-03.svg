<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#f0b84b"/><stop offset="1" stop-color="#36c9c4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17345c" flood-opacity=".10"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1430" cy="120" r="210" fill="#f0b84b" opacity=".08"/><circle cx="70" cy="820" r="280" fill="#36c9c4" opacity=".07"/>
  <text x="92" y="82" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#f0b84b" text-anchor="start">03 / RISK MAP</text><text x="92" y="142" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="800" fill="#10233f" text-anchor="start">四类冲动，四种不同的风险</text>
  <rect x="92" y="172" width="168" height="8" rx="4" fill="url(#accent)"/>
  <rect x="120" y="260" width="1360" height="420" rx="24" fill="#ffffff" stroke="#d9e3f0" stroke-width="2"/><text x="180" y="325" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#5d6b82" text-anchor="start">冲动</text><text x="590" y="325" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#5d6b82" text-anchor="start">立即收益想象</text><text x="1000" y="325" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#5d6b82" text-anchor="start">隐藏成本</text><text x="180" y="400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="800" fill="#10233f" text-anchor="start">失业 → 创业</text><text x="590" y="400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="600" fill="#152238" text-anchor="start">快速恢复身份</text><text x="1000" y="400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#ef795f" text-anchor="start">库存、现金流、债务</text><text x="180" y="480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="800" fill="#10233f" text-anchor="start">亏损 → 追涨</text><text x="590" y="480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="600" fill="#152238" text-anchor="start">马上回本</text><text x="1000" y="480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#ef795f" text-anchor="start">风险集中、损失扩大</text><text x="180" y="560" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="800" fill="#10233f" text-anchor="start">单身 → 仓促结婚</text><text x="590" y="560" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="600" fill="#152238" text-anchor="start">结束不确定</text><text x="1000" y="560" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#ef795f" text-anchor="start">关系与财务压力叠加</text><text x="800" y="755" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#ef795f" text-anchor="middle">越想消除不确定，越可能把风险一次性锁死。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">阿里巴巴云业务的AI自我造血：从利润覆盖到估值重估</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="388">云利润覆盖AI费用（关系</tspan><tspan x="236" y="424">判断/待核验）</tspan></text><text x="236" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="236" y="478">需统一分部利润、研发、应用成本与资本开</tspan><tspan x="236" y="502">支口径</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="388">2026年12月季度（期</tspan><tspan x="620" y="424">间待核对）</tspan></text><text x="620" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="620" y="490">季度、财年和报告发布日期必须对齐</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="388">AI自我造血（条件性命</tspan><tspan x="1004" y="424">题）</tspan></text><text x="1004" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1004" y="490">持续现金贡献比单季会计利润更重要</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="388">Overweight/增</tspan><tspan x="1388" y="424">持（特定模型评级）</tspan></text><text x="1388" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1388" y="490">评级依赖预测、估值方法和风险假设</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
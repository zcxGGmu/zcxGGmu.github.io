    <path d="M300 240 V760"/><path d="M600 240 V760"/><path d="M900 240 V760"/><path d="M1200 240 V760"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M160 680 C320 570 470 620 650 485 C825 350 960 455 1160 305 C1290 190 1410 205 1500 130" fill="none" stroke="#f8fafc" stroke-width="15" stroke-linecap="round" opacity="0.88"/>
    <circle cx="650" cy="485" r="42" fill="#f59e0b"/><circle cx="1160" cy="305" r="50" fill="#f8fafc" opacity="0.92"/>
    <rect x="112" y="590" width="500" height="118" rx="24" fill="#f8fafc" opacity="0.94"/>
    <text x="152" y="665" fill="#92400e" font-family="Noto Sans SC, PingFang SC, Arial" font-size="42" font-weight="800">财富行动地图</text>
  </g>
  <text x="96" y="155" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="58" font-weight="800">《富爸爸穷爸爸》中国版财富行动地图：</text><text x="96" y="227" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">能学什么，不能照搬什么</text>
  <text x="100" y="315" fill="#f8fafc" opacity="0.92" font-family="Noto Sans SC, PingFang SC, Arial" font-size="36" font-weight="700">现金流 · 资产 · 风险校正</text>
  <text x="102" y="382" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="28" font-weight="600">《富爸爸穷爸爸》的价值在于财务启蒙，但不能照搬美国房地产、杠杆和税务叙事。中国家庭更现实的路</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">锂价年涨91%，电池股为何全线下跌</tspan></text>
<text x="72" y="117" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="117">围绕碳酸锂现货同比上涨91%、宁德时代股价一年下跌28%的反差，分析资源、材料、电芯、整车之间的利润传导，并讨论美国储能未来五年</tspan><tspan x="72" y="147">装机预计增长50%以上、LFP电芯成本一年上涨约12%对欧洲电池产业链的影响。T&amp;E与汽车行业的预测口径、具体目标价和各环节利润</tspan><tspan x="72" y="177">率未披露，市场判断仍需结合价格、库存、出货和现金流验证。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="231" y="456">锂资源价格与材料采购成</tspan><tspan x="231" y="490">本变化</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="613" y="456">正负极、LFP电芯和电</tspan><tspan x="613" y="490">池系统重新定价</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="995" y="456">汽车与储能客户承担或延</tspan><tspan x="995" y="490">后成本传导</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="1377" y="456">出货、现金流和预期变化</tspan><tspan x="1377" y="490">反映到电池股估值</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
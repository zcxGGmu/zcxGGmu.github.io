<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img">
<rect width="1200" height="760" fill="#f8fafc"/>
<text x="60" y="62" font-family="Noto Sans SC, Arial" font-size="32" font-weight="700" fill="#0f172a">京东方 × 康宁：玻璃基封装载板的进展与边界</text>
<text x="60" y="100" font-family="Noto Sans SC, Arial" font-size="18" fill="#64748b">重点不是“概念”，而是从材料协同、试验线、样品验证到量产收入的逐级确认。</text>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<g transform="translate(60,145)" filter="url(#shadow)">
  <rect x="0" y="0" width="230" height="128" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="24" y="38" font-family="Noto Sans SC, Arial" font-size="22" font-weight="700" fill="#075985">京东方能力底座</text>
  <text x="24" y="76" font-family="Noto Sans SC, Arial" font-size="16" fill="#334155">显示器件 / 显示模组</text>
  <text x="24" y="102" font-family="Noto Sans SC, Arial" font-size="16" fill="#334155">玻璃基加工 / 集成智造</text>
</g>
<g transform="translate(340,145)" filter="url(#shadow)">
  <rect x="0" y="0" width="230" height="128" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="24" y="38" font-family="Noto Sans SC, Arial" font-size="22" font-weight="700" fill="#166534">康宁材料协同</text>
  <text x="24" y="76" font-family="Noto Sans SC, Arial" font-size="16" fill="#334155">玻璃材料</text>
  <text x="24" y="102" font-family="Noto Sans SC, Arial" font-size="16" fill="#334155">半导体先进材料方案</text>
</g>
<g transform="translate(620,145)" filter="url(#shadow)">
  <rect x="0" y="0" width="230" height="128" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="24" y="38" font-family="Noto Sans SC, Arial" font-size="22" font-weight="700" fill="#92400e">合作备忘录</text>
  <text x="24" y="76" font-family="Noto Sans SC, Arial" font-size="16" fill="#334155">2026-05-20 签署</text>
  <text x="24" y="102" font-family="Noto Sans SC, Arial" font-size="16" fill="#334155">有效期三年</text>
</g>
<g transform="translate(900,145)" filter="url(#shadow)">
  <rect x="0" y="0" width="230" height="128" rx="16" fill="#fae8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="24" y="38" font-family="Noto Sans SC, Arial" font-size="22" font-weight="700" fill="#7e22ce">四个合作方向</text>
  <text x="24" y="76" font-family="Noto Sans SC, Arial" font-size="16" fill="#334155">玻璃基载板 / 折叠玻璃</text>
  <text x="24" y="102" font-family="Noto Sans SC, Arial" font-size="16" fill="#334155">钙钛矿玻璃 / 光互连</text>
</g>
<path d="M290 209 H340" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M570 209 H620" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M850 209 H900" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(70,340)">
  <text x="0" y="0" font-family="Noto Sans SC, Arial" font-size="26" font-weight="700" fill="#0f172a">玻璃基封装载板进展线</text>
  <line x1="20" y1="86" x2="1040" y2="86" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <circle cx="20" cy="86" r="14" fill="#0284c7"/><circle cx="225" cy="86" r="14" fill="#0284c7"/><circle cx="430" cy="86" r="14" fill="#0284c7"/>
  <circle cx="635" cy="86" r="14" fill="#0284c7"/><circle cx="840" cy="86" r="14" fill="#f97316"/><circle cx="1040" cy="86" r="14" fill="#ef4444"/>
  <text x="0" y="130" font-family="Noto Sans SC, Arial" font-size="18" font-weight="700" fill="#075985">2020</text>
  <text x="-10" y="158" font-family="Noto Sans SC, Arial" font-size="15" fill="#334155">技术调研</text>
  <text x="188" y="130" font-family="Noto Sans SC, Arial" font-size="18" font-weight="700" fill="#075985">2022</text>
  <text x="150" y="158" font-family="Noto Sans SC, Arial" font-size="15" fill="#334155">3.9 亿元晶圆级平台</text>
  <text x="390" y="130" font-family="Noto Sans SC, Arial" font-size="18" font-weight="700" fill="#075985">2024</text>
  <text x="350" y="158" font-family="Noto Sans SC, Arial" font-size="15" fill="#334155">9.93 亿元板级试验线</text>
  <text x="590" y="130" font-family="Noto Sans SC, Arial" font-size="18" font-weight="700" fill="#075985">2025</text>
  <text x="560" y="158" font-family="Noto Sans SC, Arial" font-size="15" fill="#334155">20 层样品开发送样</text>
  <text x="792" y="130" font-family="Noto Sans SC, Arial" font-size="18" font-weight="700" fill="#c2410c">2026H1</text>
  <text x="765" y="158" font-family="Noto Sans SC, Arial" font-size="15" fill="#334155">全自动化设备通线</text>
  <text x="990" y="130" font-family="Noto Sans SC, Arial" font-size="18" font-weight="700" fill="#991b1b">待验证</text>
  <text x="948" y="158" font-family="Noto Sans SC, Arial" font-size="15" fill="#334155">量产良率 / 收入确认</text>
</g>
<g transform="translate(70,565)">
  <rect x="0" y="0" width="1060" height="130" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="42" font-family="Noto Sans SC, Arial" font-size="22" font-weight="700" fill="#0f172a">当前状态：送样、概念认证、技术测试</text>
  <text x="28" y="82" font-family="Noto Sans SC, Arial" font-size="18" fill="#334155">已拉通 TGV 开孔、深孔填铜、增层、布线等全流程；试验线设计产能 1000 片/月。</text>
  <text x="28" y="112" font-family="Noto Sans SC, Arial" font-size="18" font-weight="700" fill="#b91c1c">边界：尚未批量生产，尚未实现量产营收；公司预计未来 2-3 年难以对经营业绩产生重大影响。</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img">
<rect width="1200" height="590" fill="#ffffff"/>
<text x="60" y="64" font-family="Noto Sans SC, Arial" font-size="34" font-weight="700" fill="#0f172a">2025 年业务收入结构</text>
<text x="60" y="100" font-family="Noto Sans SC, Arial" font-size="18" fill="#64748b">显示器件仍是绝对核心；物联网创新已有规模；MLED、传感、智慧医工仍是成长/期权层</text>
<text x="70" y="175" font-family="Noto Sans SC, Arial" font-size="22" fill="#0f172a">显示器件</text><rect x="220" y="150" width="744.0" height="32" rx="8" fill="#2563eb"/><text x="974.0" y="174" font-family="Arial" font-size="18" fill="#334155">1664.17 亿元</text><text x="70" y="250" font-family="Noto Sans SC, Arial" font-size="22" fill="#0f172a">物联网创新</text><rect x="220" y="225" width="174.1" height="32" rx="8" fill="#0f766e"/><text x="404.1" y="249" font-family="Arial" font-size="18" fill="#334155">389.49 亿元</text><text x="70" y="325" font-family="Noto Sans SC, Arial" font-size="22" fill="#0f172a">MLED</text><rect x="220" y="300" width="41.6" height="32" rx="8" fill="#7c3aed"/><text x="271.6" y="324" font-family="Arial" font-size="18" fill="#334155">93.16 亿元</text><text x="70" y="400" font-family="Noto Sans SC, Arial" font-size="22" fill="#0f172a">智慧医工</text><rect x="220" y="375" width="8.5" height="32" rx="8" fill="#16a34a"/><text x="238.5" y="399" font-family="Arial" font-size="18" fill="#334155">19.02 亿元</text><text x="70" y="475" font-family="Noto Sans SC, Arial" font-size="22" fill="#0f172a">传感</text><rect x="220" y="450" width="2.6" height="32" rx="8" fill="#f97316"/><text x="232.6" y="474" font-family="Arial" font-size="18" fill="#334155">5.87 亿元</text>
<text x="60" y="545" font-family="Noto Sans SC, Arial" font-size="16" fill="#64748b">注：公司分部存在“其他及抵销”，图中为各业务毛额口径，不简单相加为 100%。来源：2025 年年度报告。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img">
<rect width="1200" height="760" fill="#f8fafc"/>
<text x="60" y="64" font-family="Noto Sans SC, Arial" font-size="34" font-weight="700" fill="#0f172a">投资框架：三层价值与七类风险</text>
<g transform="translate(70,120)">
  <rect x="0" y="0" width="320" height="150" rx="18" fill="#dbeafe" stroke="#2563eb"/>
  <text x="24" y="46" font-family="Noto Sans SC, Arial" font-size="26" font-weight="700" fill="#1e3a8a">底层：LCD/成熟显示</text>
  <text x="24" y="88" font-family="Noto Sans SC, Arial" font-size="19" fill="#334155">看价格、稼动率、折旧、现金流</text>
  <text x="24" y="120" font-family="Noto Sans SC, Arial" font-size="17" fill="#64748b">利润和估值安全垫</text>
</g>
<g transform="translate(440,120)">
  <rect x="0" y="0" width="320" height="150" rx="18" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="24" y="46" font-family="Noto Sans SC, Arial" font-size="26" font-weight="700" fill="#134e4a">中层：OLED/车载/IT</text>
  <text x="24" y="88" font-family="Noto Sans SC, Arial" font-size="19" fill="#334155">看客户、良率、产品结构</text>
  <text x="24" y="120" font-family="Noto Sans SC, Arial" font-size="17" fill="#64748b">决定成长斜率</text>
</g>
<g transform="translate(810,120)">
  <rect x="0" y="0" width="320" height="150" rx="18" fill="#fee2e2" stroke="#dc2626"/>
  <text x="24" y="46" font-family="Noto Sans SC, Arial" font-size="26" font-weight="700" fill="#7f1d1d">期权：第 N 曲线</text>
  <text x="24" y="88" font-family="Noto Sans SC, Arial" font-size="19" fill="#334155">看送样、认证、量产收入</text>
  <text x="24" y="120" font-family="Noto Sans SC, Arial" font-size="17" fill="#64748b">提升长期平台想象</text>
</g>
<path d="M390 195 H440" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 195 H810" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>
<g transform="translate(70,360)">
  <rect x="0" y="0" width="1060" height="300" rx="20" fill="#fff" stroke="#e5e7eb"/>
  <text x="30" y="46" font-family="Noto Sans SC, Arial" font-size="26" font-weight="700" fill="#0f172a">关键风险监控</text>
  <text x="30" y="92" font-family="Noto Sans SC, Arial" font-size="20" fill="#334155">1 面板价格周期</text>
  <text x="330" y="92" font-family="Noto Sans SC, Arial" font-size="20" fill="#334155">2 终端需求与存储涨价</text>
  <text x="680" y="92" font-family="Noto Sans SC, Arial" font-size="20" fill="#334155">3 OLED 良率与折旧</text>
  <text x="30" y="150" font-family="Noto Sans SC, Arial" font-size="20" fill="#334155">4 新业务量产不确定性</text>
  <text x="330" y="150" font-family="Noto Sans SC, Arial" font-size="20" fill="#334155">5 资产减值与存货</text>
  <text x="680" y="150" font-family="Noto Sans SC, Arial" font-size="20" fill="#334155">6 地缘政治和客户合规</text>
  <text x="30" y="208" font-family="Noto Sans SC, Arial" font-size="20" fill="#334155">7 分红回购与资本开支平衡</text>
  <text x="30" y="260" font-family="Noto Sans SC, Arial" font-size="17" fill="#64748b">核心原则：不要把技术节点直接折现为利润；每条曲线都要核验“样品-认证-量产-收入-现金流”。</text>
</g>
</svg>
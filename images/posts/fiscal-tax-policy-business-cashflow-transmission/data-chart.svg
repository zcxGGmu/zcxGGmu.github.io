<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">财税政策如何传到企业经营：预算、征管与现金流</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">财政收支</tspan></text><text x="236" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="236" y="490">预算安排、收入来源与支出责任</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">税收规则</tspan></text><text x="620" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="620" y="490">税率、优惠资格和征管执行</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">企业传导</tspan></text><text x="1004" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1004" y="490">订单、成本、资金到位和回款</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">跟踪指标</tspan></text><text x="1388" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1388" y="490">预算执行、税款入库与经营数据</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项观察维度用于拆解问题，不构造缺少同口径依据的趋势数值。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">比较口径和年份以正文说明为准</text></svg>
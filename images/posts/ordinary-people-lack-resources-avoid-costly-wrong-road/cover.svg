  <text x="92" y="145" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">没有背景、没有资源，普通人到底该怎么办：</text><text x="92" y="215" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="42" font-weight="800">少走贵路，多留选择</text>
  <text x="96" y="322" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="30" font-weight="700">普通人缺的不只是钱，还有资源、人脉、经验和关键判断；真正的破局，是看清社会变化、找到适合自己的路，并保留重新</text>

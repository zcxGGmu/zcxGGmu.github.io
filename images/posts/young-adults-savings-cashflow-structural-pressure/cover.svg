<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#4b6878"/><stop offset="1" stop-color="#d58b4b"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d58b4b"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">为什么现在年轻人存不下钱：收入、固定支出与家庭现金流的结构性压力</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">从收入增长、住房与通勤成本、教育医疗支出、就业波动和家庭责任出发，解释年轻人储蓄率偏低的结构性原因，并建立一套可执行的现金流、应</tspan><tspan x="72" y="162">急金与长期积累框架。存钱困难不能只归结为消费冲动，收入质量和固定成本同样决定结余。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="231" y="465">收入增长与就业稳定决定</tspan><tspan x="231" y="492">储蓄上限</tspan></text><path d="M404 390H436" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="613" y="465">住房与家庭责任锁定现金</tspan><tspan x="613" y="492">流底线</tspan></text><path d="M786 390H818" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="995" y="465">预算与应急金降低短期脆</tspan><tspan x="995" y="492">弱性</tspan></text><path d="M1168 390H1200" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="1377" y="465">生产率和公共服务改善长</tspan><tspan x="1377" y="492">期结余</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
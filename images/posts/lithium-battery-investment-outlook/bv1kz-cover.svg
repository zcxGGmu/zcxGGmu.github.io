<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f1f3a"/>
      <stop offset="100%" stop-color="#162841"/>
    </linearGradient>
    <linearGradient id="lithium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#22d3ee">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
  </g>

  <!-- Battery icon - large central -->
  <g filter="url(#glowStrong)" opacity="0.08" transform="translate(850, 200)">
    <rect x="0" y="30" width="140" height="220" rx="12" fill="none" stroke="#22d3ee" stroke-width="30"/>
    <rect x="40" y="0" width="60" height="40" rx="8" fill="none" stroke="#22d3ee" stroke-width="30"/>
  </g>

  <!-- Lithium element symbol -->
  <g filter="url(#glow)" opacity="0.15" transform="translate(860, 280)">
    <text font-family="Plus Jakarta Sans, sans-serif" font-size="120" font-weight="800" fill="#22d3ee">Li</text>
  </g>

  <!-- Ore / mining iconography -->
  <g opacity="0.7">
    <!-- Left side - mountain/rock -->
    <polygon points="100,450 160,300 220,450" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
    <polygon points="180,450 240,340 300,450" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="140,450 200,370 260,450" fill="#22d3ee" opacity="0.08"/>
  </g>

  <!-- Supply chain arrows -->
  <g filter="url(#glow)" opacity="0.5">
    <path d="M 330 380 L 400 380" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <path d="M 330 410 L 400 410" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Chart bars -->
  <g filter="url(#glow)" opacity="0.7">
    <rect x="430" y="260" width="40" height="150" rx="3" fill="#22d3ee" opacity="0.3"/>
    <rect x="430" y="220" width="40" height="190" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    <line x1="470" y1="220" x2="500" y2="220" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
    <text x="510" y="224" font-family="JetBrains Mono, monospace" font-size="12" fill="#22d3ee" opacity="0.6">预期</text>

    <rect x="490" y="280" width="40" height="130" rx="3" fill="#f59e0b" opacity="0.3"/>
    <line x1="540" y1="280" x2="570" y2="280" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <text x="580" y="284" font-family="JetBrains Mono, monospace" font-size="12" fill="#f59e0b" opacity="0.6">实际</text>
  </g>

  <!-- Title -->
  <text x="60" y="140" font-family="Noto Sans SC, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="3">
    锂电投资内参
  </text>
  <text x="60" y="210" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="600" fill="#22d3ee" letter-spacing="2">
    上游最大的预期差与中游格局之争
  </text>

  <!-- Decorative line under title -->
  <line x1="60" y1="240" x2="620" y2="240" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>

  <!-- Key points -->
  <g transform="translate(60, 290)" opacity="0.75">
    <circle cx="8" cy="-4" r="4" fill="#22d3ee"/>
    <text x="22" y="0" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#cbd5e1">上游锂矿：供给不及预期是最大的预期差</text>

    <circle cx="8" cy="30" r="4" fill="#22c55e"/>
    <text x="22" y="34" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#cbd5e1">中游格局最优赛道：结构件、隔膜、铁锂正极</text>

    <circle cx="8" cy="64" r="4" fill="#f59e0b"/>
    <text x="22" y="68" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#cbd5e1">需求驱动：储能增速、电池出海与产能出清</text>
  </g>

  <!-- Footer -->
  <text x="60" y="580" font-family="JetBrains Mono, monospace" font-size="12" fill="#64748b" letter-spacing="2">
    LITHIUM BATTERY · SUPPLY CHAIN · INVESTMENT STRATEGY · 2026
  </text>
  <text x="1050" y="580" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#64748b" letter-spacing="1" text-anchor="end">
    zcxGGmu's Blog
  </text>
</svg>
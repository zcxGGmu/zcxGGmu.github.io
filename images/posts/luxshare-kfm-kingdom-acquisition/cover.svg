<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">立讯精密拟收购KFM王国57%股权：金属结构件布局与并表边界</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">立讯精密拟以6.84亿港元收购KFM王国57%股权，并认购可转债，以补强金属结构件业务与东南亚产能布局。交易进度、并表判断、可转债条款、客户认证</tspan><tspan x="72" y="162">和回报兑现仍需分别跟踪，短期财务贡献预计较小。</tspan></text>

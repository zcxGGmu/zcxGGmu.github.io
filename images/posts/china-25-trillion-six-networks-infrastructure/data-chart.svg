<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#3e6c75"/><stop offset="1" stop-color="#d68e4e"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d8894d"/></marker></defs><rect width="1600" height="900" fill="#f5f2eb"/><rect width="1600" height="175" fill="url(#head)"/><text x="68" y="82" font-size="39" font-weight="800" fill="#fff">关键数据与观察变量</text><text x="70" y="132" font-size="23" fill="#eff5ef">中国“六张网”基建：25万亿元投向水、电、算力与物流，增长逻辑变了吗？</text><rect x="64" y="270" width="340" height="245" rx="15" fill="#fff" stroke="#3e6c75" stroke-width="4"/><rect x="64" y="270" width="340" height="13" rx="6" fill="#3e6c75"/><text x="86" y="375" font-size="34" font-weight="800" fill="#182b36">25万亿元</text><text x="86" y="435" font-size="20" fill="#52666d">未来5年计划投资口径</text><rect x="446" y="270" width="340" height="245" rx="15" fill="#fff" stroke="#d68e4e" stroke-width="4"/><rect x="446" y="270" width="340" height="13" rx="6" fill="#d68e4e"/><text x="468" y="375" font-size="34" font-weight="800" fill="#182b36">约3%</text><text x="468" y="435" font-size="20" fill="#52666d">五年累计GDP占比口径</text><rect x="828" y="270" width="340" height="245" rx="15" fill="#fff" stroke="#56765b" stroke-width="4"/><rect x="828" y="270" width="340" height="13" rx="6" fill="#56765b"/><text x="850" y="375" font-size="34" font-weight="800" fill="#182b36">6张网</text><text x="850" y="435" font-size="20" fill="#52666d">水、电、算力、通信、物流、管网</text><rect x="1210" y="270" width="340" height="245" rx="15" fill="#fff" stroke="#3e6c75" stroke-width="4"/><rect x="1210" y="270" width="340" height="13" rx="6" fill="#3e6c75"/><text x="1232" y="375" font-size="34" font-weight="800" fill="#182b36">投资重点</text><text x="1232" y="435" font-size="20" fill="#52666d">新建与存量升级并重</text><text x="66" y="610" font-size="21" fill="#52666d">标注为标题/简介口径或结构变量；非连续统计项不构造趋势线</text><text x="70" y="842" font-size="20" fill="#5f7075">数据口径与判断边界见正文</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">ETF资金回流与放量反转：市场右侧信号如何验证</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">ETF资金回流、成交放量和指数反弹提供了观察市场情绪的线索；政策额度、中欧贸易环境与科技产业预期则影响基本面判断。把资金、价格、</tspan><tspan x="72" y="162">政策执行和盈利兑现分开跟踪，才能判断反弹是否具备延续条件。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="231" y="458">ETF申赎和成交变化反映</tspan><tspan x="231" y="488">短期资金参与程度</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="613" y="458">价格广度与行业扩散检验反</tspan><tspan x="613" y="488">弹是否超出少数权重股</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="995" y="458">财政与外贸政策经发行、执</tspan><tspan x="995" y="488">行和订单传导至经营活动</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#20343b"><tspan x="1377" y="458">盈利和现金流确认产业主题</tspan><tspan x="1377" y="488">能否转化为持续基本面</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">黄金价格的多重驱动：利率预期、ETF与央行需求</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">通胀数据</tspan></text><text x="236" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="236" y="478">总体与核心 CPI、同比和环比需分别标</tspan><tspan x="236" y="502">注</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">机会成本</tspan></text><text x="620" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="620" y="490">实际收益率及美元变化影响黄金持有吸引力</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">需求组成</tspan></text><text x="1004" y="490" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1004" y="490">投资、首饰、央行储备和科技用金结构不同</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">资金观察</tspan></text><text x="1388" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1388" y="478">ETF持仓吨数、资金流与金价表现分开核</tspan><tspan x="1388" y="502">验</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
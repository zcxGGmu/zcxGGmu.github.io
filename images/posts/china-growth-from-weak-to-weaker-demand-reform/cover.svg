<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从疲弱走向更疲弱：中国内需、债务与潜在增速的结构性风险</title>
  <desc id="desc">围绕7月经济数据、国债利率、钢铁需求、企业还本付息、就业结构和政策传导，拆解中国经济为何可能从周期性疲软演变为潜在增速中枢下移，并讨论供给侧政策、内需修复与必要改革之间的关键缺口。</desc>

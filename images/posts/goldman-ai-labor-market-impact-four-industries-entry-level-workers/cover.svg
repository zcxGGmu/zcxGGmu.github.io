    <circle cx="680" cy="455" r="34" fill="#ffffff" opacity="0.92"/><circle cx="1210" cy="270" r="44" fill="#f8fafc" opacity="0.96"/>
    <rect x="94" y="585" width="520" height="132" rx="26" fill="#ffffff" opacity="0.92"/>
    <text x="132" y="660" fill="#0f172a" font-family="Noto Sans SC, PingFang SC, Arial" font-size="38" font-weight="800">宏观经济 · AI就业</text>
    <text x="132" y="700" fill="#16a34a" font-family="Noto Sans SC, PingFang SC, Arial" font-size="25" font-weight="700">12 min 深度梳理</text>
  </g>
  <text x="92" y="145" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">AI 抢走工作了吗：</text><text x="92" y="215" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="42" font-weight="800">冲击正在集中于四个行业和一类人</text>
  <text x="96" y="322" fill="#e5e7eb" font-family="Noto Sans SC, PingFang SC, Arial" font-size="30" font-weight="700">AI 对就业的影响尚未全面体现在总量数据中，但呼叫中心、软件出版、管理咨询、广告服务和初级岗位已经先被改写。</text>

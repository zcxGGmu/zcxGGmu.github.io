<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 抢走工作了吗：冲击正在集中于四个行业和一类人</title>
  <desc id="desc">AI 对就业的影响尚未全面体现在总量数据中，但呼叫中心、软件出版、管理咨询、广告服务和初级岗位已经先被改写。</desc>

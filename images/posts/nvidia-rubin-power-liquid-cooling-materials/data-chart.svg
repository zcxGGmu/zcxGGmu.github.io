<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">NVIDIA Rubin与数据中心：液冷“三年扩产15倍”未核实、口径不明，并非NVIDIA官方计划</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">Rubin</tspan></text><text x="236" y="465" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="236" y="465">NVIDIA公布的AI计算平台</tspan><tspan x="236" y="490">名称；具体部署以官方产品资料为</tspan><tspan x="236" y="515">准</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">15倍</tspan></text><text x="620" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="620" y="478">液冷扩产说法缺少可核实的基期、</tspan><tspan x="620" y="503">产能单位和公司口径</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">未披露</tspan></text><text x="1004" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="1004" y="478">垂直供电方案在该平台中的量产节</tspan><tspan x="1004" y="503">点与供应商份额</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">未披露</tspan></text><text x="1388" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="1388" y="478">石墨烯散热材料对应的产品规格、</tspan><tspan x="1388" y="503">客户验证和收入规模</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
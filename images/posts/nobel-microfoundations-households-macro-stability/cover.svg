<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">诺贝尔经济学奖的微观基础：家庭决策如何进入宏观稳定</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">2026年经济学奖表彰 Robert E. Hall 与 Michael Woodford 关于宏观经济稳定的微观基础研究。理解</tspan><tspan x="72" y="162">家庭和企业如何形成预期，有助于分析政策传导，但不能把获奖理论直接当作当前家庭消费的单一解释。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="231" y="465">确定模型讨论的主体与决</tspan><tspan x="231" y="492">策问题</tspan></text><path d="M404 390H436" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="613" y="465">分析家庭和企业如何形成</tspan><tspan x="613" y="492">预期</tspan></text><path d="M786 390H818" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="995" y="465">追踪政策沟通到支出的传</tspan><tspan x="995" y="492">导环节</tspan></text><path d="M1168 390H1200" stroke="#df8b4c" stroke-width="6" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#20343b"><tspan x="1377" y="465">用分组数据检验解释是否</tspan><tspan x="1377" y="492">成立</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 正文说明关键变量、统计口径与判断边界</text></svg>
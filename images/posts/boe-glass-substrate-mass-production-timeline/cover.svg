<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">京东方定下玻璃基板量产时间表，投产只看良率和订单</tspan></text>
<text x="72" y="117" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="117">京东方在9月22日全球创新伙伴大会披露玻璃基板产业化时间表：未来一年内敲定两条量产线投资计划，目标在2027年一季度或上半年达成</tspan><tspan x="72" y="147">量产投资条件；公开实测显示翘曲改善16%、电感下降42%。文章区分投资条件、投产、量产和收入阶段，并梳理台积电、三星电机、英特尔</tspan><tspan x="72" y="177">、英伟达与SEMI在产业链中的不同验证位置。具体良率、订单金额、产能和利润尚未披露。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="231" y="473">材料与封装指标验证</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="613" y="473">量产线投资条件</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="995" y="473">良率爬坡与客户认证</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="473" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="1377" y="473">订单、交付与收入兑现</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
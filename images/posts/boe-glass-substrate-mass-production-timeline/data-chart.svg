<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">京东方定下玻璃基板量产时间表，投产只看良率和订单</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">2026年9月22日</tspan></text><text x="236" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="236" y="478">京东方在全球创新伙伴大会披露时</tspan><tspan x="236" y="503">间表</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">两条量产线</tspan></text><text x="620" y="490" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="620" y="490">未来一年内计划敲定投资安排</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="388">翘曲改善16% / 电感</tspan><tspan x="1004" y="424">下降42%</tspan></text><text x="1004" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="1004" y="478">已公开的实测技术指标，基准和样</tspan><tspan x="1004" y="503">本范围需继续核验</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">2027 / 2028</tspan></text><text x="1388" y="478" text-anchor="middle" font-size="17" font-weight="500" fill="#52666d"><tspan x="1388" y="478">京东方口径与SEMI预测的时间</tspan><tspan x="1388" y="503">节点，不是同一层级结论</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
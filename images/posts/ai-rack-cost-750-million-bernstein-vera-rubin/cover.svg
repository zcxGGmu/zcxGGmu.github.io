<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">AI机架成本预估下调至750万美元，谁的钱变少了</tspan></text>
<text x="72" y="117" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="117">围绕伯恩斯坦对Vera Rubin与AI数据中心机架成本的判断，拆解单台机架成本从910万美元下调至750万美元的含义，并解释3</tspan><tspan x="72" y="147">6GW出货量假设与美国2026年约18GW新增容量的口径差异。重点观察硬件、供电、散热、折旧和电费如何共同影响云厂商的资本开支与</tspan><tspan x="72" y="177">利润表；具体部件占比、供应商份额、订单金额和利润增量未披露。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="231" y="456">Vera Rubin系统规</tspan><tspan x="231" y="490">格与机架设计</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="613" y="456">硬件、供电、散热和网络形成</tspan><tspan x="613" y="490">单台成本</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="995" y="456">36GW出货与区域数据中心</tspan><tspan x="995" y="490">建设落地</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="1377" y="456">资本开支、折旧、电费传导至</tspan><tspan x="1377" y="490">云厂商利润</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
  <text x="96" y="155" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="58" font-weight="800">AI 自媒体副业：</text><text x="96" y="227" fill="#f8fafc" font-family="Noto Sans SC, PingFang SC, Arial" font-size="50" font-weight="800">普通人如何用工作流接住内容红利</text>

<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">潜在产出</tspan></text><text x="236" y="490" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="236" y="490">在既定技术和制度下可持续的产出水平</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">政策传导</tspan></text><text x="620" y="490" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="620" y="490">利率、信贷、支出与预期逐层影响需求</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">财政乘数</tspan></text><text x="1004" y="490" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="1004" y="490">随经济状态、政策组合和支出结构变化</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">菲利普斯关系</tspan></text><text x="1388" y="490" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="1388" y="490">短期关系受预期与供给冲击移动</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可
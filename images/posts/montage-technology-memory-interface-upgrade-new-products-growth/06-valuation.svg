<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">盈利预测与目标价框架</title>
  <desc id="desc">高估值需要持续利润增长来消化，目标价体现对长期成长曲线的定价。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="54" y="48" width="1092" height="12" rx="6" fill="#7c3aed"/>
  <text x="86" y="112" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">盈利预测与目标价框架</text>
  <text x="1076" y="112" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="800" fill="#14b8a6">FRAME 06</text>
  <g>
  <rect x="88" y="154" width="320" height="205" rx="22" fill="#eff6ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="88" y="154" width="320" height="10" rx="5" fill="#7c3aed"/>
  <text x="112" y="202" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">2026 收入</text>
  <text x="112" y="259" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">81.06 亿元</text>
  <text x="112" y="311" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">收入预测继续扩张</text>
</g><g>
  <rect x="432" y="154" width="320" height="205" rx="22" fill="#fff7ed" stroke="#14b8a6" stroke-width="2"/>
  <rect x="432" y="154" width="320" height="10" rx="5" fill="#14b8a6"/>
  <text x="456" y="202" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">2026 净利</text>
  <text x="456" y="259" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">42 亿元</text>
  <text x="456" y="311" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">EPS 约 3.44 元</text>
</g><g>
  <rect x="776" y="154" width="320" height="205" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="776" y="154" width="320" height="10" rx="5" fill="#10b981"/>
  <text x="800" y="202" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">2030 收入</text>
  <text x="800" y="259" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a">451.86 亿元</text>
  <text x="800" y="311" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">远期增长曲线陡峭</text>
</g><g>
  <rect x="88" y="396" width="320" height="205" rx="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="88" y="396" width="320" height="10" rx="5" fill="#8b5cf6"/>
  <text x="112" y="444" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">2030 净利</text>
  <text x="112" y="501" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a">212.10 亿元</text>
  <text x="112" y="553" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">盈利规模大幅放大</text>
</g><g>
  <rect x="432" y="396" width="320" height="205" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <rect x="432" y="396" width="320" height="10" rx="5" fill="#64748b"/>
  <text x="456" y="444" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">预测调整</text>
  <text x="456" y="501" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">-2%</text>
  <text x="456" y="553" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">CKD 爬坡略慢带来小幅下调</text>
</g><g>
  <rect x="776" y="396" width="320" height="205" rx="22" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <rect x="776" y="396" width="320" height="10" rx="5" fill="#ef4444"/>
  <text x="800" y="444" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">目标价</text>
  <text x="800" y="501" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a">380 元/</text>
<text x="800" y="534" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a">572 港元</text>
  <text x="800" y="553" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">A 股与港股均维持成长溢价</text>
</g>
</svg>

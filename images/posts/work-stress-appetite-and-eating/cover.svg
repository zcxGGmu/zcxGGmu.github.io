<title id="title">越忙越胖：压力、食欲与日常饮食的调整方法</title><desc id="desc">越忙越胖：压力、食欲与日常饮食的调整方法的章节结构与重点信息。</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea580c" stop-opacity="0.16"/><stop offset="1" stop-color="#ea580c" stop-opacity="0.02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect x="42" y="42" width="1516" height="1116" rx="34" fill="url(#hero)" stroke="#ea580c" stroke-opacity="0.16" stroke-width="2"/>
<rect x="80" y="80" width="1440" height="8" rx="4" fill="#ea580c"/><text x="80.0" y="155.0" fill="#ea580c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28.0px" font-weight="700" text-anchor="start"><tspan x="80.0" dy="0.0">文章导览 · 章节图谱</tspan></text><text x="80.0" y="245.0" fill="#431407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="60.0px" font-weight="800" text-anchor="start"><tspan x="80.0" dy="0.0">越忙越胖：压力、食欲与日常饮食的调整方法</tspan></text><text x="80.0" y="319.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27.0px" font-weight="400" text-anchor="start"><tspan x="80.0" dy="0.0">以章节关系、关键数据与条件口径组织内容。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="390.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.16"/></g><rect x="100.0" y="410.0" width="58" height="34" rx="17" fill="#ea580c"/><text x="129.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">01</text><text x="176.0" y="438.0" fill="#431407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">忙碌之后的食欲不是道德问题</tspan></text><text x="102.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">夜间食欲可能同时受到白天进食、工作压力和职业不确</tspan><tspan x="102.0" dy="23.0">定性影响。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="390.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.16"/></g><rect x="588.0" y="410.0" width="58" height="34" rx="17" fill="#ea580c"/><text x="617.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">02</text><text x="664.0" y="438.0" fill="#431407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">压力、睡眠与食欲信号</tspan></text><text x="590.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">压力和睡眠不足会影响饥饿与饱腹信号，实验结果是群</tspan><tspan x="590.0" dy="23.0">体观察值。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="390.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.16"/></g><rect x="1076.0" y="410.0" width="58" height="34" rx="17" fill="#ea580c"/><text x="1105.0" y="434.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">03</text><text x="1152.0" y="438.0" fill="#431407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">食物环境与注意力如何影响进食</tspan></text><text x="1078.0" y="480.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">外卖界面、糖油组合与屏幕分心会影响选择和饱腹体验</tspan><tspan x="1078.0" dy="23.0">。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="638.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.16"/></g><rect x="100.0" y="658.0" width="58" height="34" rx="17" fill="#ea580c"/><text x="129.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">04</text><text x="176.0" y="686.0" fill="#431407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">先吃什么：进食顺序与个体边界</tspan></text><text x="102.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">先蔬菜和蛋白质、再吃主食；对胃部敏感或糖尿病用药</tspan><tspan x="102.0" dy="23.0">者应调整。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="638.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.16"/></g><rect x="588.0" y="658.0" width="58" height="34" rx="17" fill="#ea580c"/><text x="617.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">05</text><text x="664.0" y="686.0" fill="#431407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">外卖和便利店也能拼出完整的一</tspan><tspan x="664.0" dy="30.5">餐</tspan></text><text x="590.0" y="759.0" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">通过烹饪方式、蔬菜、蛋白质和主食份量调整常见外卖</tspan><tspan x="590.0" dy="23.0">与便利店搭配。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="638.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.16"/></g><rect x="1076.0" y="658.0" width="58" height="34" rx="17" fill="#ea580c"/><text x="1105.0" y="682.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">06</text><text x="1152.0" y="686.0" fill="#431407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">给疲惫时段提前设计护栏</tspan></text><text x="1078.0" y="728.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">提前吃、调整环境和预先选菜单，减少晚间临时选择。</tspan></text><g filter="url(#shadow)"><rect x="80.0" y="886.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.16"/></g><rect x="100.0" y="906.0" width="58" height="34" rx="17" fill="#ea580c"/><text x="129.0" y="930.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">07</text><text x="176.0" y="934.0" fill="#431407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="176.0" dy="0.0">识别饥饿信号与情绪急救</tspan></text><text x="102.0" y="976.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="102.0" dy="0.0">先辨认口渴、真饿、情绪和社交，再选择对应处理方式</tspan><tspan x="102.0" dy="23.0">。</tspan></text><g filter="url(#shadow)"><rect x="568.0" y="886.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.16"/></g><rect x="588.0" y="906.0" width="58" height="34" rx="17" fill="#ea580c"/><text x="617.0" y="930.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">08</text><text x="664.0" y="934.0" fill="#431407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="664.0" dy="0.0">从自我审判转向恢复日常</tspan></text><text x="590.0" y="976.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="590.0" dy="0.0">身体指标需要正规检查；一顿偏离后恢复下一餐，不进</tspan><tspan x="590.0" dy="23.0">行极端补偿。</tspan></text><g filter="url(#shadow)"><rect x="1056.0" y="886.0" width="464.0" height="224.0" rx="22" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.16"/></g><rect x="1076.0" y="906.0" width="58" height="34" rx="17" fill="#ea580c"/><text x="1105.0" y="930.0" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19px" font-weight="800">09</text><text x="1152.0" y="934.0" fill="#431407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25.0px" font-weight="700" text-anchor="start"><tspan x="1152.0" dy="0.0">总述</tspan></text><text x="1078.0" y="976.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18.0px" font-weight="400" text-anchor="start"><tspan x="1078.0" dy="0.0">先补足白天正餐，再从睡眠、环境、注意力和情绪缓冲</tspan><tspan x="1078.0" dy="23.0">逐步调整。</tspan></text><text x="80.0" y="1140.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20.0px" font-weight="500" text-anchor="start"><tspan x="80.0" dy="0.0">阅读顺序：章节标题 → 关键数据 → 证据与条件</tspan></text>
</svg>
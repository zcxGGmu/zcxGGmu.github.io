  <title id="title">亏损为什么比盈利更上头：损失厌恶、看盘频率与交易规则</title>
  <desc id="desc">亏损痛感天然大于盈利快感，频繁看盘会放大情绪成本；真正可执行的解法，是把亏损写成保险费、降低采样频率，并让规则替自己执行。</desc>

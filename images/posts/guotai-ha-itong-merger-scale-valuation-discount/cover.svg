<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#355b76"/><stop offset="1" stop-color="#d89550"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d8894d"/></marker></defs><rect width="1600" height="900" fill="#f5f2eb"/><rect width="1600" height="175" fill="url(#head)"/><text x="68" y="82" font-size="39" font-weight="800" fill="#fff">国泰海通：2万亿元券商合并后的规模优势，能否抵消估值九折与整合成本？</text><text x="70" y="132" font-size="23" fill="#eff5ef">围绕国泰海通“2万亿元规模、估值九折”的关注点，拆解券商合并后的客户、资本与业务协同，以及系统整合、人员组织、资产质量和ROE兑现风险。</text><rect x="78" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#355b76" stroke-width="4"/><circle cx="118" cy="390" r="18" fill="#355b76"/><text x="228" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">资产与客户合并</text><path d="M383 430 L453 430" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="468" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#d89550" stroke-width="4"/><circle cx="508" cy="390" r="18" fill="#d89550"/><text x="618" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">系统与组织整合</text><path d="M773 430 L843 430" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="858" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#4e7c70" stroke-width="4"/><circle cx="898" cy="390" r="18" fill="#4e7c70"/><text x="1008" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">收入与成本协同</text><path d="M1163 430 L1233 430" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="1248" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#355b76" stroke-width="4"/><circle cx="1288" cy="390" r="18" fill="#355b76"/><text x="1398" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">ROE和估值重估</text><text x="70" y="842" font-size="20" fill="#5f7075">机制示意图 · 结构关系不代表确定的因果幅度</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#344f74"/><stop offset="1" stop-color="#d6884c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d8894d"/></marker></defs><rect width="1600" height="900" fill="#f5f2eb"/><rect width="1600" height="175" fill="url(#head)"/><text x="68" y="82" font-size="39" font-weight="800" fill="#fff">关键数据与观察变量</text><text x="70" y="132" font-size="23" fill="#eff5ef">高盛亚太确信买入名单更新：松下、宁德时代等六只新纳入，名单变化怎么看？</text><rect x="64" y="270" width="340" height="245" rx="15" fill="#fff" stroke="#344f74" stroke-width="4"/><rect x="64" y="270" width="340" height="13" rx="6" fill="#344f74"/><text x="86" y="375" font-size="34" font-weight="800" fill="#182b36">6只</text><text x="86" y="435" font-size="20" fill="#52666d">新纳入标的</text><rect x="446" y="270" width="340" height="245" rx="15" fill="#fff" stroke="#d6884c" stroke-width="4"/><rect x="446" y="270" width="340" height="13" rx="6" fill="#d6884c"/><text x="468" y="375" font-size="34" font-weight="800" fill="#182b36">2家</text><text x="468" y="435" font-size="20" fill="#52666d">车企调出</text><rect x="828" y="270" width="340" height="245" rx="15" fill="#fff" stroke="#55806a" stroke-width="4"/><rect x="828" y="270" width="340" height="13" rx="6" fill="#55806a"/><text x="850" y="375" font-size="34" font-weight="800" fill="#182b36">10月</text><text x="850" y="435" font-size="20" fill="#52666d">名单更新时点</text><rect x="1210" y="270" width="340" height="245" rx="15" fill="#fff" stroke="#344f74" stroke-width="4"/><rect x="1210" y="270" width="340" height="13" rx="6" fill="#344f74"/><text x="1232" y="375" font-size="34" font-weight="800" fill="#182b36">研究观点</text><text x="1232" y="435" font-size="20" fill="#52666d">不等于收益承诺</text><text x="66" y="610" font-size="21" fill="#52666d">标注为标题/简介口径或结构变量；非连续统计项不构造趋势线</text><text x="70" y="8
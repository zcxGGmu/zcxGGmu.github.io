<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#344f74"/><stop offset="1" stop-color="#d6884c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d8894d"/></marker></defs><rect width="1600" height="900" fill="#f5f2eb"/><rect width="1600" height="175" fill="url(#head)"/><text x="68" y="82" font-size="39" font-weight="800" fill="#fff">高盛亚太确信买入名单更新：松下、宁德时代等六只新纳入，名单变化怎么看？</text><text x="70" y="132" font-size="23" fill="#eff5ef">拆解高盛亚太10月确信买入名单的六只新增标的与两家车企调出信息，逐项映射行业驱动、公司兑现与估值风险；名单变化代表研究观点调整，不构成收益保证。</text><rect x="78" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#344f74" stroke-width="4"/><circle cx="118" cy="390" r="18" fill="#344f74"/><text x="228" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">名单调整</text><path d="M383 430 L453 430" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="468" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#d6884c" stroke-width="4"/><circle cx="508" cy="390" r="18" fill="#d6884c"/><text x="618" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">行业假设</text><path d="M773 430 L843 430" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="858" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#55806a" stroke-width="4"/><circle cx="898" cy="390" r="18" fill="#55806a"/><text x="1008" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">公司兑现</text><path d="M1163 430 L1233 430" stroke="#d8894d" stroke-width="7" marker-end="url(#arrow)"/><rect x="1248" y="355" width="300" height="150" rx="16" fill="#fff" stroke="#344f74" stroke-width="4"/><circle cx="1288" cy="390" r="18" fill="#344f74"/><text x="1398" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#182b36">估值与风险</text><text x="70" y="842
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">别把结构性压力归咎于年轻人：从代际评价到现实约束</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">对年轻人的评价经常停留在勤奋与懒惰、进取与躺平的二分法。把就业回报、住房门槛、婚育与照护、家庭支持和经济转型放回同一条传导链，可</tspan><tspan x="72" y="162">以看到许多选择是对风险和机会成本的理性回应。更准确的判断需要使用可支配收入、住房支出率、职业转换成本与保障覆盖等变量。</tspan></text>
<rect x="66" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="231" y="456">宏观转型改变行业与岗位</tspan><tspan x="231" y="490">结构</tspan></text><path d="M404 454H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="613" y="456">岗位回报与生活成本重塑</tspan><tspan x="613" y="490">长期承诺门槛</tspan></text><path d="M786 454H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="995" y="456">年轻人在竞争、延迟、降</tspan><tspan x="995" y="490">杠杆和转换之间分化</tspan></text><path d="M1168 454H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="360" width="330" height="190" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="456" text-anchor="middle" font-size="26" font-weight="700" fill="#20343b"><tspan x="1377" y="456">评价框架转向现金流、保</tspan><tspan x="1377" y="490">障与机会成本</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">核心关系示意 · 章节事实、数据口径与判断边界见正文</text></svg>
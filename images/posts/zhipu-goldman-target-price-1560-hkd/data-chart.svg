<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">智谱仍巨亏，高盛目标价1560港元，赌的是什么</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="388">2025年收入 7.24</tspan><tspan x="236" y="424">亿元人民币</tspan></text><text x="236" y="476" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="236" y="476">已披露年度收入，不等同于ARR，也不等同</tspan><tspan x="236" y="504">于未来收入</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="388">2025年净亏损 47亿</tspan><tspan x="620" y="424">元人民币</tspan></text><text x="620" y="476" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="620" y="476">与收入属于同一年度的损益口径，不能替代现</tspan><tspan x="620" y="504">金流</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="388">ARR指引 18亿美元→</tspan><tspan x="1004" y="424">30亿美元</tspan></text><text x="1004" y="476" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="1004" y="476">经营指引的变化，仍需通过合同、续费和回款</tspan><tspan x="1004" y="504">验证</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="388" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="388">12个月目标价 1560</tspan><tspan x="1388" y="424">港元</tspan></text><text x="1388" y="490" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="1388" y="490">高盛上调评级后的估值情景，不是价格结果</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">中美人工智能宏观影响如何比较：从投入到账本</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">比较人工智能投入转化为宏观产出的传导机制，区分资本、算力、能源、企业采用、劳动任务和生产率，并说明跨国数据与模型估算的边界。</tspan></text>

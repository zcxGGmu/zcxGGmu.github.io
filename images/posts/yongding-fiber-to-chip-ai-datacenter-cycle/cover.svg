<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">永鼎股份的周期跃迁：从光纤光缆厂到光芯片公司的估值重估</title>
  <desc id="desc">永鼎股份的核心变化，不是一个光模块或CPO概念标签，而是光纤光缆主业在AI数据中心需求拉动下重新进入高景气周期，同时公司向光芯片、无源光器件和光模块环节延伸。2026年上半年光通信收入12.35亿元、同比增长206.72%、毛利率58.52%，使业务结构、毛利率对标和估值框架都发生了变化。</desc>
  <defs>

    <circle cx="665" cy="468" r="32" fill="#ffffff" opacity="0.92"/><circle cx="1192" cy="282" r="42" fill="#f8fafc" opacity="0.96"/>
    <rect x="94" y="590" width="575" height="138" rx="26" fill="#ffffff" opacity="0.92"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#315b78"/><stop offset="1" stop-color="#df8b4c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df8b4c"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">港股恒生科技跌回低位后怎么看：信用周期、财政传导与赔率胜率</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">指数位置</tspan></text><text x="236" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="236" y="478">记录起点、回撤、反弹区间和观察日期；点</tspan><tspan x="236" y="502">位本身不能证明底部或趋势反转</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">信用与盈利</tspan></text><text x="620" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="620" y="478">跟踪社融、企业融资、居民贷款、盈利预期</tspan><tspan x="620" y="502">和现金流；分部门核对修复速度</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">政策传导</tspan></text><text x="1004" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1004" y="478">核对政策对象、额度、期限、执行主体、覆</tspan><tspan x="1004" y="502">盖率与居民可支配现金流</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">风险溢价</tspan></text><text x="1388" y="478" text-anchor="middle" font-size="16" font-weight="500" fill="#52666d"><tspan x="1388" y="478">观察美元利率、汇率、南向资金、盈利兑现</tspan><tspan x="1388" y="502">和估值分位的共同变化</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>
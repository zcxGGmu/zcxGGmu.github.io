<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#ef795f"/><stop offset="1" stop-color="#36c9c4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17345c" flood-opacity=".10"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1430" cy="120" r="210" fill="#ef795f" opacity=".08"/><circle cx="70" cy="820" r="280" fill="#36c9c4" opacity=".07"/>
  <text x="92" y="82" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#ef795f" text-anchor="start">02 / SCALE OF THE PROBLEM</text><text x="92" y="142" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="800" fill="#10233f" text-anchor="start">33亿与7.3亿：增长放缓的两种结果</text>
  <rect x="92" y="172" width="168" height="8" rx="4" fill="url(#accent)"/>
  <rect x="110" y="255" width="1380" height="430" rx="24" fill="#ffffff" stroke="#d9e3f0" stroke-width="2"/><text x="160" y="325" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#10233f" text-anchor="start">人均 GDP 增长明显放缓的国家</text><rect x="160" y="380" width="1050" height="62" rx="31" fill="#f5d3c8"/><rect x="160" y="380" width="1050" height="62" rx="31" fill="#ef795f" opacity=".86"/><text x="1280" y="425" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="800" fill="#ef795f" text-anchor="start">约33亿人</text><text x="160" y="545" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#10233f" text-anchor="start">人均 GDP 实际下降</text><rect x="160" y="600" width="1050" height="62" rx="31" fill="#d5efe4"/><rect x="160" y="600" width="250" height="62" rx="31" fill="#1eaa73" opacity=".9"/><text x="1280" y="645" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="800" fill="#1eaa73" text-anchor="start">超过7.3亿人</text><text x="160" y="755" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#5d6b82" text-anchor="start">两个数字表达的是规模与方向，不构成国家排名。</text></svg>
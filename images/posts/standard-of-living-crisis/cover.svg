  <circle cx="1430" cy="120" r="210" fill="#ef795f" opacity=".08"/><circle cx="70" cy="820" r="280" fill="#36c9c4" opacity=".07"/>
  <text x="92" y="82" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#ef795f" text-anchor="start">GLOBAL ECONOMY / HOUSEHOLD EXPERIENCE</text><text x="92" y="142" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="800" fill="#10233f" text-anchor="start">经济在增长，生活却在变难</text>
  <rect x="92" y="172" width="168" height="8" rx="4" fill="url(#accent)"/>
  
      <rect x="92" y="235" width="680" height="490" rx="24" fill="#ffffff" stroke="#d9e3f0" stroke-width="2"/><text x="132" y="290" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#5d6b82" text-anchor="start">宏观总量</text><text x="132" y="348" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="800" fill="#10233f" text-anchor="start">增长</text>
      <path d="M145 625 C250 560 300 610 390 500 S535 480 620 385 S710 410 740 330" fill="none" stroke="#2f74ff" stroke-width="14" stroke-linecap="round"/><circle cx="740" cy="330" r="15" fill="#2f74ff"/>
      <text x="132" y="690" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="600" fill="#152238" text-anchor="start">GDP 继续增加，不等于每个家庭都感到变富。</text>
      <rect x="835" y="235" width="670" height="225" rx="24" fill="#fff4ef" stroke="#f6d9cc" stroke-width="2"/><text x="880" y="300" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="55" font-weight="800" fill="#ef795f" text-anchor="start">约 33 亿</text><text x="880" y="350" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#152238" text-anchor="start">人所在国家的人均 GDP 增长明显放缓</text><text x="880" y="405" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="500" fill="#5d6b82" text-anchor="start">口径：页面描述中的全球规模判断</text>
      <rect x="835" y="505" width="670" height="220" rx="24" fill="#eefbf6" stroke="#cfeee0" stroke-width="2"/><text x="880" y="570" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="55" font-weight="800" fill="#1eaa73" text-anchor="start">超过 7.3 亿</text><text x="880" y="620" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#152238" text-anchor="start">人的人均 GDP 出现实际下降</text><text x="880" y="675" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="500" fill="#5d6b82" text-anchor="start">保留“超过”与“约”，不延伸统计年份</text></svg>
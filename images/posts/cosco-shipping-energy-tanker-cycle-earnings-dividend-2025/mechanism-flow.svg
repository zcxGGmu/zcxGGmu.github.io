<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#1f6070"/><stop offset="1" stop-color="#e3a14d"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#e3a14d"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">从关键变量到结果的传导路径</tspan></text>
<text x="72" y="132" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="132">以中远海能2025年度报告和末期利润分配方案公告为口径，梳理油轮运价与航线、船队利用率、分部毛利及股东回报之间的关系，并区分公司</tspan><tspan x="72" y="162">披露与市场预期。</tspan></text>
<rect x="66" y="355" width="330" height="205" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><circle cx="110" cy="405" r="23" fill="#347a73"/><text x="110" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="231" y="478" text-anchor="middle" font-size="25" font-weight="700" fill="#20343b"><tspan x="231" y="478">油品贸易与航线需求</tspan></text><path d="M404 455H436" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="448" y="355" width="330" height="205" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><circle cx="492" cy="405" r="23" fill="#df8b4c"/><text x="492" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="613" y="478" text-anchor="middle" font-size="25" font-weight="700" fill="#20343b"><tspan x="613" y="478">运距和船舶供给共同定价</tspan></text><path d="M786 455H818" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="830" y="355" width="330" height="205" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><circle cx="874" cy="405" r="23" fill="#b94f4f"/><text x="874" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="995" y="461" text-anchor="middle" font-size="25" font-weight="700" fill="#20343b"><tspan x="995" y="461">运价经利用率进入分部收</tspan><tspan x="995" y="495">入</tspan></text><path d="M1168 455H1200" stroke="#df8b4c" stroke-width="7" marker-end="url(#arrow)"/><rect x="1212" y="355" width="330" height="205" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><circle cx="1256" cy="405" r="23" fill="#567c56"/><text x="1256" y="412" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1377" y="461" text-anchor="middle" font-size="25" font-weight="700" fill="#20343b"><tspan x="1377" y="461">成本与资本结构决定利润</tspan><tspan x="1377" y="495">和分红</tspan></text><rect x="66" y="635" width="1450" height="86" rx="10" fill="#e5eeea"/><text x="790" y="679" text-anchor="middle" font-size="22" font-weight="550" fill="#43575d"><tspan x="790" y="679">每一步都需要可观察的数据或经营进展支撑，不能由单个信号直接推导结果。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">流程为机制梳理，不代表收益保证或固定传导时滞</text></svg>
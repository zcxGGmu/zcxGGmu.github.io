<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#347a73"/><stop offset="1" stop-color="#b94f4f"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#b94f4f"/></marker></defs>
<rect width="1600" height="900" fill="#f3f5f2"/><rect width="1600" height="195" fill="url(#head)"/>
<text x="70" y="77" text-anchor="start" font-size="38" font-weight="800" fill="#ffffff"><tspan x="70" y="77">关键数据与观察变量</tspan></text>
<text x="72" y="147" text-anchor="start" font-size="22" font-weight="500" fill="#f3f7f4"><tspan x="72" y="147">生益科技：销量只涨14%，收入却涨47%！这只“周期股”正在变成AI材料定价者？</tspan></text>
<rect x="62" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#347a73" stroke-width="4"/><rect x="62" y="315" width="348" height="14" rx="7" fill="#347a73"/><text x="236" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="236" y="406">销量增长14%</tspan></text><text x="236" y="476" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="236" y="476">数量端的已知变化，需确认统计单位、期间和</tspan><tspan x="236" y="504">产品范围</tspan></text><rect x="446" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#df8b4c" stroke-width="4"/><rect x="446" y="315" width="348" height="14" rx="7" fill="#df8b4c"/><text x="620" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="620" y="406">收入增长47%</tspan></text><text x="620" y="476" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="620" y="476">金额端增速高于销量，不能直接等同于单价涨</tspan><tspan x="620" y="504">幅</tspan></text><rect x="830" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#b94f4f" stroke-width="4"/><rect x="830" y="315" width="348" height="14" rx="7" fill="#b94f4f"/><text x="1004" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1004" y="406">14% vs 47%</tspan></text><text x="1004" y="476" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="1004" y="476">数量、价格、结构和客户组合共同决定收入差</tspan><tspan x="1004" y="504">异</tspan></text><rect x="1214" y="315" width="348" height="260" rx="12" fill="#fff" stroke="#567c56" stroke-width="4"/><rect x="1214" y="315" width="348" height="14" rx="7" fill="#567c56"/><text x="1388" y="406" text-anchor="middle" font-size="28" font-weight="800" fill="#20343b"><tspan x="1388" y="406">待核验</tspan></text><text x="1388" y="476" text-anchor="middle" font-size="19" font-weight="500" fill="#52666d"><tspan x="1388" y="476">毛利率、订单、份额、产品占比和客户名单未</tspan><tspan x="1388" y="504">提供</tspan></text><rect x="62" y="625" width="1470" height="95" rx="10" fill="#e9ece7"/><text x="797" y="675" text-anchor="middle" font-size="21" font-weight="550" fill="#43575d"><tspan x="797" y="675">四项信息卡仅呈现可核对数字、概念或观察变量；不构造缺乏来源的趋势曲线。</tspan></text><text x="70" y="850" font-size="18" fill="#5e7073">数量级、期间与比较口径以正文说明为准</text></svg>